ing the business case", "en": "We need to align the experience with the unit economics.", "fr": "Il faut aligner l'expérience avec l'économie du magasin.", "note": ""}, {"category": "Making the business case", "en": "The cost of doing nothing is higher.", "fr": "Le coût de l'inaction est plus élevé.", "note": ""}, {"category": "Making the business case", "en": "This is an investment, not a cost.", "fr": "C'est un investissement, pas une dépense.", "note": ""}, {"category": "Making the business case", "en": "The risk is contained: we test in one store first.", "fr": "Le risque est maîtrisé : on teste d'abord dans un magasin.", "note": ""}, {"category": "Making the business case", "en": "It scales without adding complexity.", "fr": "Cela passe à l'échelle sans ajouter de complexité.", "note": ""}, {"category": "Running a meeting", "en": "Thank you all for making the time.", "fr": "Merci à tous d'avoir pris le temps.", "note": ""}, {"category": "Running a meeting", "en": "The purpose of today is to agree on …", "fr": "L'objectif d'aujourd'hui est de nous accorder sur …", "note": ""}, {"category": "Running a meeting", "en": "Let us start with a quick round of updates.", "fr": "Commençons par un tour rapide des points d'avancement.", "note": ""}, {"category": "Running a meeting", "en": "Could you take us through your proposal?", "fr": "Pouvez-vous nous présenter votre proposition ?", "note": ""}, {"category": "Running a meeting", "en": "Let me stop you there for a second.", "fr": "Permettez-moi de vous arrêter un instant.", "note": ""}, {"category": "Running a meeting", "en": "Can we park that and come back to it?", "fr": "Peut-on mettre cela de côté et y revenir ?", "note": ""}, {"category": "Running a meeting", "en": "I want to hear from those who have not spoken yet.", "fr": "Je voudrais entendre ceux qui n'ont pas encore parlé.", "note": ""}, {"category": "Running a meeting", "en": "To wrap up, the next steps are …", "fr": "Pour conclure, les prochaines étapes sont …", "note": ""}, {"category": "Running a meeting", "en": "Who owns this action, and by when?", "fr": "Qui porte cette action, et pour quand ?", "note": ""}, {"category": "Running a meeting", "en": "I will circulate a short recap today.", "fr": "Je diffuse un court compte rendu aujourd'hui.", "note": ""}, {"category": "Negotiating", "en": "I would like to understand the full scope of the role first.", "fr": "Je voudrais d'abord comprendre le périmètre complet du poste.", "note": ""}, {"category": "Negotiating", "en": "I am confident we will find a package in line with the role.", "fr": "Je suis confiant que nous trouverons un package à la hauteur du poste.", "note": ""}, {"category": "Negotiating", "en": "Is there flexibility on the start date?", "fr": "Y a-t-il de la souplesse sur la date de démarrage ?", "note": ""}, {"category": "Negotiating", "en": "What does the relocation support include?", "fr": "Que comprend l'accompagnement à la mobilité ?", "note": ""}, {"category": "Negotiating", "en": "Could we agree on a review after six months?", "fr": "Pourrions-nous convenir d'une revue après six mois ?", "note": ""}, {"category": "Negotiating", "en": "I would want to see that reflected in the scope.", "fr": "Je voudrais voir cela reflété dans le périmètre.", "note": ""}, {"category": "Negotiating", "en": "Let us find something that works for both sides.", "fr": "Trouvons une solution qui convienne aux deux parties.", "note": ""}, {"category": "Negotiating", "en": "I am open on the structure, less so on the level of responsibility.", "fr": "Je suis ouvert sur la structure, moins sur le niveau de responsabilité.", "note": ""}, {"category": "Negotiating", "en": "Could you put that in writing?", "fr": "Pourriez-vous le mettre par écrit ?", "note": ""}, {"category": "Negotiating", "en": "I would need a little time to consider it.", "fr": "J'aurais besoin d'un peu de temps pour y réfléchir.", "note": ""}, {"category": "Presenting a project", "en": "Let me walk you through the project.", "fr": "Laissez-moi vous présenter le projet pas à pas.", "note": ""}, {"category": "Presenting a project", "en": "The brief was to …", "fr": "La demande était de …", "note": ""}, {"category": "Presenting a project", "en": "The challenge was to …", "fr": "La difficulté était de …", "note": ""}, {"category": "Presenting a project", "en": "My approach was to …", "fr": "Mon approche a été de …", "note": ""}, {"category": "Presenting a project", "en": "What we delivered was …", "fr": "Ce que nous avons livré, c'est …", "note": ""}, {"category": "Presenting a project", "en": "The result was …", "fr": "Le résultat a été …", "note": ""}, {"category": "Presenting a project", "en": "As you can see on this slide, …", "fr": "Comme vous le voyez sur cette diapositive, …", "note": ""}, {"category": "Presenting a project", "en": "What I would like you to take away is …", "fr": "Ce que je voudrais que vous reteniez, c'est …", "note": ""}, {"category": "Presenting a project", "en": "Here, the idea is to slow the customer down.", "fr": "Ici, l'idée est de ralentir le client.", "note": ""}, {"category": "Presenting a project", "en": "I will pause here, in case there are questions.", "fr": "Je fais une pause ici, au cas où il y aurait des questions.", "note": ""}, {"category": "Interview devices (spoken)", "en": "I think the key is …", "fr": "Je pense que l'essentiel est …", "note": "Frequent in professionals' interviews"}, {"category": "Interview devices (spoken)", "en": "It is really about …", "fr": "Il s'agit vraiment de …", "note": ""}, {"category": "Interview devices (spoken)", "en": "What we learned along the way is …", "fr": "Ce que nous avons appris en chemin, c'est …", "note": ""}, {"category": "Interview devices (spoken)", "en": "When we first decided to …, we …", "fr": "Quand nous avons décidé de …, nous avons …", "note": ""}, {"category": "Interview devices (spoken)", "en": "I feel like that is what sets us apart.", "fr": "J'ai le sentiment que c'est ce qui nous distingue.", "note": ""}, {"category": "Interview devices (spoken)", "en": "It is a matter of …", "fr": "Tout est une question de …", "note": ""}, {"category": "Interview devices (spoken)", "en": "Because once you …, the rest follows.", "fr": "Parce qu'une fois que l'on …, le reste suit.", "note": ""}, {"category": "Interview devices (spoken)", "en": "I would have to say …", "fr": "Je dirais que …", "note": ""}, {"category": "Interview devices (spoken)", "en": "And there is something powerful about …", "fr": "Et il y a quelque chose de puissant dans …", "note": ""}, {"category": "Interview devices (spoken)", "en": "You know, it is a bit like …", "fr": "Vous savez, c'est un peu comme …", "note": "To introduce an analogy"}, {"category": "Interview devices (spoken)", "en": "If I look back, the real lesson was …", "fr": "Avec le recul, la vraie leçon a été …", "note": ""}, {"category": "Interview devices (spoken)", "en": "What surprised me was …", "fr": "Ce qui m'a surpris, c'est …", "note": ""}, {"category": "Emails and LinkedIn", "en": "Dear [Name], I am writing to …", "fr": "Cher … , je vous écris pour …", "note": ""}, {"category": "Emails and LinkedIn", "en": "Thank you for your time yesterday.", "fr": "Merci du temps que vous m'avez accordé hier.", "note": ""}, {"category": "Emails and LinkedIn", "en": "I am following up on my application for …", "fr": "Je reviens vers vous au sujet de ma candidature pour …", "note": ""}, {"category": "Emails and LinkedIn", "en": "Could we speak for twenty minutes in the coming weeks?", "fr": "Pourrions-nous échanger vingt minutes dans les semaines à venir ?", "note": ""}, {"category": "Emails and LinkedIn", "en": "I would welcome a conversation about …", "fr": "Je serais heureux d'échanger au sujet de …", "note": ""}, {"category": "Emails and LinkedIn", "en": "Please find my CV attached.", "fr": "Vous trouverez mon CV en pièce jointe.", "note": ""}, {"category": "Emails and LinkedIn", "en": "I would be glad to share a few examples of my work.", "fr": "Je serais ravi de partager quelques exemples de mon travail.", "note": ""}, {"category": "Emails and LinkedIn", "en": "I came across your work on …, and it resonated with me.", "fr": "Je suis tombé sur votre travail sur …, et il m'a parlé.", "note": ""}, {"category": "Emails and LinkedIn", "en": "Best regards, Laurent Perret", "fr": "Cordialement, Laurent Perret", "note": ""}, {"category": "Following up", "en": "Thank you for the opportunity to meet.", "fr": "Merci de cette occasion de vous rencontrer.", "note": ""}, {"category": "Following up", "en": "I remain very interested in the role.", "fr": "Le poste continue de m'intéresser vivement.", "note": ""}, {"category": "Following up", "en": "What are the next steps, and when can I expect to hear from you?", "fr": "Quelles sont les prochaines étapes, et quand puis-je attendre un retour ?", "note": ""}, {"category": "Following up", "en": "I wanted to circle back on our conversation.", "fr": "Je voulais revenir sur notre échange.", "note": ""}, {"category": "Following up", "en": "Is there anything further I can provide to help your decision?", "fr": "Puis-je fournir autre chose pour éclairer votre décision ?", "note": ""}, {"category": "CONEX: group and subsidiary", "en": "The subsidiary needs speed, and the group needs transparency.", "fr": "La filiale a besoin de vitesse, le groupe de transparence.", "note": "Key sentence"}, {"category": "CONEX: group and subsidiary", "en": "Let us agree on what the subsidiary decides alone and what goes up to the group.", "fr": "Convenons de ce que la filiale décide seule et de ce qui remonte au groupe.", "note": ""}, {"category": "CONEX: group and subsidiary", "en": "I would keep the reporting light, but regular.", "fr": "Je garderais un reporting léger, mais régulier.", "note": ""}, {"category": "CONEX: group and subsidiary", "en": "I would start by listening: every site, before I change anything.", "fr": "Je commencerais par écouter chaque site avant de changer quoi que ce soit.", "note": ""}, {"category": "CONEX: group and subsidiary", "en": "Who holds the final say on pricing and on hiring?", "fr": "Qui a le dernier mot sur les prix et sur les recrutements ?", "note": "Question to ask"}, {"category": "CONEX: group and subsidiary", "en": "How does the subsidiary share the group's client relationships?", "fr": "Comment la filiale partage-t-elle les relations clients du groupe ?", "note": "Question to ask"}, {"category": "CONEX: group and subsidiary", "en": "That is a question for the group finance team, and I would work with them closely.", "fr": "C'est une question pour la direction financière du groupe, avec laquelle je travaillerais étroitement.", "note": ""}, {"category": "CONEX: group and subsidiary", "en": "I have worked inside groups before, so I know how governance and budgets work.", "fr": "J'ai déjà travaillé dans des groupes : je connais la gouvernance et les budgets.", "note": ""}, {"category": "CONEX: finance and P&L", "en": "I own the P&L, and I read the numbers every week.", "fr": "Je suis responsable du compte de résultat et je lis les chiffres chaque semaine.", "note": "Key sentence"}, {"category": "CONEX: finance and P&L", "en": "The scale is different, but the discipline is the same: margin, cash, forecasts.", "fr": "L'échelle diffère, la discipline est la même : marge, trésorerie, prévisions.", "note": ""}, {"category": "CONEX: finance and P&L", "en": "I would look at unit economics per device and per store.", "fr": "J'analyserais la rentabilité unitaire par appareil et par magasin.", "note": ""}, {"category": "CONEX: finance and P&L", "en": "Where a variance appears, I want to know why, and what we do about it.", "fr": "Quand un écart apparaît, je veux savoir pourquoi et ce que nous faisons.", "note": ""}, {"category": "CONEX: finance and P&L", "en": "Recurring services build stability, and hardware opens the door.", "fr": "Les services récurrents apportent la stabilité, le matériel ouvre la porte.", "note": ""}, {"category": "CONEX: finance and P&L", "en": "I would be the single point of contact for the auditors.", "fr": "Je serais l'interlocuteur unique des auditeurs.", "note": ""}, {"category": "CONEX: finance and P&L", "en": "I would rather check the numbers before I commit to a view.", "fr": "Je préfère vérifier les chiffres avant de m'engager sur un avis.", "note": ""}, {"category": "CONEX: finance and P&L", "en": "We should separate one-off revenue from recurring revenue.", "fr": "Séparons le chiffre d'affaires ponctuel du chiffre d'affaires récurrent.", "note": ""}, {"category": "CONEX: finance and P&L", "en": "I am a commercial and operational leader, so I build strong finance support from day one.", "fr": "Je suis un dirigeant commercial et opérationnel : je construis un solide soutien financier dès le premier jour.", "note": "Candid answer on the finance gap"}, {"category": "CONEX: commercial and tenders", "en": "Let me understand what the brand is really buying.", "fr": "Laissez-moi comprendre ce que la marque achète vraiment.", "note": ""}, {"category": "CONEX: commercial and tenders", "en": "I price the whole package: device, installation, content and service.", "fr": "Je chiffre l'ensemble : appareil, installation, contenu et service.", "note": ""}, {"category": "CONEX: commercial and tenders", "en": "I trade volume or duration against price, never price alone.", "fr": "J'échange volume ou durée contre le prix, jamais le prix seul.", "note": ""}, {"category": "CONEX: commercial and tenders", "en": "We answer in four parts: the need, the technical offer, the rollout plan and the commercial terms.", "fr": "Nous répondons en quatre parties : besoin, offre technique, plan de déploiement, conditions commerciales.", "note": ""}, {"category": "CONEX: commercial and tenders", "en": "Delivery dates are part of the price.", "fr": "Les délais de livraison font partie du prix.", "note": ""}, {"category": "CONEX: commercial and tenders", "en": "The group's relationships open doors, and delivery keeps them open.", "fr": "Les relations du groupe ouvrent des portes, la livraison les garde ouvertes.", "note": ""}, {"category": "CONEX: commercial and tenders", "en": "A purchasing director buys reliability as much as price.", "fr": "Un directeur des achats achète autant la fiabilité que le prix.", "note": ""}, {"category": "CONEX: commercial and tenders", "en": "I would rather decline a deal than promise a date we cannot meet.", "fr": "Je préfère renoncer à un contrat plutôt que promettre une date intenable.", "note": ""}, {"category": "CONEX: international team", "en": "One weekly call, at a time that works for both sides.", "fr": "Un point hebdomadaire, à une heure qui convient aux deux côtés.", "note": ""}, {"category": "CONEX: international team", "en": "Let us write the goals down and review them together.", "fr": "Écrivons les objectifs et revoyons-les ensemble.", "note": ""}, {"category": "CONEX: international team", "en": "Each site has a local lead who owns the day-to-day.", "fr": "Chaque site a un responsable local qui porte le quotidien.", "note": ""}, {"category": "CONEX: international team", "en": "Let me check the time zones before we fix the date.", "fr": "Je vérifie les fuseaux horaires avant de fixer la date.", "note": ""}, {"category": "CONEX: international team", "en": "I will send the summary and the action items after the call.", "fr": "J'envoie le compte rendu et les actions après l'appel.", "note": ""}, {"category": "CONEX: international team", "en": "Could you say a bit more about how this works on your side?", "fr": "Pouvez-vous préciser comment cela fonctionne de votre côté ?", "note": ""}, {"category": "CONEX: international team", "en": "I want to be sure we are aligned before we go further.", "fr": "Je veux m'assurer que nous sommes alignés avant d'aller plus loin.", "note": ""}, {"category": "CONEX: international team", "en": "Let us take that offline and come back to it on Thursday.", "fr": "Traitons cela hors réunion et revenons-y jeudi.", "note": ""}, {"category": "CONEX: in-store digital", "en": "A screen should disappear into the merchandising, not sit on top of it.", "fr": "Un écran doit se fondre dans le merchandising, non s'y poser par-dessus.", "note": "Key sentence"}, {"category": "CONEX: in-store digital", "en": "The device has to earn its place on the counter.", "fr": "L'appareil doit mériter sa place sur le comptoir.", "note": ""}, {"category": "CONEX: in-store digital", "en": "What does it change for the shopper: dwell time, understanding, conversion?", "fr": "Qu'est-ce que cela change pour la cliente : temps passé, compréhension, transformation ?", "note": ""}, {"category": "CONEX: in-store digital", "en": "The technology serves the advisor, and never replaces her.", "fr": "La technologie sert la conseillère et ne la remplace jamais.", "note": ""}, {"category": "CONEX: in-store digital", "en": "Remote monitoring means fewer visits, a lower cost and a smaller footprint.", "fr": "La supervision à distance réduit les visites, le coût et l'empreinte.", "note": ""}, {"category": "CONEX: in-store digital", "en": "We design the device to be repaired, recycled and monitored for energy use.", "fr": "Nous concevons l'appareil pour être réparé, recyclé et suivi en consommation d'énergie.", "note": ""}, {"category": "CONEX: in-store digital", "en": "The content should tell a story, not repeat a price.", "fr": "Le contenu doit raconter une histoire, non répéter un prix.", "note": ""}, {"category": "CONEX: in-store digital", "en": "In luxury, the technology should be felt, not seen.", "fr": "Dans le luxe, la technologie doit se ressentir, non se voir.", "note": ""}, {"category": "Visual merchandising (trade press)", "en": "By blending a rugged industrial interior with natural materials, …", "fr": "En associant un intérieur industriel brut à des matériaux naturels, …", "note": "Opening; finish with the effect"}, {"category": "Visual merchandising (trade press)", "en": "… gives the space a touch of tech feel.", "fr": "… donne à l'espace une touche technologique.", "note": ""}, {"category": "Visual merchandising (trade press)", "en": "We designed the fixtures to be mobile and modular, so that they can be merged at any time.", "fr": "Nous avons conçu les meubles mobiles et modulaires, pour qu'ils puissent être regroupés à tout moment.", "note": "Corrected: fixtures (plural), mobile and"}, {"category": "Visual merchandising (trade press)", "en": "They can be easily reconfigured.", "fr": "Ils se reconfigurent facilement.", "note": "Corrected: reconfigured"}, {"category": "Visual merchandising (trade press)", "en": "From floor-to-ceiling windows, …", "fr": "Depuis les baies vitrées du sol au plafond, …", "note": "Template"}, {"category": "Visual merchandising (trade press)", "en": "The spaces are slated to open next year.", "fr": "Les espaces doivent ouvrir l'an prochain.", "note": "slated to = scheduled to"}, {"category": "Visual merchandising (trade press)", "en": "The concept's underlying idea is to make fragrance discovery easier and product benefits clearer.", "fr": "L'idée sous-jacente du concept est de faciliter la découverte des parfums et de clarifier les bénéfices produit.", "note": "Added: is"}, {"category": "Visual merchandising (trade press)", "en": "To that end, the layout includes flexible feature walls, immersive testing stations and dedicated discovery zones designed to encourage hands-on exploration of fragrances and formulas.", "fr": "À cette fin, l'implantation comprend des murs d'accroche modulables, des stations de test immersives et des zones de découverte dédiées, conçues pour inviter à explorer parfums et formules de ses propres mains.", "note": "Describing a layout"}, {"category": "Visual merchandising (trade press)", "en": "Specific features of the new layout include an Eau de Parfum bar that encourages fragrance discovery.", "fr": "Parmi les atouts du nouvel agencement : un bar à Eau de Parfum qui encourage la découverte.", "note": ""}, {"category": "Visual merchandising (trade press)", "en": "The space is also home to enhanced signage and product storytelling.", "fr": "L'espace accueille aussi une signalétique renforcée et une mise en récit des produits.", "note": ""}, {"category": "Visual merchandising (trade press)", "en": "… in a fresh, engaging way …", "fr": "… de façon nouvelle et engageante …", "note": "Template"}, {"category": "Visual merchandising (trade press)", "en": "… is one meaningful step in our ongoing commitment to building more welcoming environments.", "fr": "… est une étape significative dans notre engagement continu à créer des environnements plus accueillants.", "note": "Brand voice, formal"}, {"category": "Visual merchandising (trade press)", "en": "… provides a range of retail signage and graphics designed to support branded environments and customer experiences.", "fr": "… propose une gamme de signalétique et de graphisme conçus pour soutenir les univers de marque et les expériences clients.", "note": "Supplier voice"}, {"category": "Visual merchandising (trade press)", "en": "… makes a unique first impression.", "fr": "… crée une première impression unique.", "note": ""}, {"category": "Visual merchandising (trade press)", "en": "Eyes are drawn to the striking …", "fr": "Le regard est attiré par le saisissant …", "note": "Template: add the feature"}, {"category": "Visual merchandising (trade press)", "en": "… capturing attention from outside the boutique.", "fr": "… captant l'attention depuis l'extérieur de la boutique.", "note": "Façade and windows"}, {"category": "Visual merchandising (trade press)", "en": "… designed for guests to test the products.", "fr": "… conçu pour que les clients testent les produits.", "note": "Corrected: the products"}, {"category": "Visual merchandising (trade press)", "en": "… inviting customers to sample the cosmetics.", "fr": "… invitant les clientes à essayer les cosmétiques.", "note": ""}, {"category": "Visual merchandising (trade press)", "en": "… put the products at the forefront.", "fr": "… mettent les produits au premier plan.", "note": ""}, {"category": "Visual merchandising (trade press)", "en": "The light fixtures draw attention and create a visual balance within the space.", "fr": "Les luminaires attirent le regard et créent un équilibre visuel dans l'espace.", "note": ""}, {"category": "Visual merchandising (trade press)", "en": "… to shield and separate the rooms.", "fr": "… pour protéger et séparer les pièces.", "note": "Partitions, screens"}, {"category": "Webinar: trust, faith, loyalty", "en": "Buying is not the end point: it marks the start of a relationship.", "fr": "Acheter n'est pas une fin : c'est le début d'une relation.", "note": "Paraphrase of the webinar"}, {"category": "Webinar: trust, faith, loyalty", "en": "Let us move away from single transactions and focus on lifelong value.", "fr": "Passons des transactions isolées à la valeur vie client.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "Trust sparks faith, and faith cultivates loyalty.", "fr": "La confiance fait naître la foi, et la foi cultive la fidélité.", "note": "Short quote from the webinar (Ian Johnston, Quinine)"}, {"category": "Webinar: trust, faith, loyalty", "en": "Acquiring a customer costs several times more than keeping one.", "fr": "Acquérir un client coûte plusieurs fois plus cher que le conserver.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "Every solution will be slightly different for each brand.", "fr": "Chaque solution sera légèrement différente pour chaque marque.", "note": ""}, {"category": "Webinar: trust, faith, loyalty", "en": "Cost signalling backfires if the signals are not genuine.", "fr": "Le signal coûteux se retourne contre la marque s'il n'est pas sincère.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "Choosing not to fill the space with more products is what builds trust.", "fr": "Renoncer à remplir l'espace de produits supplémentaires est ce qui crée la confiance.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "Consistency does not mean one size fits all.", "fr": "La cohérence ne veut pas dire une seule taille pour tous.", "note": ""}, {"category": "Webinar: trust, faith, loyalty", "en": "The architecture changes from store to store, but the customer journey stays consistent.", "fr": "L'architecture change d'un magasin à l'autre, le parcours client reste cohérent.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "Think of the store as your staff's office.", "fr": "Considérez le magasin comme le bureau de vos équipes.", "note": "Idea from the Q&A"}, {"category": "Webinar: trust, faith, loyalty", "en": "If you commit to a feature, stay the course: do not remove it after a few months.", "fr": "Si vous vous engagez sur un service, tenez le cap : ne le retirez pas après quelques mois.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "Digital in store should always be human first.", "fr": "Le digital en magasin doit toujours placer l'humain d'abord.", "note": "Short quote"}, {"category": "Webinar: trust, faith, loyalty", "en": "Personalisation shows customers that their preferences matter.", "fr": "La personnalisation montre aux clients que leurs préférences comptent.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "A repair service shows accountability, care and commitment to satisfaction.", "fr": "Un service de réparation montre responsabilité, attention et engagement envers la satisfaction.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "We need to help senior leaders make brave decisions.", "fr": "Nous devons aider les dirigeants à prendre des décisions courageuses.", "note": "Useful for a design director"}, {"category": "Webinar: trust, faith, loyalty", "en": "High-end materials signal credibility and commitment, rather than exclusivity.", "fr": "Les matériaux haut de gamme signalent crédibilité et engagement plus qu'exclusivité.", "note": "Paraphrase of an answer"}, {"category": "Webinar: trust, faith, loyalty", "en": "Retail needs a new point of view, beyond sales per square foot.", "fr": "Le commerce a besoin d'un nouveau point de vue, au-delà du chiffre d'affaires au mètre carré.", "note": "Paraphrase"}, {"category": "Webinar: trust, faith, loyalty", "en": "A store is a tangible place where trust is built through what the brand actually does.", "fr": "Un magasin est un lieu tangible où la confiance se construit par ce que la marque fait réellement.", "note": "Paraphrase"}, {"category": "Business small talk (spoken)", "en": "Let's circle back.", "fr": "Revenons-y plus tard.", "note": "Reporter un sujet à plus tard, poliment."}, {"category": "Business small talk (spoken)", "en": "Let me loop you in.", "fr": "Je vous mets dans la boucle.", "note": "Ajouter quelqu'un à une conversation ou un mail."}, {"category": "Business small talk (spoken)", "en": "I will get back to you.", "fr": "Je reviens vers vous.", "note": "Promesse de réponse : donner une date."}, {"category": "Business small talk (spoken)", "en": "Does that work for you?", "fr": "Cela vous convient-il ?", "note": "Vérifier l'accord à la fin d'une proposition."}, {"category": "Business small talk (spoken)", "en": "Just to clarify.", "fr": "Pour être clair.", "note": "Introduire une reformulation."}, {"category": "Business small talk (spoken)", "en": "Let's touch base.", "fr": "Faisons un point rapide.", "note": "Échange court, souvent informel."}, {"category": "Business small talk (spoken)", "en": "Bear with me.", "fr": "Patientez un instant.", "note": "Gagner quelques secondes pour réfléchir."}, {"category": "Business small talk (spoken)", "en": "I will look into it.", "fr": "Je regarde cela.", "note": "Prendre en charge sans s'engager sur le résultat."}, {"category": "Business small talk (spoken)", "en": "Could you walk me through it?", "fr": "Pouvez-vous me l'expliquer pas à pas ?", "note": "Demander une explication détaillée."}, {"category": "Business small talk (spoken)", "en": "Let's wrap this up.", "fr": "Concluons.", "note": "Clôturer une réunion ou un point."}, {"category": "Business small talk (spoken)", "en": "Pretty good, thanks.", "fr": "Plutôt bien, merci.", "note": "Réponse courante à « How are you? »."}, {"category": "Business small talk (spoken)", "en": "Couldn't be better.", "fr": "Ça ne pourrait pas aller mieux.", "note": "Réponse très positive."}, {"category": "Questions to ask the interviewer", "en": "What is the most critical outcome this role needs to drive?", "fr": "Quel est le résultat le plus critique que ce poste doit produire ?", "note": "À poser en fin d'entretien."}, {"category": "Questions to ask the interviewer", "en": "What is the biggest constraint or reality someone stepping into this role needs to understand quickly?", "fr": "Quelle est la plus grande contrainte, ou réalité, que la personne qui prend ce poste doit comprendre vite ?", "note": "À poser en fin d'entretien."}, {"category": "Business small talk (spoken)", "en": "I felt thrilled when the client approved the concept.", "fr": "J'étais ravi quand le client a validé le concept.", "note": "« I felt » + émotion : raconter une réaction."}, {"category": "Business small talk (spoken)", "en": "I iron out the details before the meeting.", "fr": "Je règle les derniers détails avant la réunion.", "note": "Verbe à particule : to iron out."}], "niveauc": [{"type": "Expressive adjectives", "en": "compelling", "meaning": "convincing and hard to ignore", "fr": "convaincant, captivant", "example": "We need a compelling story for the flagship.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "seamless", "meaning": "without visible joins or friction", "fr": "fluide, sans rupture", "example": "The online and in-store journey feels seamless.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "tactile", "meaning": "pleasing to touch; rich in texture", "fr": "tactile", "example": "The tactile materials invite customers to linger.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "understated", "meaning": "quietly elegant, not showy", "fr": "sobre, discret", "example": "The boutique has an understated luxury.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "opulent", "meaning": "richly and visibly luxurious", "fr": "opulent", "example": "The entrance hall is opulent without being heavy.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "restrained", "meaning": "controlled, not excessive", "fr": "retenu, mesuré", "example": "We chose a restrained palette of stone and oak.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "refined", "meaning": "elegant and carefully perfected", "fr": "raffiné", "example": "The detailing is refined down to the last joint.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "bold", "meaning": "strong and daring", "fr": "audacieux, affirmé", "example": "A bold colour on the feature wall anchors the floor.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "cohesive", "meaning": "forming a unified whole", "fr": "cohérent, homogène", "example": "We want a cohesive universe across all formats.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "intuitive", "meaning": "easy to grasp without instructions", "fr": "intuitif", "example": "The layout is intuitive: customers find the category at once.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "immersive", "meaning": "absorbing the visitor in an environment", "fr": "immersif", "example": "The flagship offers an immersive fragrance journey.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "evocative", "meaning": "calling strong images or feelings to mind", "fr": "évocateur", "example": "The lighting is evocative of a desert evening.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "iconic", "meaning": "widely recognised as a symbol", "fr": "emblématique", "example": "The bottle wall became the iconic image of the brand.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "pragmatic", "meaning": "practical, focused on what works", "fr": "pragmatique", "example": "I take a pragmatic approach to rollout.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "nuanced", "meaning": "showing fine distinctions", "fr": "nuancé", "example": "That is a nuanced question: it depends on the format.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "rigorous", "meaning": "exacting and thorough", "fr": "rigoureux", "example": "We apply a rigorous approval process.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "resilient", "meaning": "able to recover and adapt", "fr": "résilient", "example": "A resilient network adapts quickly to a shock.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "agile", "meaning": "able to move and adapt quickly", "fr": "agile", "example": "We need an agile design team for the pilot stores.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "granular", "meaning": "detailed at a fine level", "fr": "fin, précis", "example": "I want a granular view of sales by zone.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "pivotal", "meaning": "of crucial importance", "fr": "décisif, charnière", "example": "That pilot was pivotal for the whole rollout.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "instrumental", "meaning": "playing a key role in achieving something", "fr": "déterminant", "example": "I was instrumental in building the allocation tool.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "meticulous", "meaning": "extremely careful about detail", "fr": "méticuleux", "example": "Her planogram work is meticulous.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "discerning", "meaning": "having good judgement and taste", "fr": "averti, exigeant", "example": "Our customers are discerning and well informed.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "aspirational", "meaning": "inspiring a wish to belong or to achieve", "fr": "d'aspiration", "example": "It is an aspirational brand with an accessible entry price.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "curated", "meaning": "selected and arranged with care", "fr": "sélectionné avec soin", "example": "A curated edit of twelve brands sits on the first floor.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "effortless", "meaning": "appearing to need no effort", "fr": "naturel, sans effort", "example": "The service should feel effortless.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "sleek", "meaning": "smooth, clean, elegant in line", "fr": "épuré, élégant", "example": "The sleek fixtures keep the sightlines open.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "warm", "meaning": "emotionally inviting", "fr": "chaleureux", "example": "Timber and soft light make the space warm.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "inviting", "meaning": "tempting, welcoming", "fr": "accueillant", "example": "The threshold is generous and inviting.", "register": "neutral"}, {"type": "Expressive adjectives", "en": "cluttered", "meaning": "crowded with too many things", "fr": "encombré", "example": "The old layout felt cluttered.", "register": "critical"}, {"type": "Expressive adjectives", "en": "sterile", "meaning": "cold, lacking character", "fr": "froid, impersonnel", "example": "The result was clean but sterile.", "register": "critical"}, {"type": "Expressive adjectives", "en": "generic", "meaning": "lacking a distinctive character", "fr": "génériq ore an interview", "s": "My three questions to ask", "t": "My three questions to ask"}, {"p": "avant", "pt": "Before an interview", "s": "My three questions to ask", "t": "What are the most critical outcomes for this role in the next twelve to eighteen months?"}, {"p": "avant", "pt": "Before an interview", "s": "My three questions to ask", "t": "Who are the main partners for this role, and how are design standards approved?"}, {"p": "avant", "pt": "Before an interview", "s": "My three questions to ask", "t": "What would tell you, a year from now, that I have been successful?"}, {"p": "avant", "pt": "Before an interview", "s": "My closing line", "t": "My closing line"}, {"p": "avant", "pt": "Before an interview", "s": "My closing line", "t": "Based on everything we have discussed, I am very interested in this role. Is there anything that would hold you back from moving me forward?"}, {"p": "avant", "pt": "Before an interview", "s": "Five Level C moves to use today", "t": "Five Level C moves to use today"}, {"p": "avant", "pt": "Before an interview", "s": "Five Level C moves to use today", "t": "Open an answer with the claim: The short answer is yes, and here is why."}, {"p": "avant", "pt": "Before an interview", "s": "Five Level C moves to use today", "t": "Use one pivot word to turn a point: That said, … / By the same token, …"}, {"p": "avant", "pt": "Before an interview", "s": "Five Level C moves to use today", "t": "Hedge one claim with precision: Broadly speaking, … / In most cases, …"}, {"p": "avant", "pt": "Before an interview", "s": "Five Level C moves to use today", "t": "Land one idiom, only one, and only if it is yours: We hit the ground running."}, {"p": "avant", "pt": "Before an interview", "s": "Five Level C moves to use today", "t": "End a point with the result, and stop talking."}, {"p": "avant", "pt": "Before an interview", "s": "Five Level C moves to use today", "t": "More in the Level C tab."}, {"p": "avant", "pt": "Before an interview", "s": "Thirty seconds before you walk in", "t": "Thirty seconds before you walk in"}, {"p": "avant", "pt": "Before an interview", "s": "Thirty seconds before you walk in", "t": "Breathe. Say the key figures slowly. One idea, one sentence. \"I\" for decisions, \"we\" for the team."}, {"p": "avant", "pt": "Before an interview", "s": "The target file", "t": "The target file"}, {"p": "avant", "pt": "Before an interview", "s": "The target file", "t": "Targets tab: MAF, Amouage, Chalhoub. Reread \"Your angle\" and the questions to ask."}, {"p": "avant", "pt": "Before an interview", "s": "The target file", "t": "For the Expertise Center Manager role (CONEX · DIAM): the CONEX · DIAM tab holds the ad block by block, the verified facts, the questions with answers and the twenty-one key sentences."}, {"p": "profil", "pt": "My profile", "s": "", "t": "My profile"}, {"p": "profil", "pt": "My profile", "s": "", "t": "Facts come from the English CV of 05/10/2026 (CV_LP_EN_MAF) and the cover letters already written. Every block below is spoken English: press 🔊 to hear it, then say it aloud in 30 to 60 seconds."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "Tell me about yourself"}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "The 30-second hook"}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "I have spent twenty-five years designing and running stores. I was VP Visual Merchandising EMEA at Sephora, with 540 stores in 11 countries. Since then I have led retail design agencies and delivered more than fifty concepts, from strategy to network rollout. I take charge of a retailer's concept, customer journey and store standards."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "The 60-second version: corporate retail"}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "I have spent twenty-five years designing and running stores. I started at Decathlon and Toys \"R\" Us, then became Vice President of Visual Merchandising EMEA at Sephora. That meant 540 stores in 11 countries, seventy openings a year and ten exclusive brands, from planogram to bespoke fixtures."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "Since 2008 I have led retail design agencies: first the retail design arm of Dia-Mart, with a team of fifteen and a two-million-euro P&L, then my own agency, Jaizkibel. I have delivered more than fifty concepts, from the Beauty floor of La Samaritaine to Feu Vert and Giphar. In Moscow I led the local teams for three years across thirteen hundred stores for L'Étoile."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "What I do best is turn a brand idea into standards that teams can apply across a whole network. That is what I would like to do in-house."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "The 60-second version: beauty and luxury"}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "Beauty retail is the thread of my career. At Sephora I owned the visual strategy and store concept for EMEA: 540 stores, eleven countries, and ten exclusive brands managed from planogram to bespoke fixtures. I also built the processes and tools for brand allocation and store planning."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "Then I founded Jaizkibel, an agency that works with houses like La Prairie, Aubade and Nocibé, and I designed the Beauty floor of La Samaritaine, with more than seventy brands. The principle never changes: a store is the most honest expression of a brand, and the standard has to travel from one market to the next without losing what makes the brand recognisable."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "The 60-second version: assignment (consulting)"}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "I work in assignments. A retailer calls me when a concept needs rethinking or a network needs aligning, and I take charge from strategy to rollout: the concept, the customer journey, the standards and the teams that apply them. I have done it for more than fifty concepts, including long assignments in Moscow for L'Étoile, with thirteen hundred stores, and in Manchester for Perscent Group. I am available for assignments in France and abroad."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "The two-minute version (\"walk me through your CV\")"}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "I will go in chronological order and stay on what matters for this role."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "I started in 1997 at Decathlon, as visual merchandiser and trainer, then store manager. I set merchandising guidelines, trained more than 250 managers across Europe and opened 24 stores."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "In 1999 I joined Toys \"R\" Us as Store Planning Manager for Europe: 32 remodels and three openings, and our concept was named Best Concept of the Year in 2002."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "In 2004 I joined Sephora, part of LVMH, as Vice President Visual Merchandising EMEA. I owned the strategy, the store concept and operations, with an operating budget of 11 million euros, 540 stores and 11 countries."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "In 2008 I co-founded Dia-Mart In Situ and ran the retail design subsidiary: full P&L, a team of fifteen, and award-winning omnichannel concepts for more than twenty retailers."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "Since 2017 I run Jaizkibel, my own agency: Feu Vert, Giphar, La Samaritaine, and the Moscow assignment for L'Étoile. In 2023 I also co-founded NUT, a reuse and circular-economy company, where I raised 1.1 million euros."}, {"p": "profil", "pt": "My profile", "s": "Tell me about yourself", "t": "So the common thread is simple: concept, standards and rollout at network scale."}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "Why should we hire you?"}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "Opening formula from your notes: \"I know you are looking for someone who can (problem), and I bring proven experience doing exactly that.\" Fill in the problem of the role, then add a proof from the CV."}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "I know you are looking for someone who can give your stores a clear design direction and make it hold across formats. I have done exactly that: at Sephora, 540 stores in eleven countries ran on one visual identity, and since then I have delivered more than fifty concepts from strategy to rollout. I bring the creative direction, and the discipline to make standards work on the shop floor."}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "Proofs to draw on, all from the CV:"}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "Scale: 540+ stores and 70+ openings a year (Sephora); 1,300+ stores (L'Étoile, Moscow)."}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "Team and P&L: a team of 15 and a €2M P&L (UX Retail Design)."}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "Awarded creative work: Janus du Commerce, Trophée LSA; Best Concept of the Year 2002 (Toys \"R\" Us)."}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "Brands on a network: ten exclusive US brands managed from planogram to bespoke fixtures (Sephora)."}, {"p": "profil", "pt": "My profile", "s": "Why should we hire you?", "t": "Circular economy: NUT, €1.1M raised and €600k of public grants."}, {"p": "profil", "pt": "My profile", "s": "Why this role, why now?", "t": "Why this role, why now?"}, {"p": "profil", "pt": "My profile", "s": "Why this role, why now?", "t": "I am looking for a role where design and retail performance meet. I have worked on both sides of the table: inside a retailer, at Sephora, and on the agency side. I want to put that experience at the service of one network, with a long-term vision, and see the concepts I design deliver results over time."}, {"p": "profil", "pt": "My profile", "s": "Why Dubai, why the Gulf?", "t": "Why Dubai, why the Gulf?"}, {"p": "profil", "pt": "My profile", "s": "Why Dubai, why the Gulf?", "t": "The Gulf is where retail is being reinvented at scale: new formats, new malls, fast openings. I know how to run a concept across many countries, and I am mobile and available to join you in Dubai."}, {"p": "profil", "pt": "My profile", "s": "Where do you see yourself in five years?", "t": "Where do you see yourself in five years?"}, {"p": "profil", "pt": "My profile", "s": "Where do you see yourself in five years?", "t": "In five years I see myself leading the design direction of a network, with a strong team and standards that run without me. I want to have delivered concepts that the stores can apply and that customers remember."}, {"p": "profil", "pt": "My profile", "s": "Availability, mobility, salary", "t": "Availability, mobility, salary"}, {"p": "profil", "pt": "My profile", "s": "Availability, mobility, salary", "t": "Availability: \"I am available to start quickly, and I can relocate.\" State your actual notice period when it comes up."}, {"p": "profil", "pt": "My profile", "s": "Availability, mobility, salary", "t": "Mobility: \"I am mobile and available to join you in Dubai.\" (the sentence from the MAF letter)."}, {"p": "profil", "pt": "My profile", "s": "Availability, mobility, salary", "t": "Salary, a prudent formula: \"I would like to understand the full scope of the role first. I am confident we will find a package in line with a director position in Dubai.\" On the MAF portal you entered 50,000 (assumed AED per month): check the unit before you quote a figure."}, {"p": "profil", "pt": "My profile", "s": "Notes to self", "t": "Notes to self"}, {"p": "profil", "pt": "My profile", "s": "Notes to self", "t": "Sephora title: \"Vice President, Visual Merchandising EMEA\", 2004–2008 (aligned with the CV)."}, {"p": "profil", "pt": "My profile", "s": "Notes to self", "t": "\"I take charge of…\" is the line from your CV. Keep it: it sounds direct."}, {"p": "profil", "pt": "My profile", "s": "Notes to self", "t": "\"Interim\" and \"transition\" no longer appear in the MAF portal CV. In speech, \"assignment\" covers both formats, assignment or permanent role."}, {"p": "histoires", "pt": "Stories", "s": "", "t": "Stories"}, {"p": "histoires", "pt": "Stories", "s": "", "t": "Each story starts from facts in your CV. The slots marked [to complete] wait for a figure or a detail only you know: the measurable result, a name, a duration. A story of 60 to 90 seconds runs in four beats: Situation, Task, Action, Result."}, {"p": "histoires", "pt": "Stories", "s": "", "t": "Golden rule from your notes: speak as an executive. \"I led\", \"I owned\", \"I built\", \"I decided\"."}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "Map: which story for which question"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "Prioritising competing deadlines · 1 Sephora (70 openings a year), 4 Jaizkibel"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "Influencing without authority · 1 Sephora (brands and stores), 2 L'Étoile (local teams)"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "A complex project with many stakeholders · 2 L'Étoile, 3 Feu Vert"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "A disagreement with a colleague or a leader · 8 (to complete)"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "Feedback you did not agree with · 9 (to complete)"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "A mistake and what you learned · 10 (to complete)"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "Leading a team and a P&L · 5 UX Retail Design"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "Innovation and sustainability · 7 NUT"}, {"p": "histoires", "pt": "Stories", "s": "Map: which story for which question", "t": "Measurable results · 5 (awards), 6 Toys \"R\" Us, 3 Giphar"}, {"p": "histoires", "pt": "Stories", "s": "1. Sephora: one visual identity for 540 stores", "t": "1. Sephora: one visual identity for 540 stores"}, {"p": "histoires", "pt": "Stories", "s": "1. Sephora: one visual identity for 540 stores", "t": "Situation: VP Visual Merchandising EMEA (2004–2008). 540+ stores, 11 countries, 70+ openings a year, €11M operating budget."}, {"p": "histoires", "pt": "Stories", "s": "1. Sephora: one visual identity for 540 stores", "t": "Task: keep a single visual identity from Paris to Moscow while managing ten exclusive US brands."}, {"p": "histoires", "pt": "Stories", "s": "1. Sephora: one visual identity for 540 stores", "t": "Action: built the processes and tools for brand allocation and store planning; approved brand fixture plans and checked furniture compliance; managed the brands from planogram to bespoke fixtures."}, {"p": "histoires", "pt": "Stories", "s": "1. Sephora: one visual identity for 540 stores", "t": "Result: [to complete: for example shorter opening lead time, compliance rate, number of brands deployed without deviation]."}, {"p": "histoires", "pt": "Stories", "s": "1. Sephora: one visual identity for 540 stores", "t": "At Sephora I owned the visual strategy for EMEA: 540 stores, 11 countries, and 70 openings a year. My task was to keep one visual identity across all markets, with ten exclusive brands on top. I built the processes and tools for brand allocation and store planning, and I validated every brand's fixture plan against our standards. The result was a network that opened fast and looked consistent, from Paris to the Middle East."}, {"p": "histoires", "pt": "Stories", "s": "2. L'Étoile, Moscow: a network of 1,300 stores", "t": "2. L'Étoile, Moscow: a network of 1,300 stores"}, {"p": "histoires", "pt": "Stories", "s": "2. L'Étoile, Moscow: a network of 1,300 stores", "t": "Situation: a long assignment for L'Étoile, a beauty network of 1,300+ stores."}, {"p": "histoires", "pt": "Stories", "s": "2. L'Étoile, Moscow: a network of 1,300 stores", "t": "Task: create the concept, the flagship and the private label concept, then have local teams apply them."}, {"p": "histoires", "pt": "Stories", "s": "2. L'Étoile, Moscow: a network of 1,300 stores", "t": "Action: designed the concept and the flagship, the private label concept, and led the local teams for three years."}, {"p": "histoires", "pt": "Stories", "s": "2. L'Étoile, Moscow: a network of 1,300 stores", "t": "Result: [to complete: number of stores converted, sales evolution, rollout time]."}, {"p": "histoires", "pt": "Stories", "s": "2. L'Étoile, Moscow: a network of 1,300 stores", "t": "For L'Étoile in Moscow, I created the store concept, the flagship and the private label concept for a network of 1,300 stores. Then I stayed for three years to lead the local teams who applied it. My approach was to read the market first, then set a standard the teams could run without me. [Result to add.]"}, {"p": "histoires", "pt": "Stories", "s": "3. Feu Vert and Giphar: from concept to rollout", "t": "3. Feu Vert and Giphar: from concept to rollout"}, {"p": "histoires", "pt": "Stories", "s": "3. Feu Vert and Giphar: from concept to rollout", "t": "Situation: Jaizkibel assignments, 2021–2025. Feu Vert (interior concept, merchandising, digital journey, exterior identity, then rollout). Giphar (new concept and a 500 sqm format)."}, {"p": "histoires", "pt": "Stories", "s": "3. Feu Vert and Giphar: from concept to rollout", "t": "Task: design a concept that holds across a network."}, {"p": "histoires", "pt": "Stories", "s": "3. Feu Vert and Giphar: from concept to rollout", "t": "Action: end-to-end design, from strategy to rollout."}, {"p": "histoires", "pt": "Stories", "s": "3. Feu Vert and Giphar: from concept to rollout", "t": "Result: [to complete: stores delivered, commercial result of the pilot stores]."}, {"p": "histoires", "pt": "Stories", "s": "3. Feu Vert and Giphar: from concept to rollout", "t": "For Feu Vert I designed the full concept: interior, merchandising, digital journey and exterior identity, and then I managed the rollout. The principle is always the same: a concept is only good if the teams can apply it, store after store."}, {"p": "histoires", "pt": "Stories", "s": "4. Jaizkibel: fifty-plus concepts, one method", "t": "4. Jaizkibel: fifty-plus concepts, one method"}, {"p": "histoires", "pt": "Stories", "s": "4. Jaizkibel: fifty-plus concepts, one method", "t": "Situation: agency founded in 2017, more than 50 concepts delivered for beauty, health and service brands."}, {"p": "histoires", "pt": "Stories", "s": "4. Jaizkibel: fifty-plus concepts, one method", "t": "Task: run several assignments in parallel without letting any of them slip."}, {"p": "histoires", "pt": "Stories", "s": "4. Jaizkibel: fifty-plus concepts, one method", "t": "Action: [to complete: your priority rule, how you split the work, how you keep the client informed]."}, {"p": "histoires", "pt": "Stories", "s": "4. Jaizkibel: fifty-plus concepts, one method", "t": "Result: [to complete]."}, {"p": "histoires", "pt": "Stories", "s": "4. Jaizkibel: fifty-plus concepts, one method", "t": "Running several concepts at once taught me to prioritise by impact, not by noise. [Add your own rule and one example.]"}, {"p": "histoires", "pt": "Stories", "s": "5. UX Retail Design (Dia-Mart): a team of 15 and a €2M P&L", "t": "5. UX Retail Design (Dia-Mart): a team of 15 and a €2M P&L"}, {"p": "histoires", "pt": "Stories", "s": "5. UX Retail Design (Dia-Mart): a team of 15 and a €2M P&L", "t": "Situation: 2008–2018, co-founder and associate director, running the retail design subsidiary."}, {"p": "histoires", "pt": "Stories", "s": "5. UX Retail Design (Dia-Mart): a team of 15 and a €2M P&L", "t": "Task: grow the subsidiary while keeping a creative quality that peers recognised."}, {"p": "histoires", "pt": "Stories", "s": "5. UX Retail Design (Dia-Mart): a team of 15 and a €2M P&L", "t": "Action: ran the P&L (€2M revenue), managed a team of 15, owned the client relationships."}, {"p": "histoires", "pt": "Stories", "s": "5. UX Retail Design (Dia-Mart): a team of 15 and a €2M P&L", "t": "Result: award-winning omnichannel concepts (Janus du Commerce, Trophée LSA) for more than 20 retailers."}, {"p": "histoires", "pt": "Stories", "s": "5. UX Retail Design (Dia-Mart): a team of 15 and a €2M P&L", "t": "I ran the retail design subsidiary of Dia-Mart: full P&L, two million euros of revenue, and a team of fifteen. We built omnichannel concepts for more than twenty retailers, and our work won the Janus du Commerce and the LSA Trophy."}, {"p": "histoires", "pt": "Stories", "s": "6. Toys \"R\" Us: Best Concept of the Year 2002", "t": "6. Toys \"R\" Us: Best Concept of the Year 2002"}, {"p": "histoires", "pt": "Stories", "s": "6. Toys \"R\" Us: Best Concept of the Year 2002", "t": "Situation: Store Planning Manager Europe (1999–2004). 32 remodels and 3 openings."}, {"p": "histoires", "pt": "Stories", "s": "6. Toys \"R\" Us: Best Concept of the Year 2002", "t": "Task: adapt American concepts to European constraints."}, {"p": "histoires", "pt": "Stories", "s": "6. Toys \"R\" Us: Best Concept of the Year 2002", "t": "Action: [to complete: what you changed in the concept for Europe]."}, {"p": "histoires", "pt": "Stories", "s": "6. Toys \"R\" Us: Best Concept of the Year 2002", "t": "Result: the concept was named \"Best Concept of the Year\" in 2002."}, {"p": "histoires", "pt": "Stories", "s": "6. Toys \"R\" Us: Best Concept of the Year 2002", "t": "At Toys \"R\" Us I adapted the retail concept for Europe: thirty-two remodels and three openings. In 2002 our concept was named Best Concept of the Year."}, {"p": "histoires", "pt": "Stories", "s": "7. NUT: raising funds and making circularity a business model", "t": "7. NUT: raising funds and making circularity a business model"}, {"p": "histoires", "pt": "Stories", "s": "7. NUT: raising funds and making circularity a business model", "t": "Situation: co-founder and shareholder since 2023, a reuse company for retail and food, team of 7."}, {"p": "histoires", "pt": "Stories", "s": "7. NUT: raising funds and making circularity a business model", "t": "Task: build a model that reduces retail's environmental impact, and secure the funding."}, {"p": "histoires", "pt": "Stories", "s": "7. NUT: raising funds and making circularity a business model", "t": "Action: strategy, pitch deck, financial development; partnerships with Veolia and Citeo."}, {"p": "histoires", "pt": "Stories", "s": "7. NUT: raising funds and making circularity a business model", "t": "Result: €1.1M raised and €600k in public grants (FEDER, Bpifrance, Region); winner of Pépite Tech 2023/2024 and of the DIESE Dauphine programme."}, {"p": "histoires", "pt": "Stories", "s": "7. NUT: raising funds and making circularity a business model", "t": "In 2023 I co-founded NUT, a reuse company for retail and food. I owned the strategy, the pitch deck and the financial plan. We raised 1.1 million euros and secured 600,000 euros in public grants, and we won Pépite Tech."}, {"p": "histoires", "pt": "Stories", "s": "8. A disagreement with a leader or a colleague (to complete)", "t": "8. A disagreement with a leader or a colleague (to complete)"}, {"p": "histoires", "pt": "Stories", "s": "8. A disagreement with a leader or a colleague (to complete)", "t": "What the recruiter expects: the challenge, what you considered, why you decided as you did, the impact on the team or the organisation. Pick a real case (a client, a brand director, an architect, a manufacturer)."}, {"p": "histoires", "pt": "Stories", "s": "8. A disagreement with a leader or a colleague (to complete)", "t": "I disagreed with [who] about [what]. I looked at [data, the customer, the cost]. I decided to [decision], because [reason]. The impact was [result], and the relationship [stayed strong, improved]."}, {"p": "histoires", "pt": "Stories", "s": "9. Feedback you did not agree with (to complete)", "t": "9. Feedback you did not agree with (to complete)"}, {"p": "histoires", "pt": "Stories", "s": "9. Feedback you did not agree with (to complete)", "t": "I received feedback I did not agree with: [what]. I asked for examples to understand the view behind it. [What you found.] I then [what you changed, or how you explained your position]."}, {"p": "histoires", "pt": "Stories", "s": "10. A mistake (to complete)", "t": "10. A mistake (to complete)"}, {"p": "histoires", "pt": "Stories", "s": "10. A mistake (to complete)", "t": "Choose a real mistake, corrected, with a lesson you have applied since."}, {"p": "histoires", "pt": "Stories", "s": "10. A mistake (to complete)", "t": "I made a mistake on [project]: [what happened]. I told [who] right away, we fixed it by [action], and since then I [new habit]."}, {"p": "histoires", "pt": "Stories", "s": "What I left out of the coaching texts", "t": "What I left out of the coaching texts"}, {"p": "histoires", "pt": "Stories", "s": "What I left out of the coaching texts", "t": "The \"Hermès\" coaching text in your folder tells episodes that appear neither in your CV nor in your letters: Aubade's central fitting room, an L'Oréal concept in Milan, an award won by Atol, \"+20% sales\" in pilot stores, \"50 projects in parallel\" (your CV says \"50+ concepts\" in total), \"+15–25% sales\" for La Prairie and Nespresso. I left them out, because nothing in your files confirms them. If one is true, give me the figure and the source and I will add it. The NUT figures (€1.1M raised, €600k of grants) do appear in your CV: they are used."}, {"p": "questions", "pt": "Questions", "s": "", "t": "Questions: to ask, to expect"}, {"p": "questions", "pt": "Questions", "s": "", "t": "The questions come from your notes of 26/01/2026 and the \"Key question\" document. The answers are skeletons of three to five sentences, built on the facts of your CV. The full stories are in \"Stories\"."}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "Questions you ask (your five, plus mine)"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "Your five questions, in crisp English:"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "If you look at the next twelve to eighteen months, what are the most critical outcomes this role needs to drive, and how do you measure success?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "Where does this function have the greatest opportunity to increase its influence across the organisation?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "What is the biggest constraint, or reality, someone stepping into this role needs to grasp quickly?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "How does the leadership team want this role to show up in cross-functional decisions?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "A year from now, what would tell you that I have been successful in this role?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "Added questions, useful for a design and retail concept role:"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "Why is this position open? Is it a new role, or did the previous person move on?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "Which formats or brands are the priority for the design direction this year?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "Who are the main partners for this role: architects, fit-out contractors, operations, marketing, landlords?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "How are design standards approved today, and who has the final say?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "What does a typical year of rollout look like: how many remodels and new openings?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "Which store or project would you point to as the best example of what you want?"}, {"p": "questions", "pt": "Questions", "s": "Questions you ask (your five, plus mine)", "t": "What does the team look like today, and where do you want to strengthen it?"}, {"p": "questions", "pt": "Questions", "s": "Closing line", "t": "Closing line"}, {"p": "questions", "pt": "Questions", "s": "Closing line", "t": "Based on everything we have discussed, I am very interested in this role. Is there anything that would hold you back from moving me forward?"}, {"p": "questions", "pt": "Questions", "s": "Closing line", "t": "A softer variant:"}, {"p": "questions", "pt": "Questions", "s": "Closing line", "t": "Before we wrap up, is there anything about my profile that gives you pause?"}, {"p": "questions", "pt": "Questions", "s": "Closing line", "t": "After the answer: thank them, repeat one strength, ask about the next step (What are the next steps, and when can I expect to hear from you?)."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "What the recruiter asks"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Why you?"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "I know you are looking for someone who can give your stores a clear design direction and make it hold across formats. I have done exactly that. At Sephora, 540 stores in 11 countries ran on one visual identity, and since then I have delivered more than fifty concepts from strategy to rollout."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Why are you the right person for the job?"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Same base, with the problem of the role up front. Finish on a measurable proof."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Where do you see yourself in five years?"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Ready-made answer in \"My profile\"."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "How do you prioritise competing deadlines?"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "My rule is impact before urgency. At Sephora I had seventy openings a year, so I separated what blocks others from what can wait, I shared the plan with every stakeholder, and I flagged early when a date was at risk. That way nothing fell through the cracks."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "How do you handle a mistake?"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Story 10. Structure: the fact, the immediate disclosure, the fix, the new habit."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Influencing without authority"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "At Sephora, most of the people I had to move did not report to me: store teams, brand partners, country managers. I made the standard useful to them: simple tools, clear rules, and a plan for each country. They followed because it made their work easier."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Feedback you disagreed with, or a disagreement with a leader"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Stories 8 and 9 (to complete). Common thread: listen, test against data, decide, explain."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "Strengths and weaknesses"}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "To prepare with your real choice. Structure: one strength proved by a fact, one genuine weakness with what you do about it."}, {"p": "questions", "pt": "Questions", "s": "What the recruiter asks", "t": "My main strength is turning a brand idea into standards that a network can apply. [Proof: Sephora, L'Étoile.] An area I keep working on is [your real point], and what I do about it is [your action]."}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "Craft questions: concept, design, VM"}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "How do you design or redesign a store concept from scratch to rollout?"}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "I work in four steps. First, customer journey and data: how people move and where they stop. Second, the concept and the space: zoning, fixtures, brand expression. Third, a pilot: a test store to validate the layout and the costs. Fourth, the rollout: technical guidelines, fixture books and a deployment schedule that works for hundreds of stores. Each step has a clear owner and a go or no-go."}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "How do you balance creative design with business results?"}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "Design in retail has to earn its keep. I tie every concept to a few metrics: sales per square metre, conversion, basket size, and the cost of the fit-out. I also design for the people who restock and serve, because a store that is hard to run will not hold its standard."}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "How do you keep a consistent identity across many formats and countries?"}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "I define what never changes, what can flex, and what each country can choose. A clear framework lets local teams adapt without losing the brand. At Sephora that meant one visual identity across eleven countries. In Moscow, it meant a concept that thirteen hundred stores could apply."}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "Tell me about working with architects, contractors and landlords."}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "Early alignment is everything. I bring architects, contractors and operations together at concept stage, I lock the standards before the tender, and I plan landlord approvals into the schedule instead of treating them as an afterthought. In the Gulf that means anticipating mall approval timelines and local compliance from day one."}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "Which tools do you use?"}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "AutoCAD, SketchUp and InDesign, and AI-assisted 3D rendering. I use them to communicate and to check; my team and our partners produce the detailed drawings. (Aligned with your CV: \"AutoCAD (intensive use), SketchUp, InDesign, AI-assisted 3D rendering\".)"}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "How do you integrate sustainability into store design?"}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "It is part of the brief from day one: modular fixtures, reusable materials, local sourcing where possible, and a plan for the end of life of every fixture. At NUT I worked on exactly this: reuse and reverse flows for retail, with partners like Veolia and Citeo."}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "How do you lead a team and external agencies?"}, {"p": "questions", "pt": "Questions", "s": "Craft questions: concept, design, VM", "t": "I set a clear framework and let people execute with care. I ran a team of fifteen and a two-million-euro P&L at UX Retail Design. I stay close to the decisions that shape the brand and delegate the rest."}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "Tricky questions"}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "Why leave an agency you founded?"}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "I enjoy the agency years, and I want to apply what I know inside one network, with long-term ownership. I would like to see the standards I design live and evolve in the stores over time."}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "You have been independent for a long time. How will you fit into a corporate structure?"}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "I have worked inside large groups: LVMH, Sephora, Toys \"R\" Us, Decathlon. I know the governance, the budgets and the matrix. My agency years taught me to deliver without waiting for permission, and to align quickly with people who see things differently."}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "Are you willing to relocate to Dubai?"}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "Yes. I am mobile and available to join you in Dubai."}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "Salary expectations"}, {"p": "questions", "pt": "Questions", "s": "Tricky questions", "t": "Prudent answer in \"My profile\". Check the unit (AED per month or per year) before quoting a figure."}, {"p": "questions", "pt": "Questions", "s": "Gulf context questions", "t": "Gulf context questions"}, {"p": "questions", "pt": "Questions", "s": "Gulf context questions", "t": "How do you adapt a global concept to the Gulf market?"}, {"p": "questions", "pt": "Questions", "s": "Gulf context questions", "t": "I separate three layers: the brand identity, which stays; the format, which adapts to the mall and the customer; and the services, which reflect local habits: private areas, family flows, hospitality. The UAE draws many tourists and expatriates; Saudi Arabia is driven by a young local customer with high expectations. The concept has to speak to each."}, {"p": "questions", "pt": "Questions", "s": "Gulf context questions", "t": "How do you work with nationalisation programmes (Emiratisation, Saudisation)?"}, {"p": "questions", "pt": "Questions", "s": "Gulf context questions", "t": "I treat it as a strength. Local talent brings cultural insight, so I build training and clear career paths from the shop floor to store management. That improves retention and service quality."}, {"p": "questions", "pt": "Questions", "s": "Gulf context questions", "t": "(Background: quotas and rules by country are in the \"Gulf\" dossier.)"}, {"p": "oral", "pt": "Speaking", "s": "", "t": "Speaking"}, {"p": "oral", "pt": "Speaking", "s": "", "t": "Level C speaking is less about vocabulary than about control: where you place the stress, when you pause, how you land a point, how you handle pushback. This page collects the devices. For adjectives, pivot words, idioms and hedging, use the Level C tab."}, {"p": "oral", "pt": "Speaking", "s": "Answer first, then evidence", "t": "Answer first, then evidence"}, {"p": "oral", "pt": "Speaking", "s": "Answer first, then evidence", "t": "Executives say the conclusion in the first sentence and prove it afterwards. Build every answer in three moves:"}, {"p": "oral", "pt": "Speaking", "s": "Answer first, then evidence", "t": "The claim, in one short sentence: The short answer is yes, and here is why."}, {"p": "oral", "pt": "Speaking", "s": "Answer first, then evidence", "t": "The proof, with one fact from the CV: At Sephora, …"}, {"p": "oral", "pt": "Speaking", "s": "Answer first, then evidence", "t": "The link back to them: Which is exactly what this role needs."}, {"p": "oral", "pt": "Speaking", "s": "Answer first, then evidence", "t": "The short answer is yes. At Sephora I kept one visual identity across 540 stores in eleven countries, and I did it with tools the local teams could use without me. That is exactly the discipline a multi-brand network needs."}, {"p": "oral", "pt": "Speaking", "s": "Landing a point: rhythm and stress", "t": "Landing a point: rhythm and stress"}, {"p": "oral", "pt": "Speaking", "s": "Landing a point: rhythm and stress", "t": "One idea per sentence. Finish the sentence, then breathe. A two-second pause reads as confidence, not hesitation."}, {"p": "oral", "pt": "Speaking", "s": "Landing a point: rhythm and stress", "t": "Stress the words that carry meaning: the verb of action, the figure, the result. Let the small words fall away: I DELIVered more than FIFty conCEPTS."}, {"p": "oral", "pt": "Speaking", "s": "Landing a point: rhythm and stress", "t": "Drop your voice at the end of a statement. A rising end turns a claim into a question."}, {"p": "oral", "pt": "Speaking", "s": "Landing a point: rhythm and stress", "t": "To contrast, lift the stress on the pivot word: Not the NUMber of stores, the CONSISTency across them."}, {"p": "oral", "pt": "Speaking", "s": "Landing a point: rhythm and stress", "t": "For a list of three, rise on the first two items and fall on the last: the concept ↗, the standards ↗, and the rollout ↘."}, {"p": "oral", "pt": "Speaking", "s": "Landing a point: rhythm and stress", "t": "Slow down on the key figure and on the last sentence of an answer."}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "Stress shifts that mark a fluent speaker"}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "Many business words change stress between noun and verb. Say the noun with the stress first, the verb with the stress second."}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "a PROject · to proJECT"}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "a REcord · to reCORD"}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "an INcrease · to inCREASE"}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "a PERmit · to perMIT"}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "a CONtract · to conTRACT (shrink)"}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "an OBject · to obJECT"}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "a PROduce (fresh goods) · to proDUCE"}, {"p": "oral", "pt": "Speaking", "s": "Stress shifts that mark a fluent speaker", "t": "Word families shift the stress as well: PHOtograph, phoTOGraphy, photoGRAPHic · ECOnomy, ecoNOMic · reSPONsible, responsiBIlity · CREate, creAtive, creaTIVity · PREsent, presenTAtion. When you hesitate, remember that endings in -ic, -ion, -ity pull the stress to the syllable just before them."}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "Connected speech: what you will
