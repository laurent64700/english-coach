 hear in meetings"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "Native speakers reduce and link. You do not need to copy it, but you must recognise it."}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "going to · gonna"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "want to, have to · wanna, hafta"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "kind of, sort of · kinda, sorta"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "what do you think · whaddaya think"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "did you · didja"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "could have · coulda"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "give me · gimme"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "an apple · anapple (linked)"}, {"p": "oral", "pt": "Speaking", "s": "Connected speech: what you will hear in meetings", "t": "When the speed is too high, ask without apology: Could you take me through that once more, a little more slowly? In the Gulf you will meet British, American, Indian, Levantine and Gulf Arabic accents in the same meeting. Check the key point by playing it back: So what I am hearing is that the priority is the premium format. Is that right?"}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "Handling pushback"}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "You need a moment · That is a fair challenge. Let me think it through."}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "You disagree, politely · I see it a little differently. My concern is …"}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "You partly agree · You are right on X. Where I would push back is Y."}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "You want to reframe · Let me reframe the question: the real issue is …"}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "The question is too broad · Let me take that in two parts: first the concept, then the rollout."}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "You do not know · I do not have the figure to hand, and I would rather not guess. I will come back to you with it by tomorrow."}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "You get interrupted · If I may finish this point, and then I am happy to hear yours."}, {"p": "oral", "pt": "Speaking", "s": "Handling pushback", "t": "You are asked for something you did not do · That was not my scope. What I owned was …"}, {"p": "oral", "pt": "Speaking", "s": "Telling a project aloud: the five-sentence model", "t": "Telling a project aloud: the five-sentence model"}, {"p": "oral", "pt": "Speaking", "s": "Telling a project aloud: the five-sentence model", "t": "The brief was …"}, {"p": "oral", "pt": "Speaking", "s": "Telling a project aloud: the five-sentence model", "t": "The challenge was …"}, {"p": "oral", "pt": "Speaking", "s": "Telling a project aloud: the five-sentence model", "t": "My approach was …"}, {"p": "oral", "pt": "Speaking", "s": "Telling a project aloud: the five-sentence model", "t": "What we delivered was …"}, {"p": "oral", "pt": "Speaking", "s": "Telling a project aloud: the five-sentence model", "t": "The result was …"}, {"p": "oral", "pt": "Speaking", "s": "Telling a project aloud: the five-sentence model", "t": "The brief was to redesign the Beauty floor of La Samaritaine. The challenge was to give more than seventy brands a clear place without losing the identity of the building. My approach was to organise the floor by customer journey first, then by brand. What we delivered was the concept and the brand zoning, and the floor opened with every brand in place."}, {"p": "oral", "pt": "Speaking", "s": "Telling a project aloud: the five-sentence model", "t": "(Replace the last sentence with your real result.)"}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "Describing a space without a drawing"}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "As you enter, on the left-hand side, … · on your right, …"}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "At the back of the store · up front · in the heart of the floor"}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "Facing the entrance · opposite the cash desk · next to the fitting rooms · adjacent to the fragrance wall"}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "At eye level · above · below · behind"}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "The customer flows from the entrance, along the main aisle, to …"}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "The first thing you see is … · Your eye is drawn to …"}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "Let me walk you through the layout."}, {"p": "oral", "pt": "Speaking", "s": "Describing a space without a drawing", "t": "The idea here is to slow the customer down."}, {"p": "oral", "pt": "Speaking", "s": "Calls and video", "t": "Calls and video"}, {"p": "oral", "pt": "Speaking", "s": "Calls and video", "t": "Can you hear me well? · You are on mute. · I will share my screen."}, {"p": "oral", "pt": "Speaking", "s": "Calls and video", "t": "Sorry, the connection dropped. Could you repeat the last part?"}, {"p": "oral", "pt": "Speaking", "s": "Calls and video", "t": "Let me summarise what we agreed. · I will park that for now and come back to it."}, {"p": "oral", "pt": "Speaking", "s": "Calls and video", "t": "I will send you a short recap by email today."}, {"p": "oral", "pt": "Speaking", "s": "Calls and video", "t": "On video, look at the camera for the key figures and at the screen for the exchange."}, {"p": "oral", "pt": "Speaking", "s": "When you do not understand", "t": "When you do not understand"}, {"p": "oral", "pt": "Speaking", "s": "When you do not understand", "t": "Sorry, could you say that again, a little more slowly?"}, {"p": "oral", "pt": "Speaking", "s": "When you do not understand", "t": "I did not catch the last word. Could you spell it?"}, {"p": "oral", "pt": "Speaking", "s": "When you do not understand", "t": "Do you mean …? (restate what you understood)"}, {"p": "oral", "pt": "Speaking", "s": "When you do not understand", "t": "Just to be sure, you would like me to …?"}, {"p": "cibles", "pt": "Targets", "s": "", "t": "Target files: MAF, Amouage, Chalhoub"}, {"p": "cibles", "pt": "Targets", "s": "", "t": "Each file draws on facts verified in your dossiers (links in the dossiers). Reliability tags are Jean-Paul's: [P] official page read, [S] press read, [R] search-result extract to reconfirm. Names of people are checked on LinkedIn before any mention."}, {"p": "cibles", "pt": "Targets", "s": "Gulf context to know (October 2026)", "t": "Gulf context to know (October 2026)"}, {"p": "cibles", "pt": "Targets", "s": "Gulf context to know (October 2026)", "t": "On 28/02/2026 strikes hit several Gulf states. Stores closed in the UAE, Kuwait, Bahrain and Qatar. Chalhoub closed Bahrain and moved the other markets to voluntary attendance [S, 05/03/2026]."}, {"p": "cibles", "pt": "Targets", "s": "Gulf context to know (October 2026)", "t": "Recovery is under way: Dubai welcomed 869,000 international visitors in August 2026, its best month since February [R, 09/2026]."}, {"p": "cibles", "pt": "Targets", "s": "Gulf context to know (October 2026)", "t": "MAF, H1 2026: retail revenue down 6%, malls up 12%, operating net profit up 25%; the CEO describes a sharp demand shock in Q2 followed by a quick rebound [R, 09/2026]."}, {"p": "cibles", "pt": "Targets", "s": "Gulf context to know (October 2026)", "t": "A line to keep in your pocket:"}, {"p": "cibles", "pt": "Targets", "s": "Gulf context to know (October 2026)", "t": "The region is recovering fast, and brands are reopening and refining their formats. That is exactly when a clear store concept pays back."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Majid Al Futtaim, Director – Retail Design (Dubai)"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "The role at a glance"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Reference 22058, MAF Retail, Corporate Head Office, Dubai. Department \"C&M – Marketing & Communications\". Posted 18/08/2026, updated 21/09/2026 [P]. You applied on 05/10/2026."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "MAF Retail covers Carrefour (franchise in 12 markets, 390+ stores), HyperMax (44 points of sale), Supeco, Myli (health and beauty) and SAVA (discount, launched 22/10/2025) [P]."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "The ad asks for: store design strategy \"by brand\", new concepts, standardised customer journeys, design standards and style guides, store plans, furniture, signage, liaison between internal teams and external partners, talent development [LinkedIn ad, 05/10/2026]."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Requirements: 12+ years in retail design, 3+ years managing design teams, CAD, SketchUp, 3D rendering, Adobe, fluent English, Arabic preferred."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Design news: first premium Carrefour Market in the UAE opened 02/07/2026 at Jumeirah Park Centre (2,200 sqm, fresh share raised from 25% to 38% of the sales floor) [S]; Carrefour replaced by HyperMax in Jordan, Oman and Bahrain [S]."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Your angle in three sentences"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "I know retail networks from both sides: as a retailer, at Sephora, and as an agency leader. I bring a clear design direction by brand and standards that teams can apply across formats and countries. MAF Retail is reinventing its formats, from the premium Carrefour Market to HyperMax and SAVA, and that is the work I do best."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Likely questions"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "How would you build a design direction for several brands at different price levels?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "I start with what must stay common: the customer journey logic, the standards, the toolkit. Then I give each brand its own style: premium Carrefour Market, HyperMax, SAVA, Myli. One framework, several expressions."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "How do you manage brand takeovers, for example converting stores from one brand to another?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "I plan the conversion as a product: a standard kit for signage, fixtures and graphics, a pilot, and a rollout schedule by wave. The key is to keep stores trading while they change."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "How do you work with operations and commercial teams?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "I bring them in at concept stage. A concept only works if operations can run it and if it supports sales per square metre. I test with a pilot store and adjust before the rollout."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "How do you work with external design partners and contractors?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "I define the standards and the brief, and I govern the quality. The partners draw and build to the standard, and I sign off at clear milestones. (You direct the creation; you do not draw the plans.)"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "What do you know about the Gulf customer?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "See \"Gulf context\" above and the answers in the Questions tab."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Questions to ask (MAF)"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Which department does role 22058 report to, and who is the hiring manager?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Which brands are the priority this year: Carrefour Market premium, HyperMax, SAVA, Myli?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "How is the Retail In-Store Design team organised today, and where do you want to strengthen it?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "How do you see the split between design in Retail and the Retail Design & Delivery team in Properties?"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Contacts spotted (verify before any message)"}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Dries D'Hooghe, Managing Director Retail UAE (exact title to confirm). Plan: a comment on one of his posts the week of 19/10."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Sheila Chaiban has left her post: do not cite her."}, {"p": "cibles", "pt": "Targets", "s": "Majid Al Futtaim, Director – Retail Design (Dubai)", "t": "Dossiers: CANDIDATURES\\MAF_Director_Retail_Design\\; letter COVER_LETTER_MAF_LP; salary entered in the portal: 50,000 (unit to confirm)."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Amouage (Oman, luxury perfumery)"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "At a glance"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Omani luxury perfume house, headquartered in Muscat. 2025 sales: $430M (+66%). Q1 2026: $190M (+90%) [S]. L'Oréal took a long-term minority stake in February 2025 [R]."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Network: 12 own boutiques according to BeautyMatter (2026), 17 according to WWD (2024-25): the figure is not reconciled, do not state it without checking [R]."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Muscat flagship (Sabco) reopened in 2025; boutiques in Sohar and at the Mandarin Oriental; Mall of Oman flagship designed with Héroïne (Paris) in 2022 [R]. Partner of the Faces flagship in Jeddah (May 2026) [P]."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Leaders cited: Marco Parsiegla, CEO; Sayyid Khalid bin Hamad Al Busaidi, chairman [S]."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Local rule: in Oman, \"marketing\", \"sales\" and \"commercial broker\" roles are closed to expatriates (decree 501/2024). Titles such as \"Retail Concept\", \"Visual Merchandising\", \"Store Experience\" remain to be confirmed with the employer."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Your angle"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Amouage is growing fast, and a growing network needs one consistent store experience. I have taken charge of concept and visual merchandising for large beauty networks, from the store layout to the teams who run it. I can do the same in an assignment of twelve to eighteen months, or in a permanent role."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Likely questions"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "How do you keep a luxury boutique network consistent while the brand grows quickly?"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "I set a store bible: what never changes, what can adapt to a mall or a city, and a clear approval process. Each new boutique starts from the same standard, and the teams are trained on it."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Why would a luxury house need a retail concept director?"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Somewhere between ten and thirty boutiques, the design starts to drift: each opening becomes a new project. A concept director turns it into a system, so the brand stays recognisable and the openings go faster."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Have you worked with fragrance and beauty?"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Yes: Sephora, with 540 stores and ten exclusive brands; La Prairie, Nocibé and Beauty Success; and The Fragrance Shop in Manchester for Perscent Group."}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Questions to ask (Amouage)"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "How many boutiques do you plan to open in the next two years, and in which markets?"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Who holds the store design standards today: the brand team, an agency, or operations?"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "What would make the next boutique design a success in your eyes?"}, {"p": "cibles", "pt": "Targets", "s": "Amouage (Oman, luxury perfumery)", "t": "Dossier: PERSO\\OMAN\\Cibles_candidatures_directes_2026-10-04.md."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Chalhoub Group (Dubai)"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "At a glance"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Luxury, beauty and fashion group of the Middle East. About 900 stores for brands from Versace and Jimmy Choo to Sephora [S, 03/2026]; more than 1,000 stores in 14 countries according to another extract [R]: the gap is not reconciled, do not quote it as a firm figure. 16,000 employees according to the group's site [P]."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Operator of Sephora Middle East (joint venture with Sephora) and owner of Faces (85+ stores in 10 countries) [P]."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Faces flagship at Jeddah Vibes: 1,100 sqm, inaugurated 07/05/2026, with five service pillars (fragrance layering bar, skin analysis, make-up, men's grooming, gifting), a rotating-brand \"Beauty Studio\" and an AI beauty assistant (Layla AI) [P]."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Greenhouse (brand incubation): Beauty Lab, Fashion Lab, retail-tech accelerator [P]."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "In-house retail design and visual merchandising department [R]."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Leaders cited: Michael Chalhoub, CEO; Jasmina Banda, President of Joint Ventures (oversees the JVs including Sephora); Nicole Nitschke, Managing Director of Faces [P/R]."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Your angle"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "A direct entry point: your Sephora past is a concrete asset at the operator of Sephora Middle East. Present yourself through the multi-country banner concept, never as a regional VM role alone."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "I know Sephora from the inside: I was VP Visual Merchandising EMEA, with 540 stores in eleven countries. Chalhoub operates Sephora in the Middle East and Faces across the Gulf. I would like to help build a store concept that stays consistent across fourteen countries and that every opening can reproduce."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Likely questions"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "What would you change in a Faces or Sephora store today?"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Answer with a precise observation made after visiting a store, never a general criticism. Structure: I noticed [fact]. I would test [idea] in one store before extending it."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "How do you make a concept reproducible across many countries and malls?"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Standards in layers: what never changes, what adapts to the mall, what local teams choose. A toolkit with fixtures, layouts, graphics, and a rollout schedule by wave."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "How would you work with a brand incubation programme like the Greenhouse?"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "I would offer ready-to-use presentation formats for emerging brands: a fixture kit and a layout that a new brand can use in a store without a full project."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "How do you integrate technology without losing the human touch?"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Technology serves the advisor. A skin analysis or a try-on starts the conversation, and the advisor finishes it. I design the space so the tool is part of the architecture, and never gets in the way."}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Questions to ask (Chalhoub)"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "How is the retail design team organised across Sephora, Faces and the other banners?"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Which markets are the priority for new concepts: Saudi Arabia, the UAE, others?"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "How do Sephora, as a joint venture, and Faces share design standards?"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Where do the Greenhouse brands appear in the store experience?"}, {"p": "cibles", "pt": "Targets", "s": "Chalhoub Group (Dubai)", "t": "Dossier: PERSO\\GOLFE\\Cibles_groupes_retail_golfe_2026-10-05.md (sections 2.1 and 4.1)."}, {"p": "cibles", "pt": "Targets", "s": "Useful etiquette for the Gulf (general good sense)", "t": "Useful etiquette for the Gulf (general good sense)"}, {"p": "cibles", "pt": "Targets", "s": "Useful etiquette for the Gulf (general good sense)", "t": "Greetings: As-salamu alaykum is appreciated; a gentle handshake is enough, and wait for a woman to extend her hand first."}, {"p": "cibles", "pt": "Targets", "s": "Useful etiquette for the Gulf (general good sense)", "t": "Take time for conversation before business: family, travel, the city. Show no rush."}, {"p": "cibles", "pt": "Targets", "s": "Useful etiquette for the Gulf (general good sense)", "t": "Business cards: give and receive with the right hand."}, {"p": "cibles", "pt": "Targets", "s": "Useful etiquette for the Gulf (general good sense)", "t": "Insha'Allah (\"God willing\") is common; it signals an intention, not a firm commitment: restate the date you expect."}, {"p": "cibles", "pt": "Targets", "s": "Useful etiquette for the Gulf (general good sense)", "t": "Ramadan Kareem during Ramadan; working hours change."}, {"p": "cibles", "pt": "Targets", "s": "Useful etiquette for the Gulf (general good sense)", "t": "Weekend: Friday–Saturday in Saudi Arabia; in the UAE, companies generally follow Saturday–Sunday since 2022. Confirm with each employer."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "", "t": "CONEX · DIAM: Expertise Center Manager"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "", "t": "Built on 27/10/2026 from the Cadres & Tech ad, your prep sheets of 21/10, your CV, and public sources read the same day. Reliability tags: [A] the ad, [P] official page read, [S] press or deal release read, [R] search extract to reconfirm, [CV] your CV. Answers are spoken English of three to five sentences: say them in your own words, not by heart."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "", "t": "The ad does not name the group. DIAM and CONEX are your working identification (3,300 people, a digital subsidiary started in New York, luxury beauty displays). Do not state it as certain with the recruiter until he confirms it."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "The role at a glance", "t": "The role at a glance"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "The role at a glance", "t": "Title: Expertise Center Manager, a managing-director role for the digital subsidiary of an industrial group in visual merchandising (displays, POS material) for luxury perfume and cosmetics brands [A]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "The role at a glance", "t": "Scope: strategy, services, financial performance and in-store digital experiences; a team of about ten across France and the US; all operations with the Group's business units worldwide [A]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "The role at a glance", "t": "Reporting: to the Group's Europe Director. Based in the Yvelines. One week in six in New York [A]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "The role at a glance", "t": "Start: early December 2026 [A]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "The role at a glance", "t": "Package: €75–90k fixed plus €10–15k variable and a company car in the ad; you have already discussed around €100k plus a car with the recruiter. Do not reopen it, restate it if asked."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "The role at a glance", "t": "Profile asked: 10 years of international commercial work, 5 years running a profit centre, multicultural teams, tech and networks, an eye for aesthetics, very good English."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "What the ad asks, and your proof", "t": "What the ad asks, and your proof"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "What the ad asks, and your proof", "t": "1. Team management · Teams on several sites (US, France, South America, China), cultural fit, hiring, objectives, reviews · Moscow: three years leading local teams for 1,300+ stores. Sephora: 11 countries. Dia-Mart: a team of 15 [CV]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "What the ad asks, and your proof", "t": "2. Financial management · P&L, budgets, forecasts, order book, accounting, external auditors, purchasing · Dia-Mart: €2M P&L. Sephora: €11M operating budget. NUT: €1.1M raised, €600k in grants [CV]. Gap: no work with external auditors, so you lean on Group finance"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "What the ad asks, and your proof", "t": "3. Commercial · Negotiate prices and terms, new contracts, international tenders, relations with Retail Design and Purchasing Directors · Sephora, buyer side, with ten exclusive brands, and you worked with DIAM there. Consulting briefs: Feu Vert, Giphar, E.Leclerc, La Prairie [CV]. [to complete: one international tender]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "What the ad asks, and your proof", "t": "4. Managerial · Daily performance, risk and continuity, compliance, service quality, innovation with the IT team · Network rollouts (Feu Vert, L'Étoile). NUT: connected hardware, computer vision, cellular connectivity (from your prep sheet: confirm)"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "What the ad asks, and your proof", "t": "Tech and design · Tech and networks, sense of aesthetics · NUT; Sephora fixtures and planograms; La Samaritaine Beauty floor, 70+ brands [CV]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Facts to know (checked 27/10/2026)"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "DIAM Group"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Founded in 1973. Visual merchandising and shopfitting for the beauty and luxury sectors. In 2024 Ardian quoted more than 3,200 employees, 30 sites and 20 countries; the ad says 3,300 people and 24 sites. Say \"more than three thousand people\" [S] [A]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Sales above €400M in 2023, about 70% from merchandising [S]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Clients named by Ardian: L'Oréal, LVMH, Estée Lauder, Richemont, Shiseido, Chanel, Hermès [S]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "The full chain: consulting, design, engineering, production, delivery, installation, after-sales service and recycling [S]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Brands: Diam, Prugent, Field Flex, Fine Packaging Manufacturers, MR, Retail3D, Conex, B2D [S]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Ardian announced on 2 July 2024 its entry into exclusive negotiations for a majority stake, with the management reinvesting; the group's 2024 ESG report confirms Ardian as majority shareholder. Stated plan: grow visual merchandising, shopfitting, niche packaging, connectivity and in-store services, organically and through possible acquisitions, and strengthen the CSR commitments [S]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "The CEO, Françoise Raoul-Duval, said the group needed a leading shareholder for a new phase of ambitious growth [S]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Prugent (shopfitting and installation) offers its clients digital through Conex, \"our sister company\". Retail3D is the group's retail design agency [P] [R]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Group sustainability line: life-cycle assessment and eco-design on projects, recycled and alternative materials, optimised lighting, recycling of custom-made furniture, a stated aim of building a circular economy [P]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "CONEX (conexsolution.com)"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "The website is conexsolution.com. The legal name is Conex Digital LLC, with a New York headquarters and European sites at Les Mureaux and Levallois-Perret [R]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Positioning: integrated digital solutions that help brands stand out; \"connecting brands to people\"; \"in-store digital solutions that perform\"; a promise of a worry-free, fully supported solution, globally [P]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Scale claimed: 5,000+ connected devices, 3 regional hubs (Americas, Europe, APAC), 200+ trained field technicians, 24/7 service, 60 different brands, 500+ projects a year [P]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "The service chain, \"from A to Z\": remote monitoring and maintenance; remote updates and content control; on-site installation and maintenance; content creation and video editing [P]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Connectivity: secure cellular connectivity, access to 240+ network providers, no need for store Wi-Fi or ethernet [P]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Benefits listed: more store traffic, product visibility and understanding, cross-selling, brand equity, loyalty, smart data collection, conversion and basket size [P]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Sustainability page: remote maintenance (fewer store visits), glue-free design so parts can be separated and recycled, local production in several regions, preventive maintenance to extend product life, WEEE certification in France, and \"Eco Smart Retail\" (energy monitoring of in-store furniture: lighting and screen brightness, with KPIs). Link to B2D recycling services [P]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Work visible on the site, from image names only (to confirm before mentioning): a flip-dot installation for Rabanne at Heathrow T5, a Chloé back wall, a Puig location in Rome [P, inferred]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "A client testimonial on the site praises CONEX for saying yes when others hesitated because of a project's scale and complexity [P]."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Numbers to reconcile before you quote them"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Countries · 60+ (home page, ad); 43 \"countries served\" (Our Work page) · \"Dozens of countries.\" Ask how they count"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Group size · 3,200+ people, 30 sites, 20 countries (Ardian, 2024); 3,300 people and 24 industrial sites (ad) · \"More than three thousand people\""}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Team · About 10 people [A]; 11–50 on LinkedIn [R] · \"A small team\""}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "AI and computer vision · Absent from the website text; LinkedIn lists computer vision systems and smart cosmetics displays; the group ESG report speaks of AI-powered displays collecting anonymous demographic data [R] [S] · Ask how they position AI today"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Facts to know (checked 27/10/2026)", "t": "Founding · 2018 on directories; a New York filing dated October 2017 [R] · Do not give a year"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Q&A: your background and fit"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Walk me through your background (60 seconds)"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "For twenty-five years I have designed and run retail spaces, and my career has three chapters. At Sephora I was VP Visual Merchandising for EMEA: 540 stores, eleven countries, an eleven-million-euro budget. Then I co-founded Dia-Mart and ran its retail design subsidiary for ten years, with fifteen people and a two-million-euro P&L. Since 2017 I have run Jaizkibel, my consultancy, and I co-founded NUT, a reuse start-up where we raised 1.1 million euros and built hardware, computer vision and connectivity. This role brings it all together: luxury, the store floor, and a small tech business with its own P&L."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Give me four reasons we should hire you"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Four reasons."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "One: the profile fits the job description. I am an entrepreneur. I know how to run and manage a business unit from strategy to sales. Your recruiter described me as a Swiss Army knife, and that is exactly what a subsidiary of this size needs."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Two: I am an expert in visual merchandising. I know selective retail and the cosmetics sector from the inside, so I understand your clients' brands and their constraints."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Three: I am at ease with technology. I proved it at NUT, where I helped build a full reuse ecosystem: software, blockchain traceability and connected collection machines."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Four: I learn fast and I adapt. I work easily across functions, with design, tech, finance and sales, so I add value from the first weeks."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Why this version: each reason answers one line of the ad (business unit, sector, tech, cross-functional work). The Swiss Army knife quote is yours: use it only if the interviewer knows the recruiter, otherwise say \"people who know my work call me a Swiss Army knife\". Keep it to 60 seconds. No NUT figures, by your decision (28/10/2026)."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Why this role, and why now?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "I have led teams and run a P&L, and what draws me here is the change of scale: a major industrial group behind me, and a business already live in dozens of countries. I know the clients because I used to be one: the retail design and purchasing directors of the big beauty houses. This is a role where I can build something that lasts, with real resources."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "You have been independent since 2017. Why report to a Group Europe Director?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "I have worked inside groups: LVMH, Sephora, Toys \"R\" Us, Decathlon. I know governance, budgets and matrix reporting. My independent years taught me to deliver without waiting for permission, and I want to put that energy behind a strong group. A clear reporting line and real resources are exactly what I am looking for now."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "What do you know about DIAM and CONEX?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "DIAM is a visual merchandising and shopfitting group for beauty and luxury: more than three thousand people, sales above four hundred million euros, and Ardian as majority shareholder since 2024. CONEX is its in-store digital arm: more than five thousand connected devices, managed remotely over secure cellular connectivity, with field technicians worldwide. I worked with DIAM at Sephora, so I know the group from the client side. I would rather hear how you describe CONEX today: where is it strongest, and where do you want it to go?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "With the recruiter, stop there. Strategy comes in the interviews with the Group."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "How do you see a digital subsidiary inside an industrial group?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: your background and fit", "t": "Two things have to be true at the same time. The subsidiary needs the speed and autonomy of a start-up, and the group needs transparency on numbers and standards. I would agree early on what the subsidiary decides alone and what goes up to the group, and I would keep the reporting light but regular. The group also brings its best asset: the relationships with the beauty houses."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: tech, AI and design", "t": "Q&A: tech, AI and design"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: tech, AI and design", "t": "What is your connection to tech and AI?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: tech, AI and design", "t": "At NUT we built a reuse ecosystem: software that tracks containers between washers, restaurants and partners, blockchain traceability, and collection machines with computer vision that recognise each container and accept or reject it. All of it runs over cellular through GSM routers. I do not code, but I have built a product that combines hardware, vision, connectivity and software, and I know what it takes to deploy it."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: tech, AI and design", "t": "[NUT: no machine or volume figures, by your decision (28/10/2026). To complete if you wish: your role in the partner decisions with Veolia and Citeo.]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: tech, AI and design", "t": "You are not an engineer. How do you manage developers and AI specialists?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: tech, AI and design", "t": "I manage from the use case: what the brand needs to see in the store, what is feasible, and what it costs. I do not pretend to code; I ask precise questions and I protect the team's time. I am used to refereeing between creatives, engineers and clients. With scarce profiles, retention comes from a clear mission, autonomy, and a future inside the group."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: tech, AI and design", "t": "How do you judge whether a digital device serves a brand?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: tech, AI and design", "t": "A screen should disappear into the merchandising, not sit on top of it. I look at where it sits on the counter, how it blends into the fixture, and whether it helps the advisor or competes with her. Then I ask what it changes: dwell time, product understanding, conversion. If it moves none of those, it is decoration."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Q&A: leading the team"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Describe your management style"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "I set the goal and the checkpoints, then I give people room to decide how to get there. At Dia-Mart, with fifteen people, we won the Janus du Commerce and the LSA Trophy that way. In Moscow I led local teams for three years, so I am used to working across cultures, far from headquarters."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "What is the difference between leadership and management?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Management makes the system work: goals, budgets, planning, checkpoints, reporting. Leadership makes people want to go further than the system asks: a direction, trust, a reason to care. A manager without leadership gets compliance. A leader without management gets energy and no delivery. In a subsidiary like CONEX you need both, and the balance moves. When we structure finance and processes, I lean on management. When a small team has to build a pipeline from scratch, I lean on leadership. For me it comes down to one habit: I set the goal and the checkpoints, then I give people room to decide how to get there. At Dia-Mart, with fifteen people, that is how we won the Janus du Commerce and the LSA Trophy."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Your draft had the right idea. Two upgrades: the consequence of lacking one of the two, and a fact from your career. Keep it to 45 seconds."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "How would you manage a team split between France, New York and other regions?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Fixed routines: one weekly call at a time that works for both sides, written goals, and a local lead on each site. One week in six in New York keeps the human connection strong. I would spend my first month listening to each site before changing anything."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "How do you hire, develop and retain talent?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Written goals, regular check-ins, and a development plan for each person. At Dia-Mart I built and led a team of fifteen. In a team of about ten with scarce profiles, retention comes from a clear mission, real autonomy, and a visible future inside the group."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "[to complete: one standout hire or promotion at Dia-Mart.]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Tell me about working across cultures"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "In Moscow I led local teams for three years on a network of 1,300 stores. I learned to read the market before imposing a standard, to explain the reason behind each rule, and to give local managers real decisions. At Sephora I applied the same approach across eleven countries: one visual identity, adapted locally."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Tell me about a difficult situation in your career and how you handled it"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Situation. Let me take an example from a creative project. We were at phase two: presenting the concept to the executive committee. The CEO had not followed the earlier rounds. Within minutes he blocked the project and said it was not at all what he expected."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "First reaction: the room. I did not defend the concept. I changed the purpose of the meeting and turned it into a briefing reset. It was clear his vision was very different from the one our sponsor had given us. So I used the committee to align everyone, there and then, on one new brief."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Second reaction: my team. Then I went back to my creative team. They had worked in good faith on a brief that was no longer the right one, and that was my responsibility. I apologised, I explained the new direction, and I asked them to rework the creative routes."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Securing it. Finally, I wrote the new brief down and got it validated in writing. I shared it with the sponsor and with my creative director, so everyone was aligned on the new creative route before the team started working on it."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Result. The project was approved and delivered on time."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Optional closing line, only if it matches your practice: \"Since then, I always get the brief validated in writing by the decision-makers before the creative phase starts.\""}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Why it works: you stay calm under pressure, you turn a blockage into alignment, and you own a mistake with your team. Keep it to 90 seconds. Name no company and no person."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Tell me about a tough situation with a team member"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: leading the team", "t": "Prepare one real story of 90 seconds: the situation, your decision, what happened, what you changed afterwards. Choose Dia-Mart or Moscow. Candour about a difficulty is stronger than a polished story. [to complete]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "Q&A: finance and operations"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "What is your P&L experience?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "At Dia-Mart I owned a two-million-euro P&L, a team of fifteen and the client relationships, over ten years. At Sephora I managed an eleven-million-euro operating budget and more than seventy openings a year. At NUT I led the fundraising: 1.1 million raised and 600,000 in public grants. The scale is different from a group of four hundred million, but the discipline is the same: margin, cash, forecasts."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "How would you handle accounting, audits and compliance?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "In my first month I would sit with the Group finance team and learn how the subsidiary's P&L is built: hardware, services, recurring revenue. I would name the finance lead who works with me, and I would be the single point of contact for the auditors, with documents delivered on time. I am a commercial and operational leader, so I build strong finance support from day one."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "How do you follow an order book and forecasts?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "Every week I look at three things: orders signed, delivery and installation dates, and cash collected. I compare them with the quarterly forecast, explain each variance, and act early. If a date or a margin is at risk, the Group hears it from me first."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "[to complete: what you tracked at Dia-Mart: orders, margin, cash.]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "How do you improve margins in a business with hardware and services?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "I separate the three economics: the device, the installation, and the recurring service. Hardware sets the entry price, but services such as remote monitoring, content updates and maintenance build the margin and the stability. I would check unit economics per device and per store, and start with whatever repeats most often."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "How do you manage operational risk and continuity?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: finance and operations", "t": "I plan ahead: a continuity plan, a second source for critical components, and rollout milestones reviewed every week. In Moscow and at Feu Vert I ran network rollouts where a breakdown gets expensive fast. On compliance I rely on the Group's legal and finance teams, and I want a clear owner for each risk."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "Q&A: commercial"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "How do you negotiate price and terms with brands?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "I start with what the brand is really buying: not a screen, an outcome in the store. Then I price the whole package: device, installation, content and service. I trade volume or duration against price, never price alone. And I keep the purchasing director's needs in view: a clear price, deadlines kept, a reliable partner."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "Have you answered complex international tenders?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "Yes. Throughout my consulting work I answered briefs from retailers and brands, from proposal to rollout: Feu Vert, Giphar, E.Leclerc, La Prairie. I structure each response the same way: understanding of the need, technical offer, rollout plan, commercial terms."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "[to complete: one international tender: client, what you proposed, the result.]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "How do you work with Retail Design and Purchasing Directors?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "I know both sides of the table. A retail design director wants a device that fits the counter and rolls out identically in every country. A purchasing director wants a clear price, deadlines respected and a reliable partner. At Sephora I was the buyer of this kind of solution, so I speak both languages."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "Your first clients will come from the group. How do you also build your own pipeline?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "Two mandates at once. In the first year I would use the group's relationships with the beauty houses to sign the first deals, because the trust already exists. In parallel I would build a pipeline outside the group: brands DIAM does not serve, multi-brand retailers, travel retail. That is what gives the subsidiary its own value."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "How would you analyse the market and the competition?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: commercial", "t": "I would map the field in three layers: hardware, software and content, and integration and service. Then I would look at where CONEX is already strong, such as global field support and connectivity, and where customers feel pain. Decisions would rest on a short list of numbers: win rate, margin by offer, installed base."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: sustainability", "t": "Q&A: sustainability"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: sustainability", "t": "How do you see sustainability in in-store digital?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: sustainability", "t": "It belongs in the design brief from day one. CONEX already publishes strong points: remote maintenance that avoids store visits, a glue-free design so devices can be recycled, local production, and WEEE certification in France. I would push it further with data: energy use per device and recycling rates, reported to clients. At NUT I worked on reuse and reverse flows with Veolia and Citeo, so I know how to turn this into a business argument."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Q&A: personal and practical"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "What is your main weakness?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Impatience with long validation loops. When I know what needs doing, slow processes frustrate me. I have learned to anticipate: I prepare my requests earlier and bring the decision-makers in at the start. I am most effective in organisations where decisions move quickly."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Second answer, your own (28/10/2026): carrying problems alone, in leader's voice."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "My main weakness is that I tend to carry a problem on my own for too long before I bring in the right people. At my level, that has a cost: a decision made alone is slower and less robust than one challenged early. So I changed my method. On every important decision, I name the two or three people whose expertise I need, and I consult them before I commit, not after. I would rather be challenged on Monday than corrected three months later."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Why this version: a leader's job is not to know everything but to get the right expertise in the room fast. The weakness becomes a decision-making habit, not a personal difficulty. Method confirmed by you on 28/10/2026. One weakness per interview, under 30 seconds."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Where do you see yourself in five years?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "In five years, I want CONEX to be a recognised pillar of the DIAM group: a profitable digital subsidiary, with its own pipeline of clients and a team strong enough to run without me in the room. That is my first goal, and it will take my full attention. If we deliver, the results will speak for themselves, and I would be glad to take on a wider scope inside the group. But I want to earn that by transforming CONEX first."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Your draft had the right ambition. Two upgrades: a concrete picture of what CONEX looks like (profitable, own pipeline, autonomous team), and the order of priorities, so the interviewer does not hear a candidate already looking at the next job. Keep it to 30 seconds."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "The ad asks for bilingual English. How is yours?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "English is a working language for me. I led teams in Moscow and Manchester and I have presented in English throughout my career. I am sharpening my spoken English right now, so it never slows a negotiation. Professional, and improving every week."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Never say \"bilingual\" and never say \"I get by\"."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Are you available for New York and a December start?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Yes. One week in six in New York works for me, and early December is realistic. I can structure my consultancy so that it does not get in the way."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "[to decide, then say in one sentence: what you keep of Jaizkibel and your NUT shares.]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "What are your compensation expectations?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "We have already covered this: around a hundred thousand euros plus a company car. I am open on the split between fixed and variable, and on what the variable depends on. I would rather look at the package as a whole."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Q&A: personal and practical", "t": "Clarify once, in private, whether €100k is the fixed part or the total."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Key sentences for this role"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Short, spoken, each one carrying a fact. Say them aloud until they sound like you."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Your thread."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "For twenty-five years I have designed and run retail spaces, from Sephora's 540 stores to my own businesses."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Sephora."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "At Sephora I was VP of Visual Merchandising for EMEA: 540 stores, 11 countries, an eleven-million-euro budget, and over 70 openings a year."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Dia-Mart."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "I co-founded Dia-Mart and ran it for ten years: a fifteen-person subsidiary with a two-million-euro P&L."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "NUT, the technology."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "At NUT we built a full reuse ecosystem: container-tracking software, blockchain traceability, and collection machines with computer vision, all connected over cellular."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "NUT, the funding."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "I led the fundraising: 1.1 million euros raised and 600,000 in public grants, with partners like Veolia and Citeo."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "The buyer's side."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "I was the buyer at Sephora, so I know how a Retail Design Director decides, what they refuse, and what convinces them."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "DIAM."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "I have worked with DIAM before, at Sephora, so I know how seriously they work with the big beauty houses."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "International."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "In Moscow I led local teams for three years across a chain of more than 1,300 stores, so I am comfortable managing across cultures and time zones."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Management."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "I set clear goals and checkpoints, then I give people room to decide how to get there."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Why this role."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "I have already led teams and P&Ls. What draws me here is the scale: a strong industrial group behind me, and a business already live in dozens of countries."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Start-up and group."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "A subsidiary needs the speed of a start-up and the transparency a group expects, and I have lived both."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Two mandates."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "The first deals come from the group's relationships; the lasting value comes from a pipeline the subsidiary builds on its own."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Finance, with candour."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "I am a commercial and operational leader, so I build strong finance support from day one and I read the numbers every week."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Design sense."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "A screen should disappear into the merchandising, not sit on top of it."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Sustainability."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Sustainability belongs in the brief from day one: devices designed to be repaired, recycled and monitored for energy use."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "English."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "English is a working language for me, and I am sharpening it right now, so it never slows a negotiation."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Opening a discussion."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "I do not know CONEX from the inside, so I would rather hear how you describe it."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Closing."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "What you describe is a small tech business with its own P&L inside a strong industrial group, selling to clients I know from the inside. If you need someone who can be operational without six months of ramp-up on the sector, that is my profile."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "A blocked project."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "When a CEO blocked my concept, I turned the presentation into a briefing reset and aligned the whole committee in the room."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Owning a mistake."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "The brief had drifted, and that was on me, so I apologised to my team and we reworked the routes together."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "Brief in writing."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "After the reset, I put the new brief in writing and got the sponsor and my creative director to validate it."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Key sentences for this role", "t": "[to complete before the next interview: for sentence 7, the client and your role in the pitch with DIAM.]"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "Questions to ask"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "The recruiter"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "Why is the role open: a new position, a replacement, or a change in structure?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "What is the exact scope: the full P&L, a team of about ten, and what share of revenue comes from Group business units?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "How much autonomy would I have relative to the Europe Director, and what is the legal status?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "How many candidates are in the running, and what is the timeline? Who do I meet next?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "Does the Group lean towards a tech specialist or a luxury operator?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "What does the variable depend on, and which benefits come with it?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "The Europe Director and the Group"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "What are the three outcomes this role must deliver in the first twelve months?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "What share of revenue comes from DIAM's own clients, and what share from outside the group?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "How is revenue split between devices, installation and recurring services?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "The website speaks of 60+ countries on one page and 43 on another. How do you count countries and devices?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "How do you position AI and computer vision today, since the website focuses on connected screens and field service?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "Where do you see the next phase of growth for the digital arm under Ardian's ownership: new clients, new regions, acquisitions?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "What does the subsidiary decide alone, and what goes up to the Group?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "How do you want sustainability reporting to appear in the offer to clients: energy data, recycling rates?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "Questions to ask", "t": "What would tell you, a year from now, that I have been successful in this role?"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "VMSD wording to borrow"}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "Expressions seen on VMSD in October 2026, with a way to use each one in a sentence about in-store digital. The sentences are yours to adapt; the articles stay at the source."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "story-driven narratives · The content on the screens should tell a story, not repeat a price."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "warm minimalism · In luxury, I favour warm minimalism: fewer, stronger visuals."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "clean, minimalist installations · A clean, minimalist installation lets the product stay the hero."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "immersive, multilayered concepts · For a flagship, an immersive, multilayered concept is justified. For a counter, it is too much."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "responsive screens · Responsive screens react to the shopper, so the message fits the moment."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "motion-triggered content · Motion-triggered content wakes the screen when a shopper approaches the counter."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "tactile, immediate, physical brand experience · After hours online, shoppers want a tactile, immediate, physical brand experience."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "modular designs · Modular designs can be reused or reconfigured from one campaign to the next."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "recycled and paper-based materials · Recycled and paper-based materials are becoming the default for displays."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "fully circular surfacing · A store can use fully circular surfacing: recycled and recyclable panels."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "post-consumer waste · The panels are made from post-consumer waste."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "remotely control thousands of locations · One team can update content and monitor devices across thousands of locations remotely."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "transparent window LED display · A transparent window LED display keeps the window open while it carries the message."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "pixel pitch · The pixel pitch decides how close the shopper can stand before the image breaks up."}, {"p": "conex", "pt": "CONEX · DIAM", "s": "VMSD wording to borrow", "t": "differentiation is essential · In a crowded mall, differentiation is essential."}, {"p": "conex", "pt": "CONEX · ];
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* ---------- read aloud: US male voice by default ---------- */
const MALE = /\b(david|mark|guy|christopher|eric|roger|steffan|brian|andrew|ryan|fred|alex|aaron|daniel|tom|matthew|male|jorge|george)\b/i;
let voices = [];
function rank(v){
  const en = /^en/i.test(v.lang), us = /en[-_]US/i.test(v.lang), male = MALE.test(v.name), natural = /natural|online/i.test(v.name);
  return (us && male ? 0 : male && en ? 1 : male ? 2 : us ? 3 : en ? 4 : 6) + (natural ? -0.5 : 0);
}
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices();
  if(!all.length) return;
  voices = all.filter(v => /^en/i.test(v.lang)).sort((a, b) => rank(a) - rank(b));
  if(!voices.length) voices = all.slice().sort((a, b) => rank(a) - rank(b));
  const sel = $('#voix');
  const saved = store('voix');
  const ok = voices.some(v => v.name === saved);
  sel.innerHTML = voices.map((v, i) => `<option value="${esc(v.name)}"${(ok ? v.name === saved : i === 0) ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})${MALE.test(v.name) ? ' ♂' : ''}</option>`).join('');
}
function startVoicesPolling(){
  if(!('speechSynthesis' in window)) return;
  loadVoices();
  // both assignment and addEventListener for max compat
  speechSynthesis.onvoiceschanged = loadVoices;
  try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch(e){}
  // poll aggressively — Chrome iframes may only expose voices after repeated calls
  let polls = 0;
  const pid = setInterval(() => {
    loadVoices();
    polls++;
    // keep polling for 6 seconds, stop early only if we have multiple EN voices
    const enCount = voices.filter(v => /^en/i.test(v.lang)).length;
    if(enCount > 1 || polls > 30) clearInterval(pid);
  }, 200);
}
startVoicesPolling();
// reload voices on first user interaction (Chrome may unlock more voices after gesture)
document.addEventListener('pointerdown', () => { loadVoices(); }, { once: true });
const isAndroid = /android/i.test(navigator.userAgent);
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const doSpeak = () => {
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find(x => x.name === $('#voix').value) || voices[0];
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
    u.rate = parseFloat($('#vit').value) || 0.9;
    speechSynthesis.speak(u);
  };
  if(isAndroid){ setTimeout(doSpeak, 50); } else { doSpeak(); }
}
$('#voix').addEventListener('change', e => store('voix', e.target.value));
$('#vit').value = store('vit') || 0.9;
$('#vit').addEventListener('change', e => store('vit', e.target.value));
document.addEventListener('click', e => {
  const b = e.target.closest('.spk');
  if(b){ speak(b.dataset.say); }
});

/* ---------- theme ---------- */
(function(){
  const t = store('theme') || 'dark';
  document.documentElement.dataset.theme = t;
  $('#theme').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || 'dark';
    const nxt = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nxt; store('theme', nxt);
  });
})();

/* ---------- navigation ---------- */
const nav = $('#nav');
nav.innerHTML = TABS.map(t => `<button type="button" data-t="${t.id}">${esc(t.t)}</button>`).join('');
nav.addEventListener('click', e => { const b = e.target.closest('button'); if(b){ $('#q').value=''; location.hash = b.dataset.t; route(); } });
window.addEventListener('hashchange', route);

function setActive(id){
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.t === id ? 'true' : 'false'));
}
function route(){
  const q = $('#q').value.trim();
  if(q.length >= 2){ return renderSearch(q); }
  const id = (location.hash || '#home').slice(1).split('/')[0];
  const tab = TABS.find(t => t.id === id) ? id : 'home';
  setActive(tab);
  if(tab === 'home') renderHome();
  else if(tab === 'lexique') renderLexique();
  else if(tab === 'phrases') renderPhrases();
  else if(tab === 'niveauc') renderLevelC();
  else renderPage(tab);
  window.scrollTo(0, 0);
}

/* ---------- Markdown pages ---------- */
function renderPage(id){
  const p = DATA.pages.find(x => x.id === id);
  const main = $('#main');
  main.innerHTML = '<h1>' + esc(p.titre) + '</h1>' + p.html;
  const h1s = main.querySelectorAll('h1'); if(h1s.length > 1) h1s[1].remove();
  const h2s = [...main.querySelectorAll('h2')];
  if(h2s.length > 2){
    const toc = document.createElement('div'); toc.className = 'toc';
    toc.innerHTML = '<b>On this page</b><br>' + h2s.map(h => `<a href="#${esc(id)}" data-go="${h.id}">${h.innerHTML}</a>`).join('');
    toc.addEventListener('click', e => { const a = e.target.closest('a'); if(a){ e.preventDefault(); document.getElementById(a.dataset.go).scrollIntoView(); } });
    main.insertBefore(toc, main.children[1]);
  }
}
