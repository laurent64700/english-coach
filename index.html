<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --ink:#1d2327; --muted:#5d666d; --line:#dcdad2;
  --accent:#1f5f4a; --accent-ink:#ffffff; --accent-soft:#e3f0ea; --say:#eef3fa; --say-line:#b9cbe6;
  --warn:#8a5a00; --warn-soft:#fff3d6; --code:#efece4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181a; --surface:#1e2225; --ink:#e8e6e1; --muted:#9aa3a9; --line:#343a3e;
    --accent:#6fc7a5; --accent-ink:#0f1a15; --accent-soft:#1f3329; --say:#1a2330; --say-line:#33496b;
    --warn:#f0c46a; --warn-soft:#3a2f14; --code:#2a2d2f;
  }
}
:root[data-theme="dark"]{
  --bg:#15181a; --surface:#1e2225; --ink:#e8e6e1; --muted:#9aa3a9; --line:#343a3e;
  --accent:#6fc7a5; --accent-ink:#0f1a15; --accent-soft:#1f3329; --say:#1a2330; --say-line:#33496b;
  --warn:#f0c46a; --warn-soft:#3a2f14; --code:#2a2d2f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;max-width:1100px;margin:0 auto}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.search{flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.voice{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.voice select,.voice input{font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px;max-width:210px}
nav{overflow-x:auto;white-space:nowrap;border-top:1px solid var(--line)}
nav .in{display:flex;gap:2px;max-width:1100px;margin:0 auto;padding:0 12px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-size:15px;padding:10px 12px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:28px;margin:8px 0 12px}
h2{font-size:21px;margin:32px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:22px 0 6px}
p{margin:8px 0}
ul,ol{padding-left:22px;margin:8px 0}
li{margin:4px 0}
a{color:var(--accent)}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
.sub{margin:6px 0}
.say{background:var(--say);border-left:4px solid var(--say-line);border-radius:6px;padding:6px 14px;margin:10px 0}
.say p{margin:8px 0}
.spk{border:1px solid var(--say-line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:13px;padding:1px 6px;margin-right:4px;vertical-align:baseline}
.spk:hover{background:var(--accent-soft)}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft)}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0 16px}
.toc b{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.toc a{display:inline-block;margin:4px 10px 0 0;font-size:14px;text-decoration:none}
.toc a:hover{text-decoration:underline}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.tools input[type=search],.tools select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{color:var(--muted);font-size:14px;margin:4px 0 8px}
.en{font-weight:600}
.say-txt{color:var(--muted);font-size:13px}
.fr{color:var(--muted);font-size:13px;display:block}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.yg{font-size:12px;margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.go{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.go:hover{border-color:var(--accent)}
.go b{display:block;color:var(--accent);margin-bottom:2px}
.go span{font-size:14px;color:var(--muted)}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.hit small{color:var(--muted);display:block}
mark{background:var(--warn-soft);color:var(--ink);padding:0 2px;border-radius:3px}
.theme{background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink);cursor:pointer;padding:4px 8px;font-size:13px}
@media print{
  header,.toc,.tools,.chips,.spk{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  main{padding:0;max-width:none}
  h2{break-after:avoid}
}
@media (max-width:640px){
  .top{gap:8px}
  .brand{width:100%}
  th,td{padding:6px 7px;font-size:14px}
}
</style>
</head>

  <div class="top">
    <div class="brand">English toolbox</div>
    <div class="search"><input id="q" type="search" placeholder="Search a word, a phrase, a topic…" aria-label="Search the whole toolbox"></div>

      <label for="voix">Voice</label><select id="voix" aria-label="Reading voice"></select>

      <button class="theme" id="theme" type="button" aria-label="Switch light or dark theme">◐</button>

</header>
<main id="main"></main>

<script>
const DATA = {"pages": [{"id": "avant", "titre": "Before an interview", "html": "<h1>Before an interview: the page to reread in five minutes<\/h1>\n<h2 id=\"avant-0\">My five figures to say without hesitation<\/h2>\n<ul>\n<li><strong>540<\/strong> stores, <strong>11<\/strong> countries, <strong>70<\/strong> openings a year (Sephora, 2004–2008).\n<\/li>\n<li><strong>1,300<\/strong> stores, three years leading local teams (L'Étoile, Moscow).\n<\/li>\n<li>A team of <strong>15<\/strong>, a <strong>two-million-euro<\/strong> P&amp;L (UX Retail Design, 2008–2018).\n<\/li>\n<li>More than <strong>50<\/strong> concepts delivered (Jaizkibel, since 2017).\n<\/li>\n<li><strong>1.1 million euros<\/strong> raised, <strong>600,000<\/strong> in public grants (NUT, since 2023).\n<\/li>\n<\/ul>\n<h2 id=\"avant-1\">My opening line<\/h2>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I have spent twenty-five years designing and running stores. I take charge of a retailer&#x27;s concept, customer journey and store standards, from strategy to network rollout.\">🔊<\/button> I have spent twenty-five years designing and running stores. I take charge of a retailer's concept, customer journey and store standards, from strategy to network rollout.<\/p>\n<\/div>\n<p>Quick reading: the <em>My profile<\/em> tab (30 seconds, 60 seconds, two minutes).<\/p>\n<h2 id=\"avant-2\">My three key messages<\/h2>\n<ol>\n<li><strong>Scale<\/strong>: I make an identity hold across hundreds of stores.\n<\/li>\n<li><strong>Both sides of the table<\/strong>: retailer (Sephora) and agency (Dia-Mart, Jaizkibel).\n<\/li>\n<li><strong>Applicable standards<\/strong>: tools that teams use without me.\n<\/li>\n<\/ol>\n<h2 id=\"avant-3\">My three stories, ready<\/h2>\n<p>Sephora (scale) · L'Étoile (network and local teams) · UX Retail Design (team, P&amp;L, awards). Details: the <em>Stories<\/em> tab.<\/p>\n<h2 id=\"avant-4\">My three questions to ask<\/h2>\n<ol>\n<li><em>What are the most critical outcomes for this role in the next twelve to eighteen months?<\/em>\n<\/li>\n<li><em>Who are the main partners for this role, and how are design standards approved?<\/em>\n<\/li>\n<li><em>What would tell you, a year from now, that I have been successful?<\/em>\n<\/li>\n<\/ol>\n<h2 id=\"avant-5\">My closing line<\/h2>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Based on everything we have discussed, I am very interested in this role. Is there anything that would hold you back from moving me forward?\">🔊<\/button> Based on everything we have discussed, I am very interested in this role. Is there anything that would hold you back from moving me forward?<\/p>\n<\/div>\n<h2 id=\"avant-6\">Five Level C moves to use today<\/h2>\n<ul>\n<li>Open an answer with the claim: <em>The short answer is yes, and here is why.<\/em>\n<\/li>\n<li>Use one pivot word to turn a point: <em>That said, …<\/em> / <em>By the same token, …<\/em>\n<\/li>\n<li>Hedge one claim with precision: <em>Broadly speaking, …<\/em> / <em>In most cases, …<\/em>\n<\/li>\n<li>Land one idiom, only one, and only if it is yours: <em>We hit the ground running.<\/em>\n<\/li>\n<li>End a point with the result, and stop talking.\n<\/li>\n<\/ul>\n<p>More in the <em>Level C<\/em> tab.<\/p>\n<h2 id=\"avant-7\">Thirty seconds before you walk in<\/h2>\n<p>Breathe. Say the key figures slowly. One idea, one sentence. \"I\" for decisions, \"we\" for the team.<\/p>\n<h2 id=\"avant-8\">The target file<\/h2>\n<p><em>Targets<\/em> tab: MAF, Amouage, Chalhoub. Reread \"Your angle\" and the questions to ask.<\/p>\n<p>For the Expertise Center Manager role (CONEX · DIAM): the <em>CONEX · DIAM<\/em> tab holds the ad block by block, the verified facts, the questions with answers and the twenty-one key sentences.<\/p>"}, {"id": "profil", "titre": "My profile", "html": "<h1>My profile<\/h1>\n<p>Facts come from the English CV of 05/10/2026 (CV_LP_EN_MAF) and the cover letters already written. Every block below is spoken English: press 🔊 to hear it, then say it aloud in 30 to 60 seconds.<\/p>\n<h2 id=\"profil-0\">Tell me about yourself<\/h2>\n<h3>The 30-second hook<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I have spent twenty-five years designing and running stores. I was VP Visual Merchandising EMEA at Sephora, with 540 stores in 11 countries. Since then I have led retail design agencies and delivered more than fifty concepts, from strategy to network rollout. I take charge of a retailer&#x27;s concept, customer journey and store standards.\">🔊<\/button> I have spent twenty-five years designing and running stores. I was VP Visual Merchandising EMEA at Sephora, with 540 stores in 11 countries. Since then I have led retail design agencies and delivered more than fifty concepts, from strategy to network rollout. I take charge of a retailer's concept, customer journey and store standards.<\/p>\n<\/div>\n<h3>The 60-second version: corporate retail<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I have spent twenty-five years designing and running stores. I started at Decathlon and Toys &quot;R&quot; Us, then became Vice President of Visual Merchandising EMEA at Sephora. That meant 540 stores in 11 countries, seventy openings a year and ten exclusive brands, from planogram to bespoke fixtures.\">🔊<\/button> I have spent twenty-five years designing and running stores. I started at Decathlon and Toys \"R\" Us, then became Vice President of Visual Merchandising EMEA at Sephora. That meant 540 stores in 11 countries, seventy openings a year and ten exclusive brands, from planogram to bespoke fixtures.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Since 2008 I have led retail design agencies: first the retail design arm of Dia-Mart, with a team of fifteen and a two-million-euro P&amp;L, then my own agency, Jaizkibel. I have delivered more than fifty concepts, from the Beauty floor of La Samaritaine to Feu Vert and Giphar. In Moscow I led the local teams for three years across thirteen hundred stores for L&#x27;Étoile.\">🔊<\/button> Since 2008 I have led retail design agencies: first the retail design arm of Dia-Mart, with a team of fifteen and a two-million-euro P&amp;L, then my own agency, Jaizkibel. I have delivered more than fifty concepts, from the Beauty floor of La Samaritaine to Feu Vert and Giphar. In Moscow I led the local teams for three years across thirteen hundred stores for L'Étoile.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"What I do best is turn a brand idea into standards that teams can apply across a whole network. That is what I would like to do in-house.\">🔊<\/button> What I do best is turn a brand idea into standards that teams can apply across a whole network. That is what I would like to do in-house.<\/p>\n<\/div>\n<h3>The 60-second version: beauty and luxury<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Beauty retail is the thread of my career. At Sephora I owned the visual strategy and store concept for EMEA: 540 stores, eleven countries, and ten exclusive brands managed from planogram to bespoke fixtures. I also built the processes and tools for brand allocation and store planning.\">🔊<\/button> Beauty retail is the thread of my career. At Sephora I owned the visual strategy and store concept for EMEA: 540 stores, eleven countries, and ten exclusive brands managed from planogram to bespoke fixtures. I also built the processes and tools for brand allocation and store planning.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Then I founded Jaizkibel, an agency that works with houses like La Prairie, Aubade and Nocibé, and I designed the Beauty floor of La Samaritaine, with more than seventy brands. The principle never changes: a store is the most honest expression of a brand, and the standard has to travel from one market to the next without losing what makes the brand recognisable.\">🔊<\/button> Then I founded Jaizkibel, an agency that works with houses like La Prairie, Aubade and Nocibé, and I designed the Beauty floor of La Samaritaine, with more than seventy brands. The principle never changes: a store is the most honest expression of a brand, and the standard has to travel from one market to the next without losing what makes the brand recognisable.<\/p>\n<\/div>\n<h3>The 60-second version: assignment (consulting)<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I work in assignments. A retailer calls me when a concept needs rethinking or a network needs aligning, and I take charge from strategy to rollout: the concept, the customer journey, the standards and the teams that apply them. I have done it for more than fifty concepts, including long assignments in Moscow for L&#x27;Étoile, with thirteen hundred stores, and in Manchester for Perscent Group. I am available for assignments in France and abroad.\">🔊<\/button> I work in assignments. A retailer calls me when a concept needs rethinking or a network needs aligning, and I take charge from strategy to rollout: the concept, the customer journey, the standards and the teams that apply them. I have done it for more than fifty concepts, including long assignments in Moscow for L'Étoile, with thirteen hundred stores, and in Manchester for Perscent Group. I am available for assignments in France and abroad.<\/p>\n<\/div>\n<h3>The two-minute version (\"walk me through your CV\")<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I will go in chronological order and stay on what matters for this role.\">🔊<\/button> I will go in chronological order and stay on what matters for this role.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I started in 1997 at Decathlon, as visual merchandiser and trainer, then store manager. I set merchandising guidelines, trained more than 250 managers across Europe and opened 24 stores.\">🔊<\/button> I started in 1997 at Decathlon, as visual merchandiser and trainer, then store manager. I set merchandising guidelines, trained more than 250 managers across Europe and opened 24 stores.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In 1999 I joined Toys &quot;R&quot; Us as Store Planning Manager for Europe: 32 remodels and three openings, and our concept was named Best Concept of the Year in 2002.\">🔊<\/button> In 1999 I joined Toys \"R\" Us as Store Planning Manager for Europe: 32 remodels and three openings, and our concept was named Best Concept of the Year in 2002.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In 2004 I joined Sephora, part of LVMH, as Vice President Visual Merchandising EMEA. I owned the strategy, the store concept and operations, with an operating budget of 11 million euros, 540 stores and 11 countries.\">🔊<\/button> In 2004 I joined Sephora, part of LVMH, as Vice President Visual Merchandising EMEA. I owned the strategy, the store concept and operations, with an operating budget of 11 million euros, 540 stores and 11 countries.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In 2008 I co-founded Dia-Mart In Situ and ran the retail design subsidiary: full P&amp;L, a team of fifteen, and award-winning omnichannel concepts for more than twenty retailers.\">🔊<\/button> In 2008 I co-founded Dia-Mart In Situ and ran the retail design subsidiary: full P&amp;L, a team of fifteen, and award-winning omnichannel concepts for more than twenty retailers.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Since 2017 I run Jaizkibel, my own agency: Feu Vert, Giphar, La Samaritaine, and the Moscow assignment for L&#x27;Étoile. In 2023 I also co-founded NUT, a reuse and circular-economy company, where I raised 1.1 million euros.\">🔊<\/button> Since 2017 I run Jaizkibel, my own agency: Feu Vert, Giphar, La Samaritaine, and the Moscow assignment for L'Étoile. In 2023 I also co-founded NUT, a reuse and circular-economy company, where I raised 1.1 million euros.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"So the common thread is simple: concept, standards and rollout at network scale.\">🔊<\/button> So the common thread is simple: concept, standards and rollout at network scale.<\/p>\n<\/div>\n<h2 id=\"profil-1\">Why should we hire you?<\/h2>\n<p>Opening formula from your notes: \"I know you are looking for someone who can (problem), and I bring proven experience doing exactly that.\" Fill in the problem of the role, then add a proof from the CV.<\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I know you are looking for someone who can give your stores a clear design direction and make it hold across formats. I have done exactly that: at Sephora, 540 stores in eleven countries ran on one visual identity, and since then I have delivered more than fifty concepts from strategy to rollout. I bring the creative direction, and the discipline to make standards work on the shop floor.\">🔊<\/button> I know you are looking for someone who can give your stores a clear design direction and make it hold across formats. I have done exactly that: at Sephora, 540 stores in eleven countries ran on one visual identity, and since then I have delivered more than fifty concepts from strategy to rollout. I bring the creative direction, and the discipline to make standards work on the shop floor.<\/p>\n<\/div>\n<p>Proofs to draw on, all from the CV:<\/p>\n<ul>\n<li>Scale: 540+ stores and 70+ openings a year (Sephora); 1,300+ stores (L'Étoile, Moscow).\n<\/li>\n<li>Team and P&amp;L: a team of 15 and a €2M P&amp;L (UX Retail Design).\n<\/li>\n<li>Awarded creative work: Janus du Commerce, Trophée LSA; Best Concept of the Year 2002 (Toys \"R\" Us).\n<\/li>\n<li>Brands on a network: ten exclusive US brands managed from planogram to bespoke fixtures (Sephora).\n<\/li>\n<li>Circular economy: NUT, €1.1M raised and €600k of public grants.\n<\/li>\n<\/ul>\n<h2 id=\"profil-2\">Why this role, why now?<\/h2>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I am looking for a role where design and retail performance meet. I have worked on both sides of the table: inside a retailer, at Sephora, and on the agency side. I want to put that experience at the service of one network, with a long-term vision, and see the concepts I design deliver results over time.\">🔊<\/button> I am looking for a role where design and retail performance meet. I have worked on both sides of the table: inside a retailer, at Sephora, and on the agency side. I want to put that experience at the service of one network, with a long-term vision, and see the concepts I design deliver results over time.<\/p>\n<\/div>\n<h2 id=\"profil-3\">Why Dubai, why the Gulf?<\/h2>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"The Gulf is where retail is being reinvented at scale: new formats, new malls, fast openings. I know how to run a concept across many countries, and I am mobile and available to join you in Dubai.\">🔊<\/button> The Gulf is where retail is being reinvented at scale: new formats, new malls, fast openings. I know how to run a concept across many countries, and I am mobile and available to join you in Dubai.<\/p>\n<\/div>\n<h2 id=\"profil-4\">Where do you see yourself in five years?<\/h2>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In five years I see myself leading the design direction of a network, with a strong team and standards that run without me. I want to have delivered concepts that the stores can apply and that customers remember.\">🔊<\/button> In five years I see myself leading the design direction of a network, with a strong team and standards that run without me. I want to have delivered concepts that the stores can apply and that customers remember.<\/p>\n<\/div>\n<h2 id=\"profil-5\">Availability, mobility, salary<\/h2>\n<ul>\n<li>Availability: <em>\"I am available to start quickly, and I can relocate.\"<\/em> State your actual notice period when it comes up.\n<\/li>\n<li>Mobility: <em>\"I am mobile and available to join you in Dubai.\"<\/em> (the sentence from the MAF letter).\n<\/li>\n<li>Salary, a prudent formula: <em>\"I would like to understand the full scope of the role first. I am confident we will find a package in line with a director position in Dubai.\"<\/em> On the MAF portal you entered 50,000 (assumed AED per month): check the unit before you quote a figure.\n<\/li>\n<\/ul>\n<h2 id=\"profil-6\">Notes to self<\/h2>\n<ul>\n<li>Sephora title: \"Vice President, Visual Merchandising EMEA\", 2004–2008 (aligned with the CV).\n<\/li>\n<li>\"I take charge of…\" is the line from your CV. Keep it: it sounds direct.\n<\/li>\n<li>\"Interim\" and \"transition\" no longer appear in the MAF portal CV. In speech, \"assignment\" covers both formats, assignment or permanent role.\n<\/li>\n<\/ul>"}, {"id": "histoires", "titre": "Stories", "html": "<h1>Stories<\/h1>\n<p>Each story starts from facts in your CV. The slots marked <strong>[to complete]<\/strong> wait for a figure or a detail only you know: the measurable result, a name, a duration. A story of 60 to 90 seconds runs in four beats: Situation, Task, Action, Result.<\/p>\n<p>Golden rule from your notes: speak as an executive. \"I led\", \"I owned\", \"I built\", \"I decided\".<\/p>\n<h2 id=\"histoires-0\">Map: which story for which question<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Question<\/th><th>Story to use<\/th><\/tr><\/thead><tbody>\n<tr><td>Prioritising competing deadlines<\/td><td>1 Sephora (70 openings a year), 4 Jaizkibel<\/td><\/tr>\n<tr><td>Influencing without authority<\/td><td>1 Sephora (brands and stores), 2 L'Étoile (local teams)<\/td><\/tr>\n<tr><td>A complex project with many stakeholders<\/td><td>2 L'Étoile, 3 Feu Vert<\/td><\/tr>\n<tr><td>A disagreement with a colleague or a leader<\/td><td>8 (to complete)<\/td><\/tr>\n<tr><td>Feedback you did not agree with<\/td><td>9 (to complete)<\/td><\/tr>\n<tr><td>A mistake and what you learned<\/td><td>10 (to complete)<\/td><\/tr>\n<tr><td>Leading a team and a P&amp;L<\/td><td>5 UX Retail Design<\/td><\/tr>\n<tr><td>Innovation and sustainability<\/td><td>7 NUT<\/td><\/tr>\n<tr><td>Measurable results<\/td><td>5 (awards), 6 Toys \"R\" Us, 3 Giphar<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"histoires-1\">1. Sephora: one visual identity for 540 stores<\/h2>\n<ul>\n<li><strong>Situation:<\/strong> VP Visual Merchandising EMEA (2004–2008). 540+ stores, 11 countries, 70+ openings a year, €11M operating budget.\n<\/li>\n<li><strong>Task:<\/strong> keep a single visual identity from Paris to Moscow while managing ten exclusive US brands.\n<\/li>\n<li><strong>Action:<\/strong> built the processes and tools for brand allocation and store planning; approved brand fixture plans and checked furniture compliance; managed the brands from planogram to bespoke fixtures.\n<\/li>\n<li><strong>Result:<\/strong> <strong>[to complete: for example shorter opening lead time, compliance rate, number of brands deployed without deviation]<\/strong>.\n<\/li>\n<\/ul>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"At Sephora I owned the visual strategy for EMEA: 540 stores, 11 countries, and 70 openings a year. My task was to keep one visual identity across all markets, with ten exclusive brands on top. I built the processes and tools for brand allocation and store planning, and I validated every brand&#x27;s fixture plan against our standards. The result was a network that opened fast and looked consistent, from Paris to the Middle East.\">🔊<\/button> At Sephora I owned the visual strategy for EMEA: 540 stores, 11 countries, and 70 openings a year. My task was to keep one visual identity across all markets, with ten exclusive brands on top. I built the processes and tools for brand allocation and store planning, and I validated every brand's fixture plan against our standards. The result was a network that opened fast and looked consistent, from Paris to the Middle East.<\/p>\n<\/div>\n<h2 id=\"histoires-2\">2. L'Étoile, Moscow: a network of 1,300 stores<\/h2>\n<ul>\n<li><strong>Situation:<\/strong> a long assignment for L'Étoile, a beauty network of 1,300+ stores.\n<\/li>\n<li><strong>Task:<\/strong> create the concept, the flagship and the private label concept, then have local teams apply them.\n<\/li>\n<li><strong>Action:<\/strong> designed the concept and the flagship, the private label concept, and led the local teams for three years.\n<\/li>\n<li><strong>Result:<\/strong> <strong>[to complete: number of stores converted, sales evolution, rollout time]<\/strong>.\n<\/li>\n<\/ul>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"For L&#x27;Étoile in Moscow, I created the store concept, the flagship and the private label concept for a network of 1,300 stores. Then I stayed for three years to lead the local teams who applied it. My approach was to read the market first, then set a standard the teams could run without me. [Result to add.]\">🔊<\/button> For L'Étoile in Moscow, I created the store concept, the flagship and the private label concept for a network of 1,300 stores. Then I stayed for three years to lead the local teams who applied it. My approach was to read the market first, then set a standard the teams could run without me. [Result to add.]<\/p>\n<\/div>\n<h2 id=\"histoires-3\">3. Feu Vert and Giphar: from concept to rollout<\/h2>\n<ul>\n<li><strong>Situation:<\/strong> Jaizkibel assignments, 2021–2025. Feu Vert (interior concept, merchandising, digital journey, exterior identity, then rollout). Giphar (new concept and a 500 sqm format).\n<\/li>\n<li><strong>Task:<\/strong> design a concept that holds across a network.\n<\/li>\n<li><strong>Action:<\/strong> end-to-end design, from strategy to rollout.\n<\/li>\n<li><strong>Result:<\/strong> <strong>[to complete: stores delivered, commercial result of the pilot stores]<\/strong>.\n<\/li>\n<\/ul>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"For Feu Vert I designed the full concept: interior, merchandising, digital journey and exterior identity, and then I managed the rollout. The principle is always the same: a concept is only good if the teams can apply it, store after store.\">🔊<\/button> For Feu Vert I designed the full concept: interior, merchandising, digital journey and exterior identity, and then I managed the rollout. The principle is always the same: a concept is only good if the teams can apply it, store after store.<\/p>\n<\/div>\n<h2 id=\"histoires-4\">4. Jaizkibel: fifty-plus concepts, one method<\/h2>\n<ul>\n<li><strong>Situation:<\/strong> agency founded in 2017, more than 50 concepts delivered for beauty, health and service brands.\n<\/li>\n<li><strong>Task:<\/strong> run several assignments in parallel without letting any of them slip.\n<\/li>\n<li><strong>Action:<\/strong> <strong>[to complete: your priority rule, how you split the work, how you keep the client informed]<\/strong>.\n<\/li>\n<li><strong>Result:<\/strong> <strong>[to complete]<\/strong>.\n<\/li>\n<\/ul>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Running several concepts at once taught me to prioritise by impact, not by noise. [Add your own rule and one example.]\">🔊<\/button> Running several concepts at once taught me to prioritise by impact, not by noise. [Add your own rule and one example.]<\/p>\n<\/div>\n<h2 id=\"histoires-5\">5. UX Retail Design (Dia-Mart): a team of 15 and a €2M P&amp;L<\/h2>\n<ul>\n<li><strong>Situation:<\/strong> 2008–2018, co-founder and associate director, running the retail design subsidiary.\n<\/li>\n<li><strong>Task:<\/strong> grow the subsidiary while keeping a creative quality that peers recognised.\n<\/li>\n<li><strong>Action:<\/strong> ran the P&amp;L (€2M revenue), managed a team of 15, owned the client relationships.\n<\/li>\n<li><strong>Result:<\/strong> award-winning omnichannel concepts (Janus du Commerce, Trophée LSA) for more than 20 retailers.\n<\/li>\n<\/ul>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I ran the retail design subsidiary of Dia-Mart: full P&amp;L, two million euros of revenue, and a team of fifteen. We built omnichannel concepts for more than twenty retailers, and our work won the Janus du Commerce and the LSA Trophy.\">🔊<\/button> I ran the retail design subsidiary of Dia-Mart: full P&amp;L, two million euros of revenue, and a team of fifteen. We built omnichannel concepts for more than twenty retailers, and our work won the Janus du Commerce and the LSA Trophy.<\/p>\n<\/div>\n<h2 id=\"histoires-6\">6. Toys \"R\" Us: Best Concept of the Year 2002<\/h2>\n<ul>\n<li><strong>Situation:<\/strong> Store Planning Manager Europe (1999–2004). 32 remodels and 3 openings.\n<\/li>\n<li><strong>Task:<\/strong> adapt American concepts to European constraints.\n<\/li>\n<li><strong>Action:<\/strong> <strong>[to complete: what you changed in the concept for Europe]<\/strong>.\n<\/li>\n<li><strong>Result:<\/strong> the concept was named \"Best Concept of the Year\" in 2002.\n<\/li>\n<\/ul>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"At Toys &quot;R&quot; Us I adapted the retail concept for Europe: thirty-two remodels and three openings. In 2002 our concept was named Best Concept of the Year.\">🔊<\/button> At Toys \"R\" Us I adapted the retail concept for Europe: thirty-two remodels and three openings. In 2002 our concept was named Best Concept of the Year.<\/p>\n<\/div>\n<h2 id=\"histoires-7\">7. NUT: raising funds and making circularity a business model<\/h2>\n<ul>\n<li><strong>Situation:<\/strong> co-founder and shareholder since 2023, a reuse company for retail and food, team of 7.\n<\/li>\n<li><strong>Task:<\/strong> build a model that reduces retail's environmental impact, and secure the funding.\n<\/li>\n<li><strong>Action:<\/strong> strategy, pitch deck, financial development; partnerships with Veolia and Citeo.\n<\/li>\n<li><strong>Result:<\/strong> €1.1M raised and €600k in public grants (FEDER, Bpifrance, Region); winner of Pépite Tech 2023/2024 and of the DIESE Dauphine programme.\n<\/li>\n<\/ul>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In 2023 I co-founded NUT, a reuse company for retail and food. I owned the strategy, the pitch deck and the financial plan. We raised 1.1 million euros and secured 600,000 euros in public grants, and we won Pépite Tech.\">🔊<\/button> In 2023 I co-founded NUT, a reuse company for retail and food. I owned the strategy, the pitch deck and the financial plan. We raised 1.1 million euros and secured 600,000 euros in public grants, and we won Pépite Tech.<\/p>\n<\/div>\n<h2 id=\"histoires-8\">8. A disagreement with a leader or a colleague (to complete)<\/h2>\n<p>What the recruiter expects: the challenge, what you considered, why you decided as you did, the impact on the team or the organisation. Pick a real case (a client, a brand director, an architect, a manufacturer).<\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I disagreed with [who] about [what]. I looked at [data, the customer, the cost]. I decided to [decision], because [reason]. The impact was [result], and the relationship [stayed strong, improved].\">🔊<\/button> I disagreed with [who] about [what]. I looked at [data, the customer, the cost]. I decided to [decision], because [reason]. The impact was [result], and the relationship [stayed strong, improved].<\/p>\n<\/div>\n<h2 id=\"histoires-9\">9. Feedback you did not agree with (to complete)<\/h2>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I received feedback I did not agree with: [what]. I asked for examples to understand the view behind it. [What you found.] I then [what you changed, or how you explained your position].\">🔊<\/button> I received feedback I did not agree with: [what]. I asked for examples to understand the view behind it. [What you found.] I then [what you changed, or how you explained your position].<\/p>\n<\/div>\n<h2 id=\"histoires-10\">10. A mistake (to complete)<\/h2>\n<p>Choose a real mistake, corrected, with a lesson you have applied since.<\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I made a mistake on [project]: [what happened]. I told [who] right away, we fixed it by [action], and since then I [new habit].\">🔊<\/button> I made a mistake on [project]: [what happened]. I told [who] right away, we fixed it by [action], and since then I [new habit].<\/p>\n<\/div>\n<h2 id=\"histoires-11\">What I left out of the coaching texts<\/h2>\n<p>The \"Hermès\" coaching text in your folder tells episodes that appear neither in your CV nor in your letters: Aubade's central fitting room, an L'Oréal concept in Milan, an award won by Atol, \"+20% sales\" in pilot stores, \"50 projects in parallel\" (your CV says \"50+ concepts\" in total), \"+15–25% sales\" for La Prairie and Nespresso. I left them out, because nothing in your files confirms them. If one is true, give me the figure and the source and I will add it. The NUT figures (€1.1M raised, €600k of grants) do appear in your CV: they are used.<\/p>"}, {"id": "questions", "titre": "Questions", "html": "<h1>Questions: to ask, to expect<\/h1>\n<p>The questions come from your notes of 26/01/2026 and the \"Key question\" document. The answers are skeletons of three to five sentences, built on the facts of your CV. The full stories are in \"Stories\".<\/p>\n<h2 id=\"questions-0\">Questions you ask (your five, plus mine)<\/h2>\n<p>Your five questions, in crisp English:<\/p>\n<ol>\n<li><em>If you look at the next twelve to eighteen months, what are the most critical outcomes this role needs to drive, and how do you measure success?<\/em>\n<\/li>\n<li><em>Where does this function have the greatest opportunity to increase its influence across the organisation?<\/em>\n<\/li>\n<li><em>What is the biggest constraint, or reality, someone stepping into this role needs to grasp quickly?<\/em>\n<\/li>\n<li><em>How does the leadership team want this role to show up in cross-functional decisions?<\/em>\n<\/li>\n<li><em>A year from now, what would tell you that I have been successful in this role?<\/em>\n<\/li>\n<\/ol>\n<p>Added questions, useful for a design and retail concept role:<\/p>\n<ol>\n<li><em>Why is this position open? Is it a new role, or did the previous person move on?<\/em>\n<\/li>\n<li><em>Which formats or brands are the priority for the design direction this year?<\/em>\n<\/li>\n<li><em>Who are the main partners for this role: architects, fit-out contractors, operations, marketing, landlords?<\/em>\n<\/li>\n<li><em>How are design standards approved today, and who has the final say?<\/em>\n<\/li>\n<li><em>What does a typical year of rollout look like: how many remodels and new openings?<\/em>\n<\/li>\n<li><em>Which store or project would you point to as the best example of what you want?<\/em>\n<\/li>\n<li><em>What does the team look like today, and where do you want to strengthen it?<\/em>\n<\/li>\n<\/ol>\n<h2 id=\"questions-1\">Closing line<\/h2>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Based on everything we have discussed, I am very interested in this role. Is there anything that would hold you back from moving me forward?\">🔊<\/button> Based on everything we have discussed, I am very interested in this role. Is there anything that would hold you back from moving me forward?<\/p>\n<\/div>\n<p>A softer variant:<\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Before we wrap up, is there anything about my profile that gives you pause?\">🔊<\/button> Before we wrap up, is there anything about my profile that gives you pause?<\/p>\n<\/div>\n<p>After the answer: thank them, repeat one strength, ask about the next step (<em>What are the next steps, and when can I expect to hear from you?<\/em>).<\/p>\n<h2 id=\"questions-2\">What the recruiter asks<\/h2>\n<h3>Why you?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I know you are looking for someone who can give your stores a clear design direction and make it hold across formats. I have done exactly that. At Sephora, 540 stores in 11 countries ran on one visual identity, and since then I have delivered more than fifty concepts from strategy to rollout.\">🔊<\/button> I know you are looking for someone who can give your stores a clear design direction and make it hold across formats. I have done exactly that. At Sephora, 540 stores in 11 countries ran on one visual identity, and since then I have delivered more than fifty concepts from strategy to rollout.<\/p>\n<\/div>\n<h3>Why are you the right person for the job?<\/h3>\n<p>Same base, with the problem of the role up front. Finish on a measurable proof.<\/p>\n<h3>Where do you see yourself in five years?<\/h3>\n<p>Ready-made answer in \"My profile\".<\/p>\n<h3>How do you prioritise competing deadlines?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"My rule is impact before urgency. At Sephora I had seventy openings a year, so I separated what blocks others from what can wait, I shared the plan with every stakeholder, and I flagged early when a date was at risk. That way nothing fell through the cracks.\">🔊<\/button> My rule is impact before urgency. At Sephora I had seventy openings a year, so I separated what blocks others from what can wait, I shared the plan with every stakeholder, and I flagged early when a date was at risk. That way nothing fell through the cracks.<\/p>\n<\/div>\n<h3>How do you handle a mistake?<\/h3>\n<p>Story 10. Structure: the fact, the immediate disclosure, the fix, the new habit.<\/p>\n<h3>Influencing without authority<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"At Sephora, most of the people I had to move did not report to me: store teams, brand partners, country managers. I made the standard useful to them: simple tools, clear rules, and a plan for each country. They followed because it made their work easier.\">🔊<\/button> At Sephora, most of the people I had to move did not report to me: store teams, brand partners, country managers. I made the standard useful to them: simple tools, clear rules, and a plan for each country. They followed because it made their work easier.<\/p>\n<\/div>\n<h3>Feedback you disagreed with, or a disagreement with a leader<\/h3>\n<p>Stories 8 and 9 (to complete). Common thread: listen, test against data, decide, explain.<\/p>\n<h3>Strengths and weaknesses<\/h3>\n<p>To prepare with your real choice. Structure: one strength proved by a fact, one genuine weakness with what you do about it.<\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"My main strength is turning a brand idea into standards that a network can apply. [Proof: Sephora, L&#x27;Étoile.] An area I keep working on is [your real point], and what I do about it is [your action].\">🔊<\/button> My main strength is turning a brand idea into standards that a network can apply. [Proof: Sephora, L'Étoile.] An area I keep working on is [your real point], and what I do about it is [your action].<\/p>\n<\/div>\n<h2 id=\"questions-3\">Craft questions: concept, design, VM<\/h2>\n<h3>How do you design or redesign a store concept from scratch to rollout?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I work in four steps. First, customer journey and data: how people move and where they stop. Second, the concept and the space: zoning, fixtures, brand expression. Third, a pilot: a test store to validate the layout and the costs. Fourth, the rollout: technical guidelines, fixture books and a deployment schedule that works for hundreds of stores. Each step has a clear owner and a go or no-go.\">🔊<\/button> I work in four steps. First, customer journey and data: how people move and where they stop. Second, the concept and the space: zoning, fixtures, brand expression. Third, a pilot: a test store to validate the layout and the costs. Fourth, the rollout: technical guidelines, fixture books and a deployment schedule that works for hundreds of stores. Each step has a clear owner and a go or no-go.<\/p>\n<\/div>\n<h3>How do you balance creative design with business results?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Design in retail has to earn its keep. I tie every concept to a few metrics: sales per square metre, conversion, basket size, and the cost of the fit-out. I also design for the people who restock and serve, because a store that is hard to run will not hold its standard.\">🔊<\/button> Design in retail has to earn its keep. I tie every concept to a few metrics: sales per square metre, conversion, basket size, and the cost of the fit-out. I also design for the people who restock and serve, because a store that is hard to run will not hold its standard.<\/p>\n<\/div>\n<h3>How do you keep a consistent identity across many formats and countries?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I define what never changes, what can flex, and what each country can choose. A clear framework lets local teams adapt without losing the brand. At Sephora that meant one visual identity across eleven countries. In Moscow, it meant a concept that thirteen hundred stores could apply.\">🔊<\/button> I define what never changes, what can flex, and what each country can choose. A clear framework lets local teams adapt without losing the brand. At Sephora that meant one visual identity across eleven countries. In Moscow, it meant a concept that thirteen hundred stores could apply.<\/p>\n<\/div>\n<h3>Tell me about working with architects, contractors and landlords.<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Early alignment is everything. I bring architects, contractors and operations together at concept stage, I lock the standards before the tender, and I plan landlord approvals into the schedule instead of treating them as an afterthought. In the Gulf that means anticipating mall approval timelines and local compliance from day one.\">🔊<\/button> Early alignment is everything. I bring architects, contractors and operations together at concept stage, I lock the standards before the tender, and I plan landlord approvals into the schedule instead of treating them as an afterthought. In the Gulf that means anticipating mall approval timelines and local compliance from day one.<\/p>\n<\/div>\n<h3>Which tools do you use?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"AutoCAD, SketchUp and InDesign, and AI-assisted 3D rendering. I use them to communicate and to check; my team and our partners produce the detailed drawings. (Aligned with your CV: &quot;AutoCAD (intensive use), SketchUp, InDesign, AI-assisted 3D rendering&quot;.)\">🔊<\/button> AutoCAD, SketchUp and InDesign, and AI-assisted 3D rendering. I use them to communicate and to check; my team and our partners produce the detailed drawings. (Aligned with your CV: \"AutoCAD (intensive use), SketchUp, InDesign, AI-assisted 3D rendering\".)<\/p>\n<\/div>\n<h3>How do you integrate sustainability into store design?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"It is part of the brief from day one: modular fixtures, reusable materials, local sourcing where possible, and a plan for the end of life of every fixture. At NUT I worked on exactly this: reuse and reverse flows for retail, with partners like Veolia and Citeo.\">🔊<\/button> It is part of the brief from day one: modular fixtures, reusable materials, local sourcing where possible, and a plan for the end of life of every fixture. At NUT I worked on exactly this: reuse and reverse flows for retail, with partners like Veolia and Citeo.<\/p>\n<\/div>\n<h3>How do you lead a team and external agencies?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I set a clear framework and let people execute with care. I ran a team of fifteen and a two-million-euro P&amp;L at UX Retail Design. I stay close to the decisions that shape the brand and delegate the rest.\">🔊<\/button> I set a clear framework and let people execute with care. I ran a team of fifteen and a two-million-euro P&amp;L at UX Retail Design. I stay close to the decisions that shape the brand and delegate the rest.<\/p>\n<\/div>\n<h2 id=\"questions-4\">Tricky questions<\/h2>\n<h3>Why leave an agency you founded?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I enjoy the agency years, and I want to apply what I know inside one network, with long-term ownership. I would like to see the standards I design live and evolve in the stores over time.\">🔊<\/button> I enjoy the agency years, and I want to apply what I know inside one network, with long-term ownership. I would like to see the standards I design live and evolve in the stores over time.<\/p>\n<\/div>\n<h3>You have been independent for a long time. How will you fit into a corporate structure?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I have worked inside large groups: LVMH, Sephora, Toys &quot;R&quot; Us, Decathlon. I know the governance, the budgets and the matrix. My agency years taught me to deliver without waiting for permission, and to align quickly with people who see things differently.\">🔊<\/button> I have worked inside large groups: LVMH, Sephora, Toys \"R\" Us, Decathlon. I know the governance, the budgets and the matrix. My agency years taught me to deliver without waiting for permission, and to align quickly with people who see things differently.<\/p>\n<\/div>\n<h3>Are you willing to relocate to Dubai?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Yes. I am mobile and available to join you in Dubai.\">🔊<\/button> Yes. I am mobile and available to join you in Dubai.<\/p>\n<\/div>\n<h3>Salary expectations<\/h3>\n<p>Prudent answer in \"My profile\". Check the unit (AED per month or per year) before quoting a figure.<\/p>\n<h2 id=\"questions-5\">Gulf context questions<\/h2>\n<h3>How do you adapt a global concept to the Gulf market?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I separate three layers: the brand identity, which stays; the format, which adapts to the mall and the customer; and the services, which reflect local habits: private areas, family flows, hospitality. The UAE draws many tourists and expatriates; Saudi Arabia is driven by a young local customer with high expectations. The concept has to speak to each.\">🔊<\/button> I separate three layers: the brand identity, which stays; the format, which adapts to the mall and the customer; and the services, which reflect local habits: private areas, family flows, hospitality. The UAE draws many tourists and expatriates; Saudi Arabia is driven by a young local customer with high expectations. The concept has to speak to each.<\/p>\n<\/div>\n<h3>How do you work with nationalisation programmes (Emiratisation, Saudisation)?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I treat it as a strength. Local talent brings cultural insight, so I build training and clear career paths from the shop floor to store management. That improves retention and service quality.\">🔊<\/button> I treat it as a strength. Local talent brings cultural insight, so I build training and clear career paths from the shop floor to store management. That improves retention and service quality.<\/p>\n<\/div>\n<p>(Background: quotas and rules by country are in the \"Gulf\" dossier.)<\/p>"}, {"id": "oral", "titre": "Speaking", "html": "<h1>Speaking<\/h1>\n<p>Level C speaking is less about vocabulary than about control: where you place the stress, when you pause, how you land a point, how you handle pushback. This page collects the devices. For adjectives, pivot words, idioms and hedging, use the Level C tab.<\/p>\n<h2 id=\"oral-0\">Answer first, then evidence<\/h2>\n<p>Executives say the conclusion in the first sentence and prove it afterwards. Build every answer in three moves:<\/p>\n<ol>\n<li><strong>The claim<\/strong>, in one short sentence: <em>The short answer is yes, and here is why.<\/em>\n<\/li>\n<li><strong>The proof<\/strong>, with one fact from the CV: <em>At Sephora, …<\/em>\n<\/li>\n<li><strong>The link back to them<\/strong>: <em>Which is exactly what this role needs.<\/em>\n<\/li>\n<\/ol>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"The short answer is yes. At Sephora I kept one visual identity across 540 stores in eleven countries, and I did it with tools the local teams could use without me. That is exactly the discipline a multi-brand network needs.\">🔊<\/button> The short answer is yes. At Sephora I kept one visual identity across 540 stores in eleven countries, and I did it with tools the local teams could use without me. That is exactly the discipline a multi-brand network needs.<\/p>\n<\/div>\n<h2 id=\"oral-1\">Landing a point: rhythm and stress<\/h2>\n<ul>\n<li>One idea per sentence. Finish the sentence, then breathe. A two-second pause reads as confidence, not hesitation.\n<\/li>\n<li>Stress the words that carry meaning: the verb of action, the figure, the result. Let the small words fall away: <em>I DELIVered more than FIFty conCEPTS.<\/em>\n<\/li>\n<li>Drop your voice at the end of a statement. A rising end turns a claim into a question.\n<\/li>\n<li>To contrast, lift the stress on the pivot word: <em>Not the NUMber of stores, the CONSISTency across them.<\/em>\n<\/li>\n<li>For a list of three, rise on the first two items and fall on the last: <em>the concept ↗, the standards ↗, and the rollout ↘.<\/em>\n<\/li>\n<li>Slow down on the key figure and on the last sentence of an answer.\n<\/li>\n<\/ul>\n<h2 id=\"oral-2\">Stress shifts that mark a fluent speaker<\/h2>\n<p>Many business words change stress between noun and verb. Say the noun with the stress first, the verb with the stress second.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Noun (stress first)<\/th><th>Verb (stress second)<\/th><\/tr><\/thead><tbody>\n<tr><td>a PROject<\/td><td>to proJECT<\/td><\/tr>\n<tr><td>a REcord<\/td><td>to reCORD<\/td><\/tr>\n<tr><td>an INcrease<\/td><td>to inCREASE<\/td><\/tr>\n<tr><td>a PERmit<\/td><td>to perMIT<\/td><\/tr>\n<tr><td>a CONtract<\/td><td>to conTRACT (shrink)<\/td><\/tr>\n<tr><td>an OBject<\/td><td>to obJECT<\/td><\/tr>\n<tr><td>a PROduce (fresh goods)<\/td><td>to proDUCE<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Word families shift the stress as well: <em>PHOtograph, phoTOGraphy, photoGRAPHic<\/em> · <em>ECOnomy, ecoNOMic<\/em> · <em>reSPONsible, responsiBIlity<\/em> · <em>CREate, creAtive, creaTIVity<\/em> · <em>PREsent, presenTAtion<\/em>. When you hesitate, remember that endings in <em>-ic, -ion, -ity<\/em> pull the stress to the syllable just before them.<\/p>\n<h2 id=\"oral-3\">Connected speech: what you will hear in meetings<\/h2>\n<p>Native speakers reduce and link. You do not need to copy it, but you must recognise it.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Written<\/th><th>Heard as<\/th><\/tr><\/thead><tbody>\n<tr><td>going to<\/td><td>gonna<\/td><\/tr>\n<tr><td>want to, have to<\/td><td>wanna, hafta<\/td><\/tr>\n<tr><td>kind of, sort of<\/td><td>kinda, sorta<\/td><\/tr>\n<tr><td>what do you think<\/td><td>whaddaya think<\/td><\/tr>\n<tr><td>did you<\/td><td>didja<\/td><\/tr>\n<tr><td>could have<\/td><td>coulda<\/td><\/tr>\n<tr><td>give me<\/td><td>gimme<\/td><\/tr>\n<tr><td>an apple<\/td><td>anapple (linked)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>When the speed is too high, ask without apology: <em>Could you take me through that once more, a little more slowly?<\/em> In the Gulf you will meet British, American, Indian, Levantine and Gulf Arabic accents in the same meeting. Check the key point by playing it back: <em>So what I am hearing is that the priority is the premium format. Is that right?<\/em><\/p>\n<h2 id=\"oral-4\">Handling pushback<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Situation<\/th><th>What to say<\/th><\/tr><\/thead><tbody>\n<tr><td>You need a moment<\/td><td><em>That is a fair challenge. Let me think it through.<\/em><\/td><\/tr>\n<tr><td>You disagree, politely<\/td><td><em>I see it a little differently. My concern is …<\/em><\/td><\/tr>\n<tr><td>You partly agree<\/td><td><em>You are right on X. Where I would push back is Y.<\/em><\/td><\/tr>\n<tr><td>You want to reframe<\/td><td><em>Let me reframe the question: the real issue is …<\/em><\/td><\/tr>\n<tr><td>The question is too broad<\/td><td><em>Let me take that in two parts: first the concept, then the rollout.<\/em><\/td><\/tr>\n<tr><td>You do not know<\/td><td><em>I do not have the figure to hand, and I would rather not guess. I will come back to you with it by tomorrow.<\/em><\/td><\/tr>\n<tr><td>You get interrupted<\/td><td><em>If I may finish this point, and then I am happy to hear yours.<\/em><\/td><\/tr>\n<tr><td>You are asked for something you did not do<\/td><td><em>That was not my scope. What I owned was …<\/em><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"oral-5\">Telling a project aloud: the five-sentence model<\/h2>\n<ol>\n<li><em>The brief was …<\/em>\n<\/li>\n<li><em>The challenge was …<\/em>\n<\/li>\n<li><em>My approach was …<\/em>\n<\/li>\n<li><em>What we delivered was …<\/em>\n<\/li>\n<li><em>The result was …<\/em>\n<\/li>\n<\/ol>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"The brief was to redesign the Beauty floor of La Samaritaine. The challenge was to give more than seventy brands a clear place without losing the identity of the building. My approach was to organise the floor by customer journey first, then by brand. What we delivered was the concept and the brand zoning, and the floor opened with every brand in place.\">🔊<\/button> The brief was to redesign the Beauty floor of La Samaritaine. The challenge was to give more than seventy brands a clear place without losing the identity of the building. My approach was to organise the floor by customer journey first, then by brand. What we delivered was the concept and the brand zoning, and the floor opened with every brand in place.<\/p>\n<\/div>\n<p>(Replace the last sentence with your real result.)<\/p>\n<h2 id=\"oral-6\">Describing a space without a drawing<\/h2>\n<ul>\n<li><em>As you enter, on the left-hand side, …<\/em> · <em>on your right, …<\/em>\n<\/li>\n<li><em>At the back of the store<\/em> · <em>up front<\/em> · <em>in the heart of the floor<\/em>\n<\/li>\n<li><em>Facing the entrance<\/em> · <em>opposite the cash desk<\/em> · <em>next to the fitting rooms<\/em> · <em>adjacent to the fragrance wall<\/em>\n<\/li>\n<li><em>At eye level<\/em> · <em>above<\/em> · <em>below<\/em> · <em>behind<\/em>\n<\/li>\n<li><em>The customer flows from the entrance, along the main aisle, to …<\/em>\n<\/li>\n<li><em>The first thing you see is …<\/em> · <em>Your eye is drawn to …<\/em>\n<\/li>\n<li><em>Let me walk you through the layout.<\/em>\n<\/li>\n<li><em>The idea here is to slow the customer down.<\/em>\n<\/li>\n<\/ul>\n<h2 id=\"oral-7\">Calls and video<\/h2>\n<ul>\n<li><em>Can you hear me well?<\/em> · <em>You are on mute.<\/em> · <em>I will share my screen.<\/em>\n<\/li>\n<li><em>Sorry, the connection dropped. Could you repeat the last part?<\/em>\n<\/li>\n<li><em>Let me summarise what we agreed.<\/em> · <em>I will park that for now and come back to it.<\/em>\n<\/li>\n<li><em>I will send you a short recap by email today.<\/em>\n<\/li>\n<li>On video, look at the camera for the key figures and at the screen for the exchange.\n<\/li>\n<\/ul>\n<h2 id=\"oral-8\">When you do not understand<\/h2>\n<ul>\n<li><em>Sorry, could you say that again, a little more slowly?<\/em>\n<\/li>\n<li><em>I did not catch the last word. Could you spell it?<\/em>\n<\/li>\n<li><em>Do you mean …?<\/em> (restate what you understood)\n<\/li>\n<li><em>Just to be sure, you would like me to …?<\/em>\n<\/li>\n<\/ul>"}, {"id": "cibles", "titre": "Targets", "html": "<h1>Target files: MAF, Amouage, Chalhoub<\/h1>\n<p>Each file draws on facts verified in your dossiers (links in the dossiers). Reliability tags are Jean-Paul's: [P] official page read, [S] press read, [R] search-result extract to reconfirm. Names of people are checked on LinkedIn before any mention.<\/p>\n<h2 id=\"cibles-0\">Gulf context to know (October 2026)<\/h2>\n<ul>\n<li>On 28/02/2026 strikes hit several Gulf states. Stores closed in the UAE, Kuwait, Bahrain and Qatar. Chalhoub closed Bahrain and moved the other markets to voluntary attendance [S, 05/03/2026].\n<\/li>\n<li>Recovery is under way: Dubai welcomed 869,000 international visitors in August 2026, its best month since February [R, 09/2026].\n<\/li>\n<li>MAF, H1 2026: retail revenue down 6%, malls up 12%, operating net profit up 25%; the CEO describes a sharp demand shock in Q2 followed by a quick rebound [R, 09/2026].\n<\/li>\n<li>A line to keep in your pocket:\n<\/li>\n<\/ul>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"The region is recovering fast, and brands are reopening and refining their formats. That is exactly when a clear store concept pays back.\">🔊<\/button> The region is recovering fast, and brands are reopening and refining their formats. That is exactly when a clear store concept pays back.<\/p>\n<\/div>\n<h2 id=\"cibles-1\">Majid Al Futtaim, Director – Retail Design (Dubai)<\/h2>\n<h3>The role at a glance<\/h3>\n<ul>\n<li>Reference 22058, MAF Retail, Corporate Head Office, Dubai. Department \"C&amp;M – Marketing &amp; Communications\". Posted 18/08/2026, updated 21/09/2026 [P]. You applied on 05/10/2026.\n<\/li>\n<li>MAF Retail covers Carrefour (franchise in 12 markets, 390+ stores), HyperMax (44 points of sale), Supeco, Myli (health and beauty) and SAVA (discount, launched 22/10/2025) [P].\n<\/li>\n<li>The ad asks for: store design strategy \"by brand\", new concepts, standardised customer journeys, design standards and style guides, store plans, furniture, signage, liaison between internal teams and external partners, talent development [LinkedIn ad, 05/10/2026].\n<\/li>\n<li>Requirements: 12+ years in retail design, 3+ years managing design teams, CAD, SketchUp, 3D rendering, Adobe, fluent English, Arabic preferred.\n<\/li>\n<li>Design news: first premium Carrefour Market in the UAE opened 02/07/2026 at Jumeirah Park Centre (2,200 sqm, fresh share raised from 25% to 38% of the sales floor) [S]; Carrefour replaced by HyperMax in Jordan, Oman and Bahrain [S].\n<\/li>\n<\/ul>\n<h3>Your angle in three sentences<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I know retail networks from both sides: as a retailer, at Sephora, and as an agency leader. I bring a clear design direction by brand and standards that teams can apply across formats and countries. MAF Retail is reinventing its formats, from the premium Carrefour Market to HyperMax and SAVA, and that is the work I do best.\">🔊<\/button> I know retail networks from both sides: as a retailer, at Sephora, and as an agency leader. I bring a clear design direction by brand and standards that teams can apply across formats and countries. MAF Retail is reinventing its formats, from the premium Carrefour Market to HyperMax and SAVA, and that is the work I do best.<\/p>\n<\/div>\n<h3>Likely questions<\/h3>\n<ol>\n<li><em>How would you build a design direction for several brands at different price levels?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I start with what must stay common: the customer journey logic, the standards, the toolkit. Then I give each brand its own style: premium Carrefour Market, HyperMax, SAVA, Myli. One framework, several expressions.\">🔊<\/button> I start with what must stay common: the customer journey logic, the standards, the toolkit. Then I give each brand its own style: premium Carrefour Market, HyperMax, SAVA, Myli. One framework, several expressions.<\/p>\n<\/div>\n<\/li>\n<li><em>How do you manage brand takeovers, for example converting stores from one brand to another?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I plan the conversion as a product: a standard kit for signage, fixtures and graphics, a pilot, and a rollout schedule by wave. The key is to keep stores trading while they change.\">🔊<\/button> I plan the conversion as a product: a standard kit for signage, fixtures and graphics, a pilot, and a rollout schedule by wave. The key is to keep stores trading while they change.<\/p>\n<\/div>\n<\/li>\n<li><em>How do you work with operations and commercial teams?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I bring them in at concept stage. A concept only works if operations can run it and if it supports sales per square metre. I test with a pilot store and adjust before the rollout.\">🔊<\/button> I bring them in at concept stage. A concept only works if operations can run it and if it supports sales per square metre. I test with a pilot store and adjust before the rollout.<\/p>\n<\/div>\n<\/li>\n<li><em>How do you work with external design partners and contractors?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I define the standards and the brief, and I govern the quality. The partners draw and build to the standard, and I sign off at clear milestones. (You direct the creation; you do not draw the plans.)\">🔊<\/button> I define the standards and the brief, and I govern the quality. The partners draw and build to the standard, and I sign off at clear milestones. (You direct the creation; you do not draw the plans.)<\/p>\n<\/div>\n<\/li>\n<li><em>What do you know about the Gulf customer?<\/em>\n<div class=\"sub\">See \"Gulf context\" above and the answers in the Questions tab.<\/div>\n<\/li>\n<\/ol>\n<h3>Questions to ask (MAF)<\/h3>\n<ul>\n<li><em>Which department does role 22058 report to, and who is the hiring manager?<\/em>\n<\/li>\n<li><em>Which brands are the priority this year: Carrefour Market premium, HyperMax, SAVA, Myli?<\/em>\n<\/li>\n<li><em>How is the Retail In-Store Design team organised today, and where do you want to strengthen it?<\/em>\n<\/li>\n<li><em>How do you see the split between design in Retail and the Retail Design &amp; Delivery team in Properties?<\/em>\n<\/li>\n<\/ul>\n<h3>Contacts spotted (verify before any message)<\/h3>\n<ul>\n<li>Dries D'Hooghe, Managing Director Retail UAE (exact title to confirm). Plan: a comment on one of his posts the week of 19/10.\n<\/li>\n<li>Sheila Chaiban has left her post: do not cite her.\n<\/li>\n<\/ul>\n<p>Dossiers: <code>CANDIDATURES\\MAF_Director_Retail_Design\\<\/code>; letter <code>COVER_LETTER_MAF_LP<\/code>; salary entered in the portal: 50,000 (unit to confirm).<\/p>\n<h2 id=\"cibles-2\">Amouage (Oman, luxury perfumery)<\/h2>\n<h3>At a glance<\/h3>\n<ul>\n<li>Omani luxury perfume house, headquartered in Muscat. 2025 sales: $430M (+66%). Q1 2026: $190M (+90%) [S]. L'Oréal took a long-term minority stake in February 2025 [R].\n<\/li>\n<li>Network: 12 own boutiques according to BeautyMatter (2026), 17 according to WWD (2024-25): the figure is not reconciled, do not state it without checking [R].\n<\/li>\n<li>Muscat flagship (Sabco) reopened in 2025; boutiques in Sohar and at the Mandarin Oriental; Mall of Oman flagship designed with Héroïne (Paris) in 2022 [R]. Partner of the Faces flagship in Jeddah (May 2026) [P].\n<\/li>\n<li>Leaders cited: Marco Parsiegla, CEO; Sayyid Khalid bin Hamad Al Busaidi, chairman [S].\n<\/li>\n<li>Local rule: in Oman, \"marketing\", \"sales\" and \"commercial broker\" roles are closed to expatriates (decree 501/2024). Titles such as \"Retail Concept\", \"Visual Merchandising\", \"Store Experience\" remain to be confirmed with the employer.\n<\/li>\n<\/ul>\n<h3>Your angle<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Amouage is growing fast, and a growing network needs one consistent store experience. I have taken charge of concept and visual merchandising for large beauty networks, from the store layout to the teams who run it. I can do the same in an assignment of twelve to eighteen months, or in a permanent role.\">🔊<\/button> Amouage is growing fast, and a growing network needs one consistent store experience. I have taken charge of concept and visual merchandising for large beauty networks, from the store layout to the teams who run it. I can do the same in an assignment of twelve to eighteen months, or in a permanent role.<\/p>\n<\/div>\n<h3>Likely questions<\/h3>\n<ol>\n<li><em>How do you keep a luxury boutique network consistent while the brand grows quickly?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I set a store bible: what never changes, what can adapt to a mall or a city, and a clear approval process. Each new boutique starts from the same standard, and the teams are trained on it.\">🔊<\/button> I set a store bible: what never changes, what can adapt to a mall or a city, and a clear approval process. Each new boutique starts from the same standard, and the teams are trained on it.<\/p>\n<\/div>\n<\/li>\n<li><em>Why would a luxury house need a retail concept director?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Somewhere between ten and thirty boutiques, the design starts to drift: each opening becomes a new project. A concept director turns it into a system, so the brand stays recognisable and the openings go faster.\">🔊<\/button> Somewhere between ten and thirty boutiques, the design starts to drift: each opening becomes a new project. A concept director turns it into a system, so the brand stays recognisable and the openings go faster.<\/p>\n<\/div>\n<\/li>\n<li><em>Have you worked with fragrance and beauty?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Yes: Sephora, with 540 stores and ten exclusive brands; La Prairie, Nocibé and Beauty Success; and The Fragrance Shop in Manchester for Perscent Group.\">🔊<\/button> Yes: Sephora, with 540 stores and ten exclusive brands; La Prairie, Nocibé and Beauty Success; and The Fragrance Shop in Manchester for Perscent Group.<\/p>\n<\/div>\n<\/li>\n<\/ol>\n<h3>Questions to ask (Amouage)<\/h3>\n<ul>\n<li><em>How many boutiques do you plan to open in the next two years, and in which markets?<\/em>\n<\/li>\n<li><em>Who holds the store design standards today: the brand team, an agency, or operations?<\/em>\n<\/li>\n<li><em>What would make the next boutique design a success in your eyes?<\/em>\n<\/li>\n<\/ul>\n<p>Dossier: <code>PERSO\\OMAN\\Cibles_candidatures_directes_2026-10-04.md<\/code>.<\/p>\n<h2 id=\"cibles-3\">Chalhoub Group (Dubai)<\/h2>\n<h3>At a glance<\/h3>\n<ul>\n<li>Luxury, beauty and fashion group of the Middle East. About 900 stores for brands from Versace and Jimmy Choo to Sephora [S, 03/2026]; more than 1,000 stores in 14 countries according to another extract [R]: the gap is not reconciled, do not quote it as a firm figure. 16,000 employees according to the group's site [P].\n<\/li>\n<li>Operator of <strong>Sephora Middle East<\/strong> (joint venture with Sephora) and owner of <strong>Faces<\/strong> (85+ stores in 10 countries) [P].\n<\/li>\n<li>Faces flagship at Jeddah Vibes: 1,100 sqm, inaugurated 07/05/2026, with five service pillars (fragrance layering bar, skin analysis, make-up, men's grooming, gifting), a rotating-brand \"Beauty Studio\" and an AI beauty assistant (Layla AI) [P].\n<\/li>\n<li>Greenhouse (brand incubation): Beauty Lab, Fashion Lab, retail-tech accelerator [P].\n<\/li>\n<li>In-house retail design and visual merchandising department [R].\n<\/li>\n<li>Leaders cited: Michael Chalhoub, CEO; Jasmina Banda, President of Joint Ventures (oversees the JVs including Sephora); Nicole Nitschke, Managing Director of Faces [P/R].\n<\/li>\n<\/ul>\n<h3>Your angle<\/h3>\n<p>A direct entry point: your Sephora past is a concrete asset at the operator of Sephora Middle East. Present yourself through the multi-country banner concept, never as a regional VM role alone.<\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I know Sephora from the inside: I was VP Visual Merchandising EMEA, with 540 stores in eleven countries. Chalhoub operates Sephora in the Middle East and Faces across the Gulf. I would like to help build a store concept that stays consistent across fourteen countries and that every opening can reproduce.\">🔊<\/button> I know Sephora from the inside: I was VP Visual Merchandising EMEA, with 540 stores in eleven countries. Chalhoub operates Sephora in the Middle East and Faces across the Gulf. I would like to help build a store concept that stays consistent across fourteen countries and that every opening can reproduce.<\/p>\n<\/div>\n<h3>Likely questions<\/h3>\n<ol>\n<li><em>What would you change in a Faces or Sephora store today?<\/em>\n<div class=\"sub\">Answer with a precise observation made after visiting a store, never a general criticism. Structure: <em>I noticed [fact]. I would test [idea] in one store before extending it.<\/em><\/div>\n<\/li>\n<li><em>How do you make a concept reproducible across many countries and malls?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Standards in layers: what never changes, what adapts to the mall, what local teams choose. A toolkit with fixtures, layouts, graphics, and a rollout schedule by wave.\">🔊<\/button> Standards in layers: what never changes, what adapts to the mall, what local teams choose. A toolkit with fixtures, layouts, graphics, and a rollout schedule by wave.<\/p>\n<\/div>\n<\/li>\n<li><em>How would you work with a brand incubation programme like the Greenhouse?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I would offer ready-to-use presentation formats for emerging brands: a fixture kit and a layout that a new brand can use in a store without a full project.\">🔊<\/button> I would offer ready-to-use presentation formats for emerging brands: a fixture kit and a layout that a new brand can use in a store without a full project.<\/p>\n<\/div>\n<\/li>\n<li><em>How do you integrate technology without losing the human touch?<\/em>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Technology serves the advisor. A skin analysis or a try-on starts the conversation, and the advisor finishes it. I design the space so the tool is part of the architecture, and never gets in the way.\">🔊<\/button> Technology serves the advisor. A skin analysis or a try-on starts the conversation, and the advisor finishes it. I design the space so the tool is part of the architecture, and never gets in the way.<\/p>\n<\/div>\n<\/li>\n<\/ol>\n<h3>Questions to ask (Chalhoub)<\/h3>\n<ul>\n<li><em>How is the retail design team organised across Sephora, Faces and the other banners?<\/em>\n<\/li>\n<li><em>Which markets are the priority for new concepts: Saudi Arabia, the UAE, others?<\/em>\n<\/li>\n<li><em>How do Sephora, as a joint venture, and Faces share design standards?<\/em>\n<\/li>\n<li><em>Where do the Greenhouse brands appear in the store experience?<\/em>\n<\/li>\n<\/ul>\n<p>Dossier: <code>PERSO\\GOLFE\\Cibles_groupes_retail_golfe_2026-10-05.md<\/code> (sections 2.1 and 4.1).<\/p>\n<h2 id=\"cibles-4\">Useful etiquette for the Gulf (general good sense)<\/h2>\n<ul>\n<li>Greetings: <em>As-salamu alaykum<\/em> is appreciated; a gentle handshake is enough, and wait for a woman to extend her hand first.\n<\/li>\n<li>Take time for conversation before business: family, travel, the city. Show no rush.\n<\/li>\n<li>Business cards: give and receive with the right hand.\n<\/li>\n<li><em>Insha'Allah<\/em> (\"God willing\") is common; it signals an intention, not a firm commitment: restate the date you expect.\n<\/li>\n<li><em>Ramadan Kareem<\/em> during Ramadan; working hours change.\n<\/li>\n<li>Weekend: Friday–Saturday in Saudi Arabia; in the UAE, companies generally follow Saturday–Sunday since 2022. Confirm with each employer.\n<\/li>\n<\/ul>"}, {"id": "conex", "titre": "CONEX · DIAM", "html": "<h1>CONEX · DIAM: Expertise Center Manager<\/h1>\n<p>Built on 27/10/2026 from the Cadres &amp; Tech ad, your prep sheets of 21/10, your CV, and public sources read the same day. Reliability tags: <strong>[A]<\/strong> the ad, <strong>[P]<\/strong> official page read, <strong>[S]<\/strong> press or deal release read, <strong>[R]<\/strong> search extract to reconfirm, <strong>[CV]<\/strong> your CV. Answers are spoken English of three to five sentences: say them in your own words, not by heart.<\/p>\n<p>The ad does not name the group. DIAM and CONEX are your working identification (3,300 people, a digital subsidiary started in New York, luxury beauty displays). Do not state it as certain with the recruiter until he confirms it.<\/p>\n<h2 id=\"conex-0\">The role at a glance<\/h2>\n<ul>\n<li><strong>Title:<\/strong> Expertise Center Manager, a managing-director role for the digital subsidiary of an industrial group in visual merchandising (displays, POS material) for luxury perfume and cosmetics brands [A].\n<\/li>\n<li><strong>Scope:<\/strong> strategy, services, financial performance and in-store digital experiences; a team of about ten across France and the US; all operations with the Group's business units worldwide [A].\n<\/li>\n<li><strong>Reporting:<\/strong> to the Group's Europe Director. Based in the Yvelines. One week in six in New York [A].\n<\/li>\n<li><strong>Start:<\/strong> early December 2026 [A].\n<\/li>\n<li><strong>Package:<\/strong> €75–90k fixed plus €10–15k variable and a company car in the ad; you have already discussed around €100k plus a car with the recruiter. Do not reopen it, restate it if asked.\n<\/li>\n<li><strong>Profile asked:<\/strong> 10 years of international commercial work, 5 years running a profit centre, multicultural teams, tech and networks, an eye for aesthetics, very good English.\n<\/li>\n<\/ul>\n<h2 id=\"conex-1\">What the ad asks, and your proof<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Ad block<\/th><th>What they want<\/th><th>Your proof<\/th><\/tr><\/thead><tbody>\n<tr><td>1. Team management<\/td><td>Teams on several sites (US, France, South America, China), cultural fit, hiring, objectives, reviews<\/td><td>Moscow: thre
