e years leading local teams for 1,300+ stores. Sephora: 11 countries. Dia-Mart: a team of 15 [CV]<\/td><\/tr>\n<tr><td>2. Financial management<\/td><td>P&amp;L, budgets, forecasts, order book, accounting, external auditors, purchasing<\/td><td>Dia-Mart: €2M P&amp;L. Sephora: €11M operating budget. NUT: €1.1M raised, €600k in grants [CV]. Gap: no work with external auditors, so you lean on Group finance<\/td><\/tr>\n<tr><td>3. Commercial<\/td><td>Negotiate prices and terms, new contracts, international tenders, relations with Retail Design and Purchasing Directors<\/td><td>Sephora, buyer side, with ten exclusive brands, and you worked with DIAM there. Consulting briefs: Feu Vert, Giphar, E.Leclerc, La Prairie [CV]. <strong>[to complete: one international tender]<\/strong><\/td><\/tr>\n<tr><td>4. Managerial<\/td><td>Daily performance, risk and continuity, compliance, service quality, innovation with the IT team<\/td><td>Network rollouts (Feu Vert, L'Étoile). NUT: connected hardware, computer vision, cellular connectivity (from your prep sheet: confirm)<\/td><\/tr>\n<tr><td>Tech and design<\/td><td>Tech and networks, sense of aesthetics<\/td><td>NUT; Sephora fixtures and planograms; La Samaritaine Beauty floor, 70+ brands [CV]<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"conex-2\">Facts to know (checked 27/10/2026)<\/h2>\n<h3>DIAM Group<\/h3>\n<ul>\n<li>Founded in 1973. Visual merchandising and shopfitting for the beauty and luxury sectors. In 2024 Ardian quoted more than 3,200 employees, 30 sites and 20 countries; the ad says 3,300 people and 24 sites. Say \"more than three thousand people\" [S] [A].\n<\/li>\n<li>Sales above €400M in 2023, about 70% from merchandising [S].\n<\/li>\n<li>Clients named by Ardian: L'Oréal, LVMH, Estée Lauder, Richemont, Shiseido, Chanel, Hermès [S].\n<\/li>\n<li>The full chain: consulting, design, engineering, production, delivery, installation, after-sales service and recycling [S].\n<\/li>\n<li>Brands: Diam, Prugent, Field Flex, Fine Packaging Manufacturers, MR, Retail3D, Conex, B2D [S].\n<\/li>\n<li>Ardian announced on 2 July 2024 its entry into exclusive negotiations for a majority stake, with the management reinvesting; the group's 2024 ESG report confirms Ardian as majority shareholder. Stated plan: grow visual merchandising, shopfitting, niche packaging, connectivity and in-store services, organically and through possible acquisitions, and strengthen the CSR commitments [S].\n<\/li>\n<li>The CEO, Françoise Raoul-Duval, said the group needed a leading shareholder for a new phase of ambitious growth [S].\n<\/li>\n<li>Prugent (shopfitting and installation) offers its clients digital through Conex, \"our sister company\". Retail3D is the group's retail design agency [P] [R].\n<\/li>\n<li>Group sustainability line: life-cycle assessment and eco-design on projects, recycled and alternative materials, optimised lighting, recycling of custom-made furniture, a stated aim of building a circular economy [P].\n<\/li>\n<\/ul>\n<h3>CONEX (conexsolution.com)<\/h3>\n<ul>\n<li>The website is <code>conexsolution.com<\/code>. The legal name is Conex Digital LLC, with a New York headquarters and European sites at Les Mureaux and Levallois-Perret [R].\n<\/li>\n<li>Positioning: integrated digital solutions that help brands stand out; \"connecting brands to people\"; \"in-store digital solutions that perform\"; a promise of a worry-free, fully supported solution, globally [P].\n<\/li>\n<li>Scale claimed: 5,000+ connected devices, 3 regional hubs (Americas, Europe, APAC), 200+ trained field technicians, 24/7 service, 60 different brands, 500+ projects a year [P].\n<\/li>\n<li>The service chain, \"from A to Z\": remote monitoring and maintenance; remote updates and content control; on-site installation and maintenance; content creation and video editing [P].\n<\/li>\n<li>Connectivity: secure cellular connectivity, access to 240+ network providers, no need for store Wi-Fi or ethernet [P].\n<\/li>\n<li>Benefits listed: more store traffic, product visibility and understanding, cross-selling, brand equity, loyalty, smart data collection, conversion and basket size [P].\n<\/li>\n<li>Sustainability page: remote maintenance (fewer store visits), glue-free design so parts can be separated and recycled, local production in several regions, preventive maintenance to extend product life, WEEE certification in France, and \"Eco Smart Retail\" (energy monitoring of in-store furniture: lighting and screen brightness, with KPIs). Link to B2D recycling services [P].\n<\/li>\n<li>Work visible on the site, from image names only (to confirm before mentioning): a flip-dot installation for Rabanne at Heathrow T5, a Chloé back wall, a Puig location in Rome [P, inferred].\n<\/li>\n<li>A client testimonial on the site praises CONEX for saying yes when others hesitated because of a project's scale and complexity [P].\n<\/li>\n<\/ul>\n<h3>Numbers to reconcile before you quote them<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Point<\/th><th>What the sources say<\/th><th>What to say<\/th><\/tr><\/thead><tbody>\n<tr><td>Countries<\/td><td>60+ (home page, ad); 43 \"countries served\" (Our Work page)<\/td><td>\"Dozens of countries.\" Ask how they count<\/td><\/tr>\n<tr><td>Group size<\/td><td>3,200+ people, 30 sites, 20 countries (Ardian, 2024); 3,300 people and 24 industrial sites (ad)<\/td><td>\"More than three thousand people\"<\/td><\/tr>\n<tr><td>Team<\/td><td>About 10 people [A]; 11–50 on LinkedIn [R]<\/td><td>\"A small team\"<\/td><\/tr>\n<tr><td>AI and computer vision<\/td><td>Absent from the website text; LinkedIn lists computer vision systems and smart cosmetics displays; the group ESG report speaks of AI-powered displays collecting anonymous demographic data [R] [S]<\/td><td>Ask how they position AI today<\/td><\/tr>\n<tr><td>Founding<\/td><td>2018 on directories; a New York filing dated October 2017 [R]<\/td><td>Do not give a year<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"conex-3\">Q&amp;A: your background and fit<\/h2>\n<h3>Walk me through your background (60 seconds)<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"For twenty-five years I have designed and run retail spaces, and my career has three chapters. At Sephora I was VP Visual Merchandising for EMEA: 540 stores, eleven countries, an eleven-million-euro budget. Then I co-founded Dia-Mart and ran its retail design subsidiary for ten years, with fifteen people and a two-million-euro P&amp;L. Since 2017 I have run Jaizkibel, my consultancy, and I co-founded NUT, a reuse start-up where we raised 1.1 million euros and built hardware, computer vision and connectivity. This role brings it all together: luxury, the store floor, and a small tech business with its own P&amp;L.\">🔊<\/button> For twenty-five years I have designed and run retail spaces, and my career has three chapters. At Sephora I was VP Visual Merchandising for EMEA: 540 stores, eleven countries, an eleven-million-euro budget. Then I co-founded Dia-Mart and ran its retail design subsidiary for ten years, with fifteen people and a two-million-euro P&amp;L. Since 2017 I have run Jaizkibel, my consultancy, and I co-founded NUT, a reuse start-up where we raised 1.1 million euros and built hardware, computer vision and connectivity. This role brings it all together: luxury, the store floor, and a small tech business with its own P&amp;L.<\/p>\n<\/div>\n<h3>Give me four reasons we should hire you<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Four reasons.\">🔊<\/button> Four reasons.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"One: the profile fits the job description. I am an entrepreneur. I know how to run and manage a business unit from strategy to sales. Your recruiter described me as a Swiss Army knife, and that is exactly what a subsidiary of this size needs.\">🔊<\/button> <strong>One: the profile fits the job description.<\/strong> I am an entrepreneur. I know how to run and manage a business unit from strategy to sales. Your recruiter described me as a Swiss Army knife, and that is exactly what a subsidiary of this size needs.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Two: I am an expert in visual merchandising. I know selective retail and the cosmetics sector from the inside, so I understand your clients&#x27; brands and their constraints.\">🔊<\/button> <strong>Two: I am an expert in visual merchandising.<\/strong> I know selective retail and the cosmetics sector from the inside, so I understand your clients' brands and their constraints.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Three: I am at ease with technology. I proved it at NUT, where I helped build a full reuse ecosystem: software, blockchain traceability and connected collection machines.\">🔊<\/button> <strong>Three: I am at ease with technology.<\/strong> I proved it at NUT, where I helped build a full reuse ecosystem: software, blockchain traceability and connected collection machines.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Four: I learn fast and I adapt. I work easily across functions, with design, tech, finance and sales, so I add value from the first weeks.\">🔊<\/button> <strong>Four: I learn fast and I adapt.<\/strong> I work easily across functions, with design, tech, finance and sales, so I add value from the first weeks.<\/p>\n<\/div>\n<p>Why this version: each reason answers one line of the ad (business unit, sector, tech, cross-functional work). The Swiss Army knife quote is yours: use it only if the interviewer knows the recruiter, otherwise say \"people who know my work call me a Swiss Army knife\". Keep it to 60 seconds. No NUT figures, by your decision (28/10/2026).<\/p>\n<h3>Why this role, and why now?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I have led teams and run a P&amp;L, and what draws me here is the change of scale: a major industrial group behind me, and a business already live in dozens of countries. I know the clients because I used to be one: the retail design and purchasing directors of the big beauty houses. This is a role where I can build something that lasts, with real resources.\">🔊<\/button> I have led teams and run a P&amp;L, and what draws me here is the change of scale: a major industrial group behind me, and a business already live in dozens of countries. I know the clients because I used to be one: the retail design and purchasing directors of the big beauty houses. This is a role where I can build something that lasts, with real resources.<\/p>\n<\/div>\n<h3>You have been independent since 2017. Why report to a Group Europe Director?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I have worked inside groups: LVMH, Sephora, Toys &quot;R&quot; Us, Decathlon. I know governance, budgets and matrix reporting. My independent years taught me to deliver without waiting for permission, and I want to put that energy behind a strong group. A clear reporting line and real resources are exactly what I am looking for now.\">🔊<\/button> I have worked inside groups: LVMH, Sephora, Toys \"R\" Us, Decathlon. I know governance, budgets and matrix reporting. My independent years taught me to deliver without waiting for permission, and I want to put that energy behind a strong group. A clear reporting line and real resources are exactly what I am looking for now.<\/p>\n<\/div>\n<h3>What do you know about DIAM and CONEX?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"DIAM is a visual merchandising and shopfitting group for beauty and luxury: more than three thousand people, sales above four hundred million euros, and Ardian as majority shareholder since 2024. CONEX is its in-store digital arm: more than five thousand connected devices, managed remotely over secure cellular connectivity, with field technicians worldwide. I worked with DIAM at Sephora, so I know the group from the client side. I would rather hear how you describe CONEX today: where is it strongest, and where do you want it to go?\">🔊<\/button> DIAM is a visual merchandising and shopfitting group for beauty and luxury: more than three thousand people, sales above four hundred million euros, and Ardian as majority shareholder since 2024. CONEX is its in-store digital arm: more than five thousand connected devices, managed remotely over secure cellular connectivity, with field technicians worldwide. I worked with DIAM at Sephora, so I know the group from the client side. I would rather hear how you describe CONEX today: where is it strongest, and where do you want it to go?<\/p>\n<\/div>\n<p>With the recruiter, stop there. Strategy comes in the interviews with the Group.<\/p>\n<h3>How do you see a digital subsidiary inside an industrial group?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Two things have to be true at the same time. The subsidiary needs the speed and autonomy of a start-up, and the group needs transparency on numbers and standards. I would agree early on what the subsidiary decides alone and what goes up to the group, and I would keep the reporting light but regular. The group also brings its best asset: the relationships with the beauty houses.\">🔊<\/button> Two things have to be true at the same time. The subsidiary needs the speed and autonomy of a start-up, and the group needs transparency on numbers and standards. I would agree early on what the subsidiary decides alone and what goes up to the group, and I would keep the reporting light but regular. The group also brings its best asset: the relationships with the beauty houses.<\/p>\n<\/div>\n<h2 id=\"conex-4\">Q&amp;A: tech, AI and design<\/h2>\n<h3>What is your connection to tech and AI?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"At NUT we built a reuse ecosystem: software that tracks containers between washers, restaurants and partners, blockchain traceability, and collection machines with computer vision that recognise each container and accept or reject it. All of it runs over cellular through GSM routers. I do not code, but I have built a product that combines hardware, vision, connectivity and software, and I know what it takes to deploy it.\">🔊<\/button> At NUT we built a reuse ecosystem: software that tracks containers between washers, restaurants and partners, blockchain traceability, and collection machines with computer vision that recognise each container and accept or reject it. All of it runs over cellular through GSM routers. I do not code, but I have built a product that combines hardware, vision, connectivity and software, and I know what it takes to deploy it.<\/p>\n<\/div>\n<p><strong>[NUT: no machine or volume figures, by your decision (28/10/2026). To complete if you wish: your role in the partner decisions with Veolia and Citeo.]<\/strong><\/p>\n<h3>You are not an engineer. How do you manage developers and AI specialists?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I manage from the use case: what the brand needs to see in the store, what is feasible, and what it costs. I do not pretend to code; I ask precise questions and I protect the team&#x27;s time. I am used to refereeing between creatives, engineers and clients. With scarce profiles, retention comes from a clear mission, autonomy, and a future inside the group.\">🔊<\/button> I manage from the use case: what the brand needs to see in the store, what is feasible, and what it costs. I do not pretend to code; I ask precise questions and I protect the team's time. I am used to refereeing between creatives, engineers and clients. With scarce profiles, retention comes from a clear mission, autonomy, and a future inside the group.<\/p>\n<\/div>\n<h3>How do you judge whether a digital device serves a brand?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"A screen should disappear into the merchandising, not sit on top of it. I look at where it sits on the counter, how it blends into the fixture, and whether it helps the advisor or competes with her. Then I ask what it changes: dwell time, product understanding, conversion. If it moves none of those, it is decoration.\">🔊<\/button> A screen should disappear into the merchandising, not sit on top of it. I look at where it sits on the counter, how it blends into the fixture, and whether it helps the advisor or competes with her. Then I ask what it changes: dwell time, product understanding, conversion. If it moves none of those, it is decoration.<\/p>\n<\/div>\n<h2 id=\"conex-5\">Q&amp;A: leading the team<\/h2>\n<h3>Describe your management style<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I set the goal and the checkpoints, then I give people room to decide how to get there. At Dia-Mart, with fifteen people, we won the Janus du Commerce and the LSA Trophy that way. In Moscow I led local teams for three years, so I am used to working across cultures, far from headquarters.\">🔊<\/button> I set the goal and the checkpoints, then I give people room to decide how to get there. At Dia-Mart, with fifteen people, we won the Janus du Commerce and the LSA Trophy that way. In Moscow I led local teams for three years, so I am used to working across cultures, far from headquarters.<\/p>\n<\/div>\n<h3>What is the difference between leadership and management?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Management makes the system work: goals, budgets, planning, checkpoints, reporting. Leadership makes people want to go further than the system asks: a direction, trust, a reason to care. A manager without leadership gets compliance. A leader without management gets energy and no delivery. In a subsidiary like CONEX you need both, and the balance moves. When we structure finance and processes, I lean on management. When a small team has to build a pipeline from scratch, I lean on leadership. For me it comes down to one habit: I set the goal and the checkpoints, then I give people room to decide how to get there. At Dia-Mart, with fifteen people, that is how we won the Janus du Commerce and the LSA Trophy.\">🔊<\/button> Management makes the system work: goals, budgets, planning, checkpoints, reporting. Leadership makes people want to go further than the system asks: a direction, trust, a reason to care. A manager without leadership gets compliance. A leader without management gets energy and no delivery. In a subsidiary like CONEX you need both, and the balance moves. When we structure finance and processes, I lean on management. When a small team has to build a pipeline from scratch, I lean on leadership. For me it comes down to one habit: I set the goal and the checkpoints, then I give people room to decide how to get there. At Dia-Mart, with fifteen people, that is how we won the Janus du Commerce and the LSA Trophy.<\/p>\n<\/div>\n<p>Your draft had the right idea. Two upgrades: the consequence of lacking one of the two, and a fact from your career. Keep it to 45 seconds.<\/p>\n<h3>How would you manage a team split between France, New York and other regions?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Fixed routines: one weekly call at a time that works for both sides, written goals, and a local lead on each site. One week in six in New York keeps the human connection strong. I would spend my first month listening to each site before changing anything.\">🔊<\/button> Fixed routines: one weekly call at a time that works for both sides, written goals, and a local lead on each site. One week in six in New York keeps the human connection strong. I would spend my first month listening to each site before changing anything.<\/p>\n<\/div>\n<h3>How do you hire, develop and retain talent?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Written goals, regular check-ins, and a development plan for each person. At Dia-Mart I built and led a team of fifteen. In a team of about ten with scarce profiles, retention comes from a clear mission, real autonomy, and a visible future inside the group.\">🔊<\/button> Written goals, regular check-ins, and a development plan for each person. At Dia-Mart I built and led a team of fifteen. In a team of about ten with scarce profiles, retention comes from a clear mission, real autonomy, and a visible future inside the group.<\/p>\n<\/div>\n<p><strong>[to complete: one standout hire or promotion at Dia-Mart.]<\/strong><\/p>\n<h3>Tell me about working across cultures<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In Moscow I led local teams for three years on a network of 1,300 stores. I learned to read the market before imposing a standard, to explain the reason behind each rule, and to give local managers real decisions. At Sephora I applied the same approach across eleven countries: one visual identity, adapted locally.\">🔊<\/button> In Moscow I led local teams for three years on a network of 1,300 stores. I learned to read the market before imposing a standard, to explain the reason behind each rule, and to give local managers real decisions. At Sephora I applied the same approach across eleven countries: one visual identity, adapted locally.<\/p>\n<\/div>\n<h3>Tell me about a difficult situation in your career and how you handled it<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Situation. Let me take an example from a creative project. We were at phase two: presenting the concept to the executive committee. The CEO had not followed the earlier rounds. Within minutes he blocked the project and said it was not at all what he expected.\">🔊<\/button> <strong>Situation.<\/strong> Let me take an example from a creative project. We were at phase two: presenting the concept to the executive committee. The CEO had not followed the earlier rounds. Within minutes he blocked the project and said it was not at all what he expected.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"First reaction: the room. I did not defend the concept. I changed the purpose of the meeting and turned it into a briefing reset. It was clear his vision was very different from the one our sponsor had given us. So I used the committee to align everyone, there and then, on one new brief.\">🔊<\/button> <strong>First reaction: the room.<\/strong> I did not defend the concept. I changed the purpose of the meeting and turned it into a briefing reset. It was clear his vision was very different from the one our sponsor had given us. So I used the committee to align everyone, there and then, on one new brief.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Second reaction: my team. Then I went back to my creative team. They had worked in good faith on a brief that was no longer the right one, and that was my responsibility. I apologised, I explained the new direction, and I asked them to rework the creative routes.\">🔊<\/button> <strong>Second reaction: my team.<\/strong> Then I went back to my creative team. They had worked in good faith on a brief that was no longer the right one, and that was my responsibility. I apologised, I explained the new direction, and I asked them to rework the creative routes.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Securing it. Finally, I wrote the new brief down and got it validated in writing. I shared it with the sponsor and with my creative director, so everyone was aligned on the new creative route before the team started working on it.\">🔊<\/button> <strong>Securing it.<\/strong> Finally, I wrote the new brief down and got it validated in writing. I shared it with the sponsor and with my creative director, so everyone was aligned on the new creative route before the team started working on it.<\/p>\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Result. The project was approved and delivered on time.\">🔊<\/button> <strong>Result.<\/strong> The project was approved and delivered on time.<\/p>\n<\/div>\n<p><strong>Optional closing line, only if it matches your practice:<\/strong> \"Since then, I always get the brief validated in writing by the decision-makers before the creative phase starts.\"<\/p>\n<p>Why it works: you stay calm under pressure, you turn a blockage into alignment, and you own a mistake with your team. Keep it to 90 seconds. Name no company and no person.<\/p>\n<h3>Tell me about a tough situation with a team member<\/h3>\n<p>Prepare one real story of 90 seconds: the situation, your decision, what happened, what you changed afterwards. Choose Dia-Mart or Moscow. Candour about a difficulty is stronger than a polished story. <strong>[to complete]<\/strong><\/p>\n<h2 id=\"conex-6\">Q&amp;A: finance and operations<\/h2>\n<h3>What is your P&amp;L experience?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"At Dia-Mart I owned a two-million-euro P&amp;L, a team of fifteen and the client relationships, over ten years. At Sephora I managed an eleven-million-euro operating budget and more than seventy openings a year. At NUT I led the fundraising: 1.1 million raised and 600,000 in public grants. The scale is different from a group of four hundred million, but the discipline is the same: margin, cash, forecasts.\">🔊<\/button> At Dia-Mart I owned a two-million-euro P&amp;L, a team of fifteen and the client relationships, over ten years. At Sephora I managed an eleven-million-euro operating budget and more than seventy openings a year. At NUT I led the fundraising: 1.1 million raised and 600,000 in public grants. The scale is different from a group of four hundred million, but the discipline is the same: margin, cash, forecasts.<\/p>\n<\/div>\n<h3>How would you handle accounting, audits and compliance?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In my first month I would sit with the Group finance team and learn how the subsidiary&#x27;s P&amp;L is built: hardware, services, recurring revenue. I would name the finance lead who works with me, and I would be the single point of contact for the auditors, with documents delivered on time. I am a commercial and operational leader, so I build strong finance support from day one.\">🔊<\/button> In my first month I would sit with the Group finance team and learn how the subsidiary's P&amp;L is built: hardware, services, recurring revenue. I would name the finance lead who works with me, and I would be the single point of contact for the auditors, with documents delivered on time. I am a commercial and operational leader, so I build strong finance support from day one.<\/p>\n<\/div>\n<h3>How do you follow an order book and forecasts?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Every week I look at three things: orders signed, delivery and installation dates, and cash collected. I compare them with the quarterly forecast, explain each variance, and act early. If a date or a margin is at risk, the Group hears it from me first.\">🔊<\/button> Every week I look at three things: orders signed, delivery and installation dates, and cash collected. I compare them with the quarterly forecast, explain each variance, and act early. If a date or a margin is at risk, the Group hears it from me first.<\/p>\n<\/div>\n<p><strong>[to complete: what you tracked at Dia-Mart: orders, margin, cash.]<\/strong><\/p>\n<h3>How do you improve margins in a business with hardware and services?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I separate the three economics: the device, the installation, and the recurring service. Hardware sets the entry price, but services such as remote monitoring, content updates and maintenance build the margin and the stability. I would check unit economics per device and per store, and start with whatever repeats most often.\">🔊<\/button> I separate the three economics: the device, the installation, and the recurring service. Hardware sets the entry price, but services such as remote monitoring, content updates and maintenance build the margin and the stability. I would check unit economics per device and per store, and start with whatever repeats most often.<\/p>\n<\/div>\n<h3>How do you manage operational risk and continuity?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I plan ahead: a continuity plan, a second source for critical components, and rollout milestones reviewed every week. In Moscow and at Feu Vert I ran network rollouts where a breakdown gets expensive fast. On compliance I rely on the Group&#x27;s legal and finance teams, and I want a clear owner for each risk.\">🔊<\/button> I plan ahead: a continuity plan, a second source for critical components, and rollout milestones reviewed every week. In Moscow and at Feu Vert I ran network rollouts where a breakdown gets expensive fast. On compliance I rely on the Group's legal and finance teams, and I want a clear owner for each risk.<\/p>\n<\/div>\n<h2 id=\"conex-7\">Q&amp;A: commercial<\/h2>\n<h3>How do you negotiate price and terms with brands?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I start with what the brand is really buying: not a screen, an outcome in the store. Then I price the whole package: device, installation, content and service. I trade volume or duration against price, never price alone. And I keep the purchasing director&#x27;s needs in view: a clear price, deadlines kept, a reliable partner.\">🔊<\/button> I start with what the brand is really buying: not a screen, an outcome in the store. Then I price the whole package: device, installation, content and service. I trade volume or duration against price, never price alone. And I keep the purchasing director's needs in view: a clear price, deadlines kept, a reliable partner.<\/p>\n<\/div>\n<h3>Have you answered complex international tenders?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Yes. Throughout my consulting work I answered briefs from retailers and brands, from proposal to rollout: Feu Vert, Giphar, E.Leclerc, La Prairie. I structure each response the same way: understanding of the need, technical offer, rollout plan, commercial terms.\">🔊<\/button> Yes. Throughout my consulting work I answered briefs from retailers and brands, from proposal to rollout: Feu Vert, Giphar, E.Leclerc, La Prairie. I structure each response the same way: understanding of the need, technical offer, rollout plan, commercial terms.<\/p>\n<\/div>\n<p><strong>[to complete: one international tender: client, what you proposed, the result.]<\/strong><\/p>\n<h3>How do you work with Retail Design and Purchasing Directors?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I know both sides of the table. A retail design director wants a device that fits the counter and rolls out identically in every country. A purchasing director wants a clear price, deadlines respected and a reliable partner. At Sephora I was the buyer of this kind of solution, so I speak both languages.\">🔊<\/button> I know both sides of the table. A retail design director wants a device that fits the counter and rolls out identically in every country. A purchasing director wants a clear price, deadlines respected and a reliable partner. At Sephora I was the buyer of this kind of solution, so I speak both languages.<\/p>\n<\/div>\n<h3>Your first clients will come from the group. How do you also build your own pipeline?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Two mandates at once. In the first year I would use the group&#x27;s relationships with the beauty houses to sign the first deals, because the trust already exists. In parallel I would build a pipeline outside the group: brands DIAM does not serve, multi-brand retailers, travel retail. That is what gives the subsidiary its own value.\">🔊<\/button> Two mandates at once. In the first year I would use the group's relationships with the beauty houses to sign the first deals, because the trust already exists. In parallel I would build a pipeline outside the group: brands DIAM does not serve, multi-brand retailers, travel retail. That is what gives the subsidiary its own value.<\/p>\n<\/div>\n<h3>How would you analyse the market and the competition?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I would map the field in three layers: hardware, software and content, and integration and service. Then I would look at where CONEX is already strong, such as global field support and connectivity, and where customers feel pain. Decisions would rest on a short list of numbers: win rate, margin by offer, installed base.\">🔊<\/button> I would map the field in three layers: hardware, software and content, and integration and service. Then I would look at where CONEX is already strong, such as global field support and connectivity, and where customers feel pain. Decisions would rest on a short list of numbers: win rate, margin by offer, installed base.<\/p>\n<\/div>\n<h2 id=\"conex-8\">Q&amp;A: sustainability<\/h2>\n<h3>How do you see sustainability in in-store digital?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"It belongs in the design brief from day one. CONEX already publishes strong points: remote maintenance that avoids store visits, a glue-free design so devices can be recycled, local production, and WEEE certification in France. I would push it further with data: energy use per device and recycling rates, reported to clients. At NUT I worked on reuse and reverse flows with Veolia and Citeo, so I know how to turn this into a business argument.\">🔊<\/button> It belongs in the design brief from day one. CONEX already publishes strong points: remote maintenance that avoids store visits, a glue-free design so devices can be recycled, local production, and WEEE certification in France. I would push it further with data: energy use per device and recycling rates, reported to clients. At NUT I worked on reuse and reverse flows with Veolia and Citeo, so I know how to turn this into a business argument.<\/p>\n<\/div>\n<h2 id=\"conex-9\">Q&amp;A: personal and practical<\/h2>\n<h3>What is your main weakness?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Impatience with long validation loops. When I know what needs doing, slow processes frustrate me. I have learned to anticipate: I prepare my requests earlier and bring the decision-makers in at the start. I am most effective in organisations where decisions move quickly.\">🔊<\/button> Impatience with long validation loops. When I know what needs doing, slow processes frustrate me. I have learned to anticipate: I prepare my requests earlier and bring the decision-makers in at the start. I am most effective in organisations where decisions move quickly.<\/p>\n<\/div>\n<p><strong>Second answer, your own (28/10/2026): carrying problems alone, in leader's voice.<\/strong><\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"My main weakness is that I tend to carry a problem on my own for too long before I bring in the right people. At my level, that has a cost: a decision made alone is slower and less robust than one challenged early. So I changed my method. On every important decision, I name the two or three people whose expertise I need, and I consult them before I commit, not after. I would rather be challenged on Monday than corrected three months later.\">🔊<\/button> My main weakness is that I tend to carry a problem on my own for too long before I bring in the right people. At my level, that has a cost: a decision made alone is slower and less robust than one challenged early. So I changed my method. On every important decision, I name the two or three people whose expertise I need, and I consult them before I commit, not after. I would rather be challenged on Monday than corrected three months later.<\/p>\n<\/div>\n<p>Why this version: a leader's job is not to know everything but to get the right expertise in the room fast. The weakness becomes a decision-making habit, not a personal difficulty. Method confirmed by you on 28/10/2026. One weakness per interview, under 30 seconds.<\/p>\n<h3>Where do you see yourself in five years?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In five years, I want CONEX to be a recognised pillar of the DIAM group: a profitable digital subsidiary, with its own pipeline of clients and a team strong enough to run without me in the room. That is my first goal, and it will take my full attention. If we deliver, the results will speak for themselves, and I would be glad to take on a wider scope inside the group. But I want to earn that by transforming CONEX first.\">🔊<\/button> In five years, I want CONEX to be a recognised pillar of the DIAM group: a profitable digital subsidiary, with its own pipeline of clients and a team strong enough to run without me in the room. That is my first goal, and it will take my full attention. If we deliver, the results will speak for themselves, and I would be glad to take on a wider scope inside the group. But I want to earn that by transforming CONEX first.<\/p>\n<\/div>\n<p>Your draft had the right ambition. Two upgrades: a concrete picture of what CONEX looks like (profitable, own pipeline, autonomous team), and the order of priorities, so the interviewer does not hear a candidate already looking at the next job. Keep it to 30 seconds.<\/p>\n<h3>The ad asks for bilingual English. How is yours?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"English is a working language for me. I led teams in Moscow and Manchester and I have presented in English throughout my career. I am sharpening my spoken English right now, so it never slows a negotiation. Professional, and improving every week.\">🔊<\/button> English is a working language for me. I led teams in Moscow and Manchester and I have presented in English throughout my career. I am sharpening my spoken English right now, so it never slows a negotiation. Professional, and improving every week.<\/p>\n<\/div>\n<p>Never say \"bilingual\" and never say \"I get by\".<\/p>\n<h3>Are you available for New York and a December start?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Yes. One week in six in New York works for me, and early December is realistic. I can structure my consultancy so that it does not get in the way.\">🔊<\/button> Yes. One week in six in New York works for me, and early December is realistic. I can structure my consultancy so that it does not get in the way.<\/p>\n<\/div>\n<p><strong>[to decide, then say in one sentence: what you keep of Jaizkibel and your NUT shares.]<\/strong><\/p>\n<h3>What are your compensation expectations?<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"We have already covered this: around a hundred thousand euros plus a company car. I am open on the split between fixed and variable, and on what the variable depends on. I would rather look at the package as a whole.\">🔊<\/button> We have already covered this: around a hundred thousand euros plus a company car. I am open on the split between fixed and variable, and on what the variable depends on. I would rather look at the package as a whole.<\/p>\n<\/div>\n<p>Clarify once, in private, whether €100k is the fixed part or the total.<\/p>\n<h2 id=\"conex-10\">Key sentences for this role<\/h2>\n<p>Short, spoken, each one carrying a fact. Say them aloud until they sound like you.<\/p>\n<ol>\n<li><strong>Your thread.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"For twenty-five years I have designed and run retail spaces, from Sephora&#x27;s 540 stores to my own businesses.\">🔊<\/button> For twenty-five years I have designed and run retail spaces, from Sephora's 540 stores to my own businesses.<\/p>\n<\/div>\n<\/li>\n<li><strong>Sephora.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"At Sephora I was VP of Visual Merchandising for EMEA: 540 stores, 11 countries, an eleven-million-euro budget, and over 70 openings a year.\">🔊<\/button> At Sephora I was VP of Visual Merchandising for EMEA: 540 stores, 11 countries, an eleven-million-euro budget, and over 70 openings a year.<\/p>\n<\/div>\n<\/li>\n<li><strong>Dia-Mart.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I co-founded Dia-Mart and ran it for ten years: a fifteen-person subsidiary with a two-million-euro P&amp;L.\">🔊<\/button> I co-founded Dia-Mart and ran it for ten years: a fifteen-person subsidiary with a two-million-euro P&amp;L.<\/p>\n<\/div>\n<\/li>\n<li><strong>NUT, the technology.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"At NUT we built a full reuse ecosystem: container-tracking software, blockchain traceability, and collection machines with computer vision, all connected over cellular.\">🔊<\/button> At NUT we built a full reuse ecosystem: container-tracking software, blockchain traceability, and collection machines with computer vision, all connected over cellular.<\/p>\n<\/div>\n<\/li>\n<li><strong>NUT, the funding.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I led the fundraising: 1.1 million euros raised and 600,000 in public grants, with partners like Veolia and Citeo.\">🔊<\/button> I led the fundraising: 1.1 million euros raised and 600,000 in public grants, with partners like Veolia and Citeo.<\/p>\n<\/div>\n<\/li>\n<li><strong>The buyer's side.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I was the buyer at Sephora, so I know how a Retail Design Director decides, what they refuse, and what convinces them.\">🔊<\/button> I was the buyer at Sephora, so I know how a Retail Design Director decides, what they refuse, and what convinces them.<\/p>\n<\/div>\n<\/li>\n<li><strong>DIAM.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I have worked with DIAM before, at Sephora, so I know how seriously they work with the big beauty houses.\">🔊<\/button> I have worked with DIAM before, at Sephora, so I know how seriously they work with the big beauty houses.<\/p>\n<\/div>\n<\/li>\n<li><strong>International.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"In Moscow I led local teams for three years across a chain of more than 1,300 stores, so I am comfortable managing across cultures and time zones.\">🔊<\/button> In Moscow I led local teams for three years across a chain of more than 1,300 stores, so I am comfortable managing across cultures and time zones.<\/p>\n<\/div>\n<\/li>\n<li><strong>Management.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I set clear goals and checkpoints, then I give people room to decide how to get there.\">🔊<\/button> I set clear goals and checkpoints, then I give people room to decide how to get there.<\/p>\n<\/div>\n<\/li>\n<li><strong>Why this role.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I have already led teams and P&amp;Ls. What draws me here is the scale: a strong industrial group behind me, and a business already live in dozens of countries.\">🔊<\/button> I have already led teams and P&amp;Ls. What draws me here is the scale: a strong industrial group behind me, and a business already live in dozens of countries.<\/p>\n<\/div>\n<\/li>\n<li><strong>Start-up and group.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"A subsidiary needs the speed of a start-up and the transparency a group expects, and I have lived both.\">🔊<\/button> A subsidiary needs the speed of a start-up and the transparency a group expects, and I have lived both.<\/p>\n<\/div>\n<\/li>\n<li><strong>Two mandates.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"The first deals come from the group&#x27;s relationships; the lasting value comes from a pipeline the subsidiary builds on its own.\">🔊<\/button> The first deals come from the group's relationships; the lasting value comes from a pipeline the subsidiary builds on its own.<\/p>\n<\/div>\n<\/li>\n<li><strong>Finance, with candour.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I am a commercial and operational leader, so I build strong finance support from day one and I read the numbers every week.\">🔊<\/button> I am a commercial and operational leader, so I build strong finance support from day one and I read the numbers every week.<\/p>\n<\/div>\n<\/li>\n<li><strong>Design sense.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"A screen should disappear into the merchandising, not sit on top of it.\">🔊<\/button> A screen should disappear into the merchandising, not sit on top of it.<\/p>\n<\/div>\n<\/li>\n<li><strong>Sustainability.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Sustainability belongs in the brief from day one: devices designed to be repaired, recycled and monitored for energy use.\">🔊<\/button> Sustainability belongs in the brief from day one: devices designed to be repaired, recycled and monitored for energy use.<\/p>\n<\/div>\n<\/li>\n<li><strong>English.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"English is a working language for me, and I am sharpening it right now, so it never slows a negotiation.\">🔊<\/button> English is a working language for me, and I am sharpening it right now, so it never slows a negotiation.<\/p>\n<\/div>\n<\/li>\n<li><strong>Opening a discussion.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I do not know CONEX from the inside, so I would rather hear how you describe it.\">🔊<\/button> I do not know CONEX from the inside, so I would rather hear how you describe it.<\/p>\n<\/div>\n<\/li>\n<li><strong>Closing.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"What you describe is a small tech business with its own P&amp;L inside a strong industrial group, selling to clients I know from the inside. If you need someone who can be operational without six months of ramp-up on the sector, that is my profile.\">🔊<\/button> What you describe is a small tech business with its own P&amp;L inside a strong industrial group, selling to clients I know from the inside. If you need someone who can be operational without six months of ramp-up on the sector, that is my profile.<\/p>\n<\/div>\n<\/li>\n<li><strong>A blocked project.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"When a CEO blocked my concept, I turned the presentation into a briefing reset and aligned the whole committee in the room.\">🔊<\/button> When a CEO blocked my concept, I turned the presentation into a briefing reset and aligned the whole committee in the room.<\/p>\n<\/div>\n<\/li>\n<li><strong>Owning a mistake.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"The brief had drifted, and that was on me, so I apologised to my team and we reworked the routes together.\">🔊<\/button> The brief had drifted, and that was on me, so I apologised to my team and we reworked the routes together.<\/p>\n<\/div>\n<\/li>\n<li><strong>Brief in writing.<\/strong>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"After the reset, I put the new brief in writing and got the sponsor and my creative director to validate it.\">🔊<\/button> After the reset, I put the new brief in writing and got the sponsor and my creative director to validate it.<\/p>\n<\/div>\n<\/li>\n<\/ol>\n<p><strong>[to complete before the next interview: for sentence 7, the client and your role in the pitch with DIAM.]<\/strong><\/p>\n<h2 id=\"conex-11\">Questions to ask<\/h2>\n<h3>The recruiter<\/h3>\n<ol>\n<li><em>Why is the role open: a new position, a replacement, or a change in structure?<\/em>\n<\/li>\n<li><em>What is the exact scope: the full P&amp;L, a team of about ten, and what share of revenue comes from Group business units?<\/em>\n<\/li>\n<li><em>How much autonomy would I have relative to the Europe Director, and what is the legal status?<\/em>\n<\/li>\n<li><em>How many candidates are in the running, and what is the timeline? Who do I meet next?<\/em>\n<\/li>\n<li><em>Does the Group lean towards a tech specialist or a luxury operator?<\/em>\n<\/li>\n<li><em>What does the variable depend on, and which benefits come with it?<\/em>\n<\/li>\n<\/ol>\n<h3>The Europe Director and the Group<\/h3>\n<ol>\n<li><em>What are the three outcomes this role must deliver in the first twelve months?<\/em>\n<\/li>\n<li><em>What share of revenue comes from DIAM's own clients, and what share from outside the group?<\/em>\n<\/li>\n<li><em>How is revenue split between devices, installation and recurring services?<\/em>\n<\/li>\n<li><em>The website speaks of 60+ countries on one page and 43 on another. How do you count countries and devices?<\/em>\n<\/li>\n<li><em>How do you position AI and computer vision today, since the website focuses on connected screens and field service?<\/em>\n<\/li>\n<li><em>Where do you see the next phase of growth for the digital arm under Ardian's ownership: new clients, new regions, acquisitions?<\/em>\n<\/li>\n<li><em>What does the subsidiary decide alone, and what goes up to the Group?<\/em>\n<\/li>\n<li><em>How do you want sustainability reporting to appear in the offer to clients: energy data, recycling rates?<\/em>\n<\/li>\n<li><em>What would tell you, a year from now, that I have been successful in this role?<\/em>\n<\/li>\n<\/ol>\n<h2 id=\"conex-12\">VMSD wording to borrow<\/h2>\n<p>Expressions seen on <a href=\"https://vmsd.com/\" target=\"_blank\" rel=\"noopener\">VMSD<\/a> in October 2026, with a way to use each one in a sentence about in-store digital. The sentences are yours to adapt; the articles stay at the source.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Expression<\/th><th>Use it like this<\/th><\/tr><\/thead><tbody>\n<tr><td>story-driven narratives<\/td><td>The content on the screens should tell a story, not repeat a price.<\/td><\/tr>\n<tr><td>warm minimalism<\/td><td>In luxury, I favour warm minimalism: fewer, stronger visuals.<\/td><\/tr>\n<tr><td>clean, minimalist installations<\/td><td>A clean, minimalist installation lets the product stay the hero.<\/td><\/tr>\n<tr><td>immersive, multilayered concepts<\/td><td>For a flagship, an immersive, multilayered concept is justified. For a counter, it is too much.<\/td><\/tr>\n<tr><td>responsive screens<\/td><td>Responsive screens react to the shopper, so the message fits the moment.<\/td><\/tr>\n<tr><td>motion-triggered content<\/td><td>Motion-triggered content wakes the screen when a shopper approaches the counter.<\/td><\/tr>\n<tr><td>tactile, immediate, physical brand experience<\/td><td>After hours online, shoppers want a tactile, immediate, physical brand experience.<\/td><\/tr>\n<tr><td>modular designs<\/td><td>Modular designs can be reused or reconfigured from one campaign to the next.<\/td><\/tr>\n<tr><td>recycled and paper-based materials<\/td><td>Recycled and paper-based materials are becoming the default for displays.<\/td><\/tr>\n<tr><td>fully circular surfacing<\/td><td>A store can use fully circular surfacing: recycled and recyclable panels.<\/td><\/tr>\n<tr><td>post-consumer waste<\/td><td>The panels are made from post-consumer waste.<\/td><\/tr>\n<tr><td>remotely control thousands of locations<\/td><td>One team can update content and monitor devices across thousands of locations remotely.<\/td><\/tr>\n<tr><td>transparent window LED display<\/td><td>A transparent window LED display keeps the window open while it carries the message.<\/td><\/tr>\n<tr><td>pixel pitch<\/td><td>The pixel pitch decides how close the shopper can stand before the image breaks up.<\/td><\/tr>\n<tr><td>differentiation is essential<\/td><td>In a crowded mall, differentiation is essential.<\/td><\/tr>\n<tr><td>design as an investment for future retail growth<\/td><td>I present store design as an investment for future growth, with numbers behind it.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"conex-13\">DIAM in-house interviews (half-day, HR + operational)<\/h2>\n<p>Updated 28/10/2026 after confirming that retail3D is a DIAM group sister company (30 designers and architects, Levallois-Perret, joined group 2018) and that CONEX headcount is approximately 30 people (Welcome to the Jungle).<\/p>\n<h3>What changes from the recruiter call<\/h3>\n<p>You are no longer with the headhunter. DIAM HR and operational leads will test three things Michel Adé did not:<\/p>\n<ol>\n<li><strong>Group culture fit<\/strong> — you come from the client side (Sephora bought from DIAM). Can you cross to the other side of the table without condescension?\n<\/li>\n<li><strong>Knowledge of retail3D<\/strong> — 30-person sister agency. You applied for a similar role at DR Retail. Name it: it is a strong signal.\n<\/li>\n<li><strong>Digital inside an industrial context<\/strong> — DIAM makes furniture; CONEX adds digital to it. They want someone who understands both, not just the screen.\n<\/li>\n<\/ol>\n<h3>Q&amp;A for DIAM HR<\/h3>\n<p><strong>Why DIAM, when you were on the client side?<\/strong><\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"For twenty-five years I was the person giving briefs to groups like DIAM. I know how your clients decide, what they refuse, and what convinces them. Coming from the client side is not a gap — it is the profile you need to sell digital solutions to retail design and purchasing directors.\">🔊<\/button> For twenty-five years I was the person giving briefs to groups like DIAM. I know how your clients decide, what they refuse, and what convinces them. Coming from the client side is not a gap — it is the profile you need to sell digital solutions to retail design and purchasing directors.<\/p>\n<\/div>\n<p><strong>Do you know retail3D?<\/strong><\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Yes. I know it as a DIAM group agency. I have worked with agencies doing exactly that work for over fifty concepts — and I actually applied for a role at DR Retail, a stand-alone retail design agency doing the same thing. That tells you where I come from. The bridge between concept design and digital deployment is the part I know best, and the natural collaboration between retail3D and CONEX is where I would start.\">🔊<\/button> Yes. I know it as a DIAM group agency. I have worked with agencies doing exactly that work for over fifty concepts — and I actually applied for a role at DR Retail, a stand-alone retail design agency doing the same thing. That tells you where I come from. The bridge between concept design and digital deployment is the part I know best, and the natural collaboration between retail3D and CONEX is where I would start.<\/p>\n<\/div>\n<p><strong>How do you see yourself inside the group — autonomous or integrated?<\/strong><\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Both at once. The subsidiary needs the speed of a start-up and the group needs clear numbers and aligned standards. I would agree early on what CONEX decides alone and what goes to the Europe Director. I would also build a working relationship with retail3D from day one: a digital device that fits the brief is sold twice as easily.\">🔊<\/button> Both at once. The subsidiary needs the speed of a start-up and the group needs clear numbers and aligned standards. I would agree early on what CONEX decides alone and what goes to the Europe Director. I would also build a working relationship with retail3D from day one: a digital device that fits the brief is sold twice as easily.<\/p>\n<\/div>\n<p><strong>Are you comfortable with the compensation discussed?<\/strong><\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Yes. We covered this with the recruiter: around a hundred thousand euros plus a company car. I am open on the split between fixed and variable.\">🔊<\/button> Yes. We covered this with the recruiter: around a hundred thousand euros plus a company car. I am open on the split between fixed and variable.<\/p>\n<\/div>\n<p><strong>Availability for a December start and one week in six in New York?<\/strong><\/p>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"Yes to both. I can structure my consultancy so it does not get in the way.\">🔊<\/button> Yes to both. I can structure my consultancy so it does not get in the way.<\/p>\n<\/div>\n<h3>Key sentence — retail3D connection (English)<\/h3>\n<div class=\"say\">\n<p><button class=\"spk\" type=\"button\" title=\"Écouter\" data-say=\"I actually applied for a role at DR Retail — a retail design agency doing exactly what retail3D does inside your group. That tells you where I come from. The bridge between design and digital deployment is the part I know best.\">🔊<\/button> I actually applied for a role at DR Retail — a retail design agency doing exactly what retail3D does inside your group. That tells you where I come from. The bridge between design and digital deployment is the part I know best.<\/p>\n<\/div>\n<h3>Updated facts for the half-day<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Entity<\/th><th>Confirmed figure<\/th><th>Source<\/th><\/tr><\/thead><tbody>\n<tr><td>retail3D headcount<\/td><td>~30 experts (designers, retail architects)<\/td><td>Job listing, Levallois-Perret<\/td><\/tr>\n<tr><td>retail3D address<\/td><td>55 bis rue Édouard Vaillant, 92300 Levallois-Perret<\/td><td>Job listing<\/td><\/tr>\n<tr><td>retail3D in DIAM<\/td><td>joined the group 2018<\/td><td>DIAM site<\/td><\/tr>\n<tr><td>CONEX headcount<\/td><td>~30 people<\/td><td>Welcome to the Jungle (DIAM group page)<\/td><\/tr>\n<tr><td>CONEX legal name<\/td><td>Conex Digital LLC<\/td><td>Registry / R<\/td><\/tr>\n<tr><td>CONEX hubs<\/td><td>Americas (New York), Europe (Les Mureaux + Levallois), APAC<\/td><td>CONEX site<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Do not give year of founding for CONEX: sources conflict (2017 vs 2018).<\/p>\n<h3>Additional pitfalls for DIAM interviews<\/h3>\n<ul>\n<li>Do not position yourself as someone who managed agencies like DIAM — position yourself as someone who understands the brief on both sides.\n<\/li>\n<li>Do not compare DIAM unfavourably to any other group you worked with.\n<\/li>\n<li>Do not speak of retail3D as a competitor to your past work: it is a sister company and a future ally.\n<\/li>\n<li>With HR: no strategy talk, no Group figures beyond what is on the website and the Ardian press release.\n<\/li>\n<\/ul>\n<h2 id=\"conex-14\">Pitfalls<\/h2>\n<ul>\n<li>Never claim to be bilingual; say professional and improving.\n<\/li>\n<li>With the recruiter, no strategy talk on CONEX and no figures you cannot source. Ask how they describe it.\n<\/li>\n<li>Do not reopen salary or the New York rotation: confirm them in one sentence.\n<\/li>\n<li>Do not mention any other search or the Gulf.\n<\/li>\n<li>Present Jaizkibel as continuing and NUT as a shareholding: decide the wording before the call and say it once.\n<\/li>\n<li>Do not criticise a former employer or a client.\n<\/li>\n<li>No round invented figures: only those of your CV and the sources above.\n<\/li>\n<li>Check the ad is still live before each exchange.\n<\/li>\n<\/ul>"}, {"id": "sources", "titre": "Sources", "html": "<h1>Sources: interviews and transcripts<\/h1>\n<p>These sources hold spoken English from retail, merchandising and store-design professionals. A ✓ marks the pages opened and read on 06/10/2026. The other links come from search results and still need opening to confirm their content. The texts are not copied here: read or listen at the source.<\/p>\n<h2 id=\"sources-0\">Interviews with a full transcript<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Source<\/th><th>Speaker<\/th><th>What you find there<\/th><\/tr><\/thead><tbody>\n<tr><td>✓ <a href=\"https://www.retailrevolutionpodcast.com/blog/transcript-carissa-barrett\" target=\"_blank\" rel=\"noopener\">Retail Revolution Podcast, Carissa Barrett<\/a><\/td><td>VP of Retail, Byredo (luxury fragrance and beauty)<\/td><td>A transcript of roughly 6,000 to 7,000 words (25 to 30 minutes). Natural spoken English: a career in visual merchandising, sensory experience, clienteling, team management, reopening a store after the crisis. Very close to your beauty and luxury world.<\/td><\/tr>\n<tr><td>✓ <a href=\"https://rethink.industries/podcast/designed-to-sell-visual-merchandising-for-modern-retailers/\" target=\"_blank\" rel=\"noopener\">RETHINK Retail, \"Designed to Sell\"<\/a><\/td><td>Julia Raymond Hare (host), Tom Erskine (One Door), Andrew Smith (consultant and author)<\/td><td>A complete transcript of about 27 minutes. Planograms, fixtures, localisation, field teams, performance management. Technical vocabulary in context.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"sources-1\">Written profiles and Q&amp;As<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Source<\/th><th>Content<\/th><\/tr><\/thead><tbody>\n<tr><td>✓ <a href=\"https://vmsd.com/retail-revolutionaries/\" target=\"_blank\" rel=\"noopener\">VMSD, \"Retail Revolutionaries\"<\/a><\/td><td>Twelve design and VM professionals, including the store designer of a luxury beauty brand and the global store planning and design manager of a retail brand. Short answers on concept design, rollouts, project management, teams. Dense vocabulary.<\/td><\/tr>\n<tr><td><a href=\"https://vmsd.com/retail-rock-stars/\" target=\"_blank\" rel=\"noopener\">VMSD, \"Retail Rock Stars\"<\/a> and <a href=\"https://vmsd.com/ones-watch/\" target=\"_blank\" rel=\"noopener\">\"Ones to Watch\"<\/a><\/td><td>Profiles and interviews of established or emerging designers (pages not opened).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"sources-2\">CONEX · DIAM: sources read on 27/10/2026<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Source<\/th><th>What you find there<\/th><\/tr><\/thead><tbody>\n<tr><td>✓ <a href=\"https://conexsolution.com\" target=\"_blank\" rel=\"noopener\">CONEX, home, services, work, commitments, about<\/a><\/td><td>Positioning, scale claims, the service chain, cellular connectivity, sustainability points<\/td><\/tr>\n<tr><td>✓ <a href=\"https://www.ardian.com/news-insights/press-releases/ardian-signs-exclusive-agreement-acquire-stake-diam-support-new-phase\" target=\"_blank\" rel=\"noopener\">Ardian, DIAM announcement (2 July 2024)<\/a><\/td><td>DIAM figures, brands, clients, stated growth plan<\/td><\/tr>\n<tr><td>✓ <a href=\"https://www.diaminter.com\" target=\"_blank\" rel=\"noopener\">DIAM Group<\/a> and <a href=\"https://www.prugent.com/en/services/\" target=\"_blank\" rel=\"noopener\">Prugent services<\/a><\/td><td>Expertises, eco-design and life-cycle assessment, digital through Conex<\/td><\/tr>\n<tr><td>✓ <a href=\"https://vmsd.com/category/products/in-store-technology/\" target=\"_blank\" rel=\"noopener\">VMSD, in-store technology<\/a>, <a href=\"https://vmsd.com/the-state-of-the-storefront/\" target=\"_blank\" rel=\"noopener\">The State of the Storefront<\/a>, <a href=\"https://vmsd.com/coachs-new-salt-lake-city-store-features-fully-circular-surfacing/\" target=\"_blank\" rel=\"noopener\">Coach, fully circular surfacing<\/a><\/td><td>Technical wording on displays, windows, circular materials<\/td><\/tr>\n<tr><td><a href=\"https://www.diaminter.com/wp-content/uploads/2025/06/DIAM-Rapport-ESG-2024-1.pdf\" target=\"_blank\" rel=\"noopener\">DIAM ESG report 2024 (PDF)<\/a><\/td><td>The group's sustainability commitments; the text could not be extracted automatically, open it to read<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"sources-3\">Webinar with a transcript<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Source<\/th><th>What you find there<\/th><\/tr><\/thead><tbody>\n<tr><td>✓ <a href=\"https://vimeo.com/939645600\" target=\"_blank\" rel=\"noopener\">VMSD and Shop Association masterclass: \"Re-Sparkling\" Retail, with Ian Johnston (Quinine), on Vimeo<\/a><\/td><td>One hour, host and guest speaking. Store design, trust, loyalty, cost signalling, behavioural science, staff journey. The transcript opens from the \"Transcription\" button under the video. Vocabulary and short paraphrases are in the <em>Webinar: trust, faith, loyalty<\/em> groups of Lexicon and Phrases.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"sources-4\">Podcasts<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Source<\/th><th>Remark<\/th><\/tr><\/thead><tbody>\n<tr><td>✓ <a href=\"https://vmsd.com/episode-62-ken-nisch/\" target=\"_blank\" rel=\"noopener\">VMSD, NXTLVL Experience Design<\/a> (examples: episode 62 Ken Nisch, episode 70 Samar Younes, episode 79 Jaime Schwarz)<\/td><td>The pages give the episode summary; the full conversation is in the audio. A good listening source, on sustainability, retail design, experience, AI.<\/td><\/tr>\n<tr><td>✓ <a href=\"https://www.theretailexchange.co.uk/all-podcast-episodes/tag/Visual+Merchandising\" target=\"_blank\" rel=\"noopener\">The Retail Exchange<\/a><\/td><td>Episodes with retail design leaders (IKEA, beauty, Neal's Yard Remedies). Description pages only; no transcript spotted.<\/td><\/tr>\n<tr><td><a href=\"https://podcasts.apple.com/us/podcast/how-coach-captivates-consumers-with-visual-storytelling/id1236245407?i=1000700026930\" target=\"_blank\" rel=\"noopener\">Retail Gets Real, \"How Coach captivates consumers with visual storytelling\"<\/a><\/td><td>An interview with the SVP global visual experience at Coach. To listen to; transcript unverified.<\/td><\/tr>\n<tr><td><a href=\"https://retail-insider.com/podcast/2024/01/visual-merchandising-and-its-significance-for-retailers-video-interview/\" target=\"_blank\" rel=\"noopener\">Retail Insider, \"Visual Merchandising and its Significance for Retailers\"<\/a><\/td><td>A video interview on visual merchandising.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"sources-5\">Gulf executive interviews (articles)<\/h2>\n<div class=\"tw\"><table><t ck to the essentials, …", "fr": "Si je ramène cela à l'essentiel, …", "note": ""}, {"category": "Structuring a point", "en": "Let me anchor this with an example.", "fr": "Laissez-moi l'ancrer avec un exemple.", "note": ""}, {"category": "Giving evidence", "en": "A case in point is Moscow, where …", "fr": "Un cas d'école : Moscou, où …", "note": ""}, {"category": "Giving evidence", "en": "The numbers speak for themselves: …", "fr": "Les chiffres parlent d'eux-mêmes : …", "note": ""}, {"category": "Giving evidence", "en": "That is borne out by the pilot results.", "fr": "Les résultats du pilote le confirment.", "note": "Formal"}, {"category": "Giving evidence", "en": "This is exactly what we did at Sephora, and it held across eleven countries.", "fr": "C'est exactement ce que nous avons fait chez Sephora, et cela a tenu dans onze pays.", "note": ""}, {"category": "Giving evidence", "en": "I can point to a concrete example.", "fr": "Je peux citer un exemple concret.", "note": ""}, {"category": "Giving evidence", "en": "What made the difference was …", "fr": "Ce qui a fait la différence, c'était …", "note": ""}, {"category": "Giving evidence", "en": "The turning point came when …", "fr": "Le tournant est venu quand …", "note": "Storytelling"}, {"category": "Closing a point", "en": "The upshot is a faster rollout with fewer errors.", "fr": "Au final, un déploiement plus rapide avec moins d'erreurs.", "note": ""}, {"category": "Closing a point", "en": "In short, the standard travels and the store adapts.", "fr": "En bref, le standard voyage et le magasin s'adapte.", "note": ""}, {"category": "Closing a point", "en": "That is the heart of it.", "fr": "C'est le cœur du sujet.", "note": ""}, {"category": "Closing a point", "en": "So the takeaway is …", "fr": "Donc ce qu'il faut retenir, c'est …", "note": ""}, {"category": "Closing a point", "en": "I will leave it there, and I am happy to go deeper.", "fr": "Je m'arrête là, et je peux approfondir.", "note": ""}, {"category": "Buying time", "en": "That is a fair challenge. Let me think it through.", "fr": "C'est une objection légitime. Laissez-moi y réfléchir.", "note": ""}, {"category": "Buying time", "en": "Give me a moment to find the right example.", "fr": "Laissez-moi un instant pour trouver le bon exemple.", "note": ""}, {"category": "Buying time", "en": "If I understand correctly, you are asking …", "fr": "Si je comprends bien, vous demandez …", "note": "Restating buys thinking time and checks understanding"}, {"category": "Buying time", "en": "Let me come at it from a different angle.", "fr": "Laissez-moi l'aborder sous un autre angle.", "note": ""}, {"category": "Buying time", "en": "I want to get this right, so bear with me.", "fr": "Je veux bien faire, donc patientez un instant.", "note": ""}, {"category": "Buying time", "en": "Let me structure my answer.", "fr": "Laissez-moi structurer ma réponse.", "note": ""}, {"category": "Clarifying and probing", "en": "Could you unpack that a little?", "fr": "Pourriez-vous développer un peu ?", "note": ""}, {"category": "Clarifying and probing", "en": "When you say premium, what do you have in mind?", "fr": "Quand vous dites premium, qu'avez-vous en tête ?", "note": ""}, {"category": "Clarifying and probing", "en": "What would success look like to you?", "fr": "À quoi ressemblerait le succès pour vous ?", "note": ""}, {"category": "Clarifying and probing", "en": "Where do you see the biggest gap today?", "fr": "Où voyez-vous le plus gros écart aujourd'hui ?", "note": ""}, {"category": "Clarifying and probing", "en": "Help me understand the constraint here.", "fr": "Aidez-moi à comprendre la contrainte.", "note": ""}, {"category": "Clarifying and probing", "en": "Is that a fixed requirement, or is there room to flex?", "fr": "Est-ce une exigence ferme, ou y a-t-il de la marge ?", "note": ""}, {"category": "Clarifying and probing", "en": "So what I am hearing is …", "fr": "Donc ce que j'entends, c'est …", "note": "Playback"}, {"category":
