      ${go('histoires','A story to tell','Sephora, L\'Étoile, Feu Vert, UX Retail Design, NUT: the STAR structure, with gaps to fill.')}
      ${go('questions','The recruiter\'s questions','The ones to ask and the ones to expect, with answers of three to five sentences.')}
      ${go('oral','Control: stress, rhythm, pushback','Answer first, landing a point, stress shifts, connected speech, handling pushback.')}
      ${go('lexique','A trade word',`${DATA.lexique.length} entries with French gloss, example, stress and a YouGlish link.`)}
      ${go('phrases','A ready-made phrase',`${DATA.phrases.length} phrases: structuring, evidence, disagreeing with grace, business case, meetings, negotiation.`)}
      ${go('niveauc','Level C: expressive words',`${DATA.niveauc.length} entries: expressive adjectives, pivot words, spoken idioms, hedging, collocations, phrasal verbs.`)}
      ${go('cibles','Prepare MAF, Amouage or Chalhoub','Verified facts, your angle, likely questions, questions to ask.')}
      ${go('conex','Prepare CONEX · DIAM (Expertise Center Manager)','The ad block by block, verified facts, 32 questions with answers, 21 key sentences, questions to ask, VMSD wording.')}
      ${go('sources','Real interviews to read or hear','Retail and visual-merchandising transcripts, podcasts, pronunciation tools.')}
    </div>
    <h2>Add or correct</h2>
    <div class="card">
      <p>Texts are edited in the <code>contenu</code> folder: pages in <code>.md</code> files (Notepad), lists in <code>lexique.csv</code>, <code>phrases.csv</code> and <code>niveau_c.csv</code> (Excel, semicolon separator). Then double-click <code>construire.bat</code> and this page rebuilds itself.</p>
    </div>`;
}

/* ---------- lexicon ---------- */
function ygUrl(en){
  const w = en.split(' / ')[0].replace(/\([^)]*\)/g,'').replace(/…/g,'').trim();
  return 'https://youglish.com/pronounce/' + encodeURIComponent(w) + '/english';
}
function sayText(en){ return en.split(' / ')[0].replace(/\([^)]*\)/g,'').replace(/…/g,'').trim(); }
function renderLexique(){
  const L = DATA.lexique;
  const doms = [...new Set(L.map(x => x.domain))];
  $('#main').innerHTML = `<h1>Lexicon</h1>
    <p>${L.length} entries. "Stress" shows where the stress falls (capitals = stressed syllable). <b>YG</b> opens YouGlish: the word in real videos.</p>
    <div class="tools">
      <input id="lf" type="search" placeholder="Filter…" aria-label="Filter the lexicon">
      <select id="ld" aria-label="Domain"><option value="">All domains</option>${doms.map(d => `<option>${esc(d)}</option>`).join('')}</select>
    </div>
    <div class="count" id="lc"></div><div class="tw"><table><thead><tr><th>English</th><th>Stress</th><th>French</th><th>Example</th></tr></thead><tbody id="lb"></tbody></table></div>`;
  const draw = () => {
    const f = $('#lf').value.toLowerCase(), d = $('#ld').value;
    const rows = L.filter(x => (!d || x.domain === d) && (!f || (x.en + ' ' + x.fr + ' ' + x.example).toLowerCase().includes(f)));
    $('#lc').textContent = rows.length + (rows.length === 1 ? ' result' : ' results');
    let last = '', h = '';
    rows.forEach(x => {
      if(!d && x.domain !== last){ h += `<tr><th colspan="4">${esc(x.domain)}</th></tr>`; last = x.domain; }
      h += `<tr><td><button class="spk" type="button" data-say="${esc(sayText(x.en))}">🔊</button><span class="en">${esc(x.en)}</span><a class="yg" href="${ygUrl(x.en)}" target="_blank" rel="noopener">YG</a></td>
        <td class="say-txt">${esc(x.stress||'')}</td><td>${esc(x.fr)}</td>
        <td>${x.example ? `<button class="spk" type="button" data-say="${esc(x.example)}">🔊</button>${esc(x.example)}` : ''}</td></tr>`;
    });
    $('#lb').innerHTML = h;
  };
  $('#lf').addEventListener('input', draw); $('#ld').addEventListener('change', draw); draw();
}

/* ---------- phrases ---------- */
function renderPhrases(){
  const P = DATA.phrases;
  const cats = [...new Set(P.map(x => x.category))];
  $('#main').innerHTML = `<h1>Phrases</h1><p>${P.length} phrases ready to say. 🔊 reads the phrase aloud.</p>
    <div class="tools"><input id="pf" type="search" placeholder="Filter…" aria-label="Filter the phrases"></div>
    <div class="chips" id="pc"></div><div class="count" id="pn"></div><div class="tw"><table><thead><tr><th>English</th><th>French</th><th>Note</th></tr></thead><tbody id="pb"></tbody></table></div>`;
  let cur = '';
  const chips = $('#pc');
  chips.innerHTML = `<button class="chip" type="button" aria-pressed="true" data-c="">All</button>` + cats.map(c => `<button class="chip" type="button" aria-pressed="false" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; cur = b.dataset.c; chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); draw(); });
  const draw = () => {
    const f = $('#pf').value.toLowerCase();
    const rows = P.filter(x => (!cur || x.category === cur) && (!f || (x.en + ' ' + x.fr).toLowerCase().includes(f)));
    $('#pn').textContent = rows.length + (rows.length === 1 ? ' phrase' : ' phrases');
    let last = '', h = '';
    rows.forEach(x => {
      if(!cur && x.category !== last){ h += `<tr><th colspan="3">${esc(x.category)}</th></tr>`; last = x.category; }
      h += `<tr><td><button class="spk" type="button" data-say="${esc(x.en.replace(/…/g,''))}">🔊</button><span class="en">${esc(x.en)}</span></td><td>${esc(x.fr)}</td><td class="say-txt">${esc(x.note||'')}</td></tr>`;
    });
    $('#pb').innerHTML = h;
  };
  $('#pf').addEventListener('input', draw); draw();
}

/* ---------- Level C ---------- */
function renderLevelC(){
  const N = DATA.niveauc;
  const types = [...new Set(N.map(x => x.type))];
  $('#main').innerHTML = `<h1>Level C</h1>
    <p>${N.length} entries to sound precise and natural: expressive adjectives, pivot words, spoken idioms, hedging and diplomacy, intensifiers, trade collocations, advanced phrasal verbs. The tag shows the register. Use an idiom only when it fits you, and rarely: one well-placed idiom beats five.</p>
    <div class="tools"><input id="nf" type="search" placeholder="Filter…" aria-label="Filter Level C"></div>
    <div class="chips" id="nc"></div><div class="count" id="nn"></div>
    <div class="tw"><table><thead><tr><th>Expression</th><th>Meaning</th><th>Example</th></tr></thead><tbody id="nb"></tbody></table></div>`;
  let cur = '';
  const chips = $('#nc');
  chips.innerHTML = `<button class="chip" type="button" aria-pressed="true" data-c="">All</button>` + types.map(c => `<button class="chip" type="button" aria-pressed="false" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; cur = b.dataset.c; chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); draw(); });
  const draw = () => {
    const f = $('#nf').value.toLowerCase();
    const rows = N.filter(x => (!cur || x.type === cur) && (!f || (x.en + ' ' + x.meaning + ' ' + x.fr + ' ' + x.example).toLowerCase().includes(f)));
    $('#nn').textContent = rows.length + (rows.length === 1 ? ' entry' : ' entries');
    let last = '', h = '';
    rows.forEach(x => {
      if(!cur && x.type !== last){ h += `<tr><th colspan="3">${esc(x.type)}</th></tr>`; last = x.type; }
      h += `<tr><td><button class="spk" type="button" data-say="${esc(sayText(x.en))}">🔊</button><span class="en">${esc(x.en)}</span> <span class="tag">${esc(x.register||'')}</span><span class="fr">${esc(x.fr)}</span></td>
        <td>${esc(x.meaning)}</td>
        <td>${x.example ? `<button class="spk" type="button" data-say="${esc(x.example)}">🔊</button>${esc(x.example)}` : ''}</td></tr>`;
    });
    $('#nb').innerHTML = h;
  };
  $('#nf').addEventListener('input', draw); draw();
}

/* ---------- global search ---------- */
function mk(t, q){
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(t.length > 220 ? t.slice(0, 220) + '…' : t);
  const a = Math.max(0, i - 70), b = Math.min(t.length, i + q.length + 140);
  return (a ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length, b)) + (b < t.length ? '…' : '');
}
function renderSearch(q){
  const ql = q.toLowerCase();
  setActive('');
  const lex = DATA.lexique.filter(x => (x.en + ' ' + x.fr + ' ' + x.example).toLowerCase().includes(ql)).slice(0, 15);
  const phr = DATA.phrases.filter(x => (x.en + ' ' + x.fr).toLowerCase().includes(ql)).slice(0, 15);
  const lvc = DATA.niveauc.filter(x => (x.en + ' ' + x.meaning + ' ' + x.fr + ' ' + x.example).toLowerCase().includes(ql)).slice(0, 20);
  const blk = DATA.blocs.filter(x => x.t.toLowerCase().includes(ql)).slice(0, 25);
  const clr = "$('#q').value='';setTimeout(route,0)";
  let h = `<h1>Results for “${esc(q)}”</h1>`;
  if(lex.length) h += '<h2>Lexicon</h2>' + lex.map(x => `<div class="hit"><b>${esc(x.en)}</b>: ${esc(x.fr)}<small>${esc(x.example||'')}</small></div>`).join('') + `<p><a href="#lexique" onclick="${clr}">Open the lexicon</a></p>`;
  if(lvc.length) h += '<h2>Level C</h2>' + lvc.map(x => `<div class="hit"><button class="spk" type="button" data-say="${esc(sayText(x.en))}">🔊</button><b>${esc(x.en)}</b> <span class="tag">${esc(x.type)}</span><small>${esc(x.meaning)} — ${esc(x.example||'')}</small></div>`).join('') + `<p><a href="#niveauc" onclick="${clr}">Open Level C</a></p>`;
  if(phr.length) h += '<h2>Phrases</h2>' + phr.map(x => `<div class="hit"><button class="spk" type="button" data-say="${esc(x.en.replace(/…/g,''))}">🔊</button> ${esc(x.en)}<small>${esc(x.fr)}</small></div>`).join('');
  if(blk.length) h += '<h2>In the pages</h2>' + blk.map(x => `<div class="hit"><small><a href="#${x.p}" onclick="${clr}">${esc(x.pt)}</a>${x.s ? ' › ' + esc(x.s) : ''}</small>${mk(x.t, q)}</div>`).join('');
  if(!lex.length && !phr.length && !lvc.length && !blk.length) h += '<p>No result.</p>';
  $('#main').innerHTML = h;
}
let tmo;
$('#q').addEventListener('input', () => { clearTimeout(tmo); tmo = setTimeout(route, 160); });
route();
</script>
